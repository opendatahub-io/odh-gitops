dependencies:
  agentSandbox:
    dependencies: {}
    enabled: auto
    olm:
      channel: preview-0.9
      name: agent-sandbox-operator
      namespace: agent-sandbox-system
  certManager:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable-v1
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
  clusterObservability:
    dependencies:
      opentelemetry: true
    enabled: auto
    olm:
      channel: stable
      name: cluster-observability-operator
      namespace: openshift-cluster-observability-operator
      operatorGroupName: openshift-cluster-observability-operator
  customMetricsAutoscaler:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable
      name: openshift-custom-metrics-autoscaler-operator
      namespace: openshift-keda
  jobSet:
    config:
      spec:
        logLevel: Normal
        operatorLogLevel: Normal
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable-v1.0
      name: job-set
      namespace: openshift-jobset-operator
      targetNamespaces:
      - openshift-jobset-operator
  kueue:
    config:
      spec:
        config:
          integrations:
            frameworks:
            - Deployment
            - Pod
            - PyTorchJob
            - RayCluster
            - RayJob
            - StatefulSet
            - TrainJob
        managementState: Managed
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable-v1.4
      name: kueue-operator
      namespace: openshift-kueue-operator
  leaderWorkerSet:
    config:
      spec:
        logLevel: Normal
        managementState: Managed
        operatorLogLevel: Normal
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable-v1.0
      name: leader-worker-set
      namespace: openshift-lws-operator
      targetNamespaces:
      - openshift-lws-operator
  loki:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable-6.5
      createNamespace: true
      createOperatorGroup: true
      name: loki-operator
      namespace: openshift-operators-redhat
  nfd:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable
      name: nfd
      namespace: openshift-nfd
      targetNamespaces:
      - openshift-nfd
  nvidiaGPUOperator:
    dependencies:
      nfd: true
    enabled: auto
    olm:
      channel: v25.10
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      source: certified-operators
      targetNamespaces:
      - nvidia-gpu-operator
  opentelemetry:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable
      name: opentelemetry-product
      namespace: openshift-opentelemetry-operator
  rhcl:
    config:
      authorinoServiceCaTrust: false
      authorinoSpec:
        clusterWide: true
        listener:
          tls:
            certSecretRef:
              name: authorino-server-cert
            enabled: true
        oidcServer:
          tls:
            enabled: false
        replicas: 1
      spec: {}
      tlsEnabled: false
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable
      name: rhcl-operator
      namespace: kuadrant-system
  tempo:
    dependencies:
      opentelemetry: true
    enabled: auto
    olm:
      channel: stable
      name: tempo-product
      namespace: openshift-tempo-operator
