ai-grid-o11y-hub:
  enabled: false
ai-grid-o11y-spoke:
  collector:
    namespace: redhat-ods-monitoring
    port: 8890
  credential:
    enabled: false
  enabled: false
argocd:
  enabled: false
components:
  aiHub:
    defaults:
      odh:
        instancesNamespace: odh-model-registry
      rhoai:
        instancesNamespace: rhoai-model-registries
    dependencies: {}
    dsc: {}
  aigateway:
    dependencies: {}
    dsc:
      batchGateway: {}
      modelsAsAService: {}
    modelsAsAService:
      gateway:
        annotations:
          opendatahub.io/managed: "false"
          security.opendatahub.io/authorino-tls-bootstrap: "true"
        create: auto
        name: maas-default-gateway
        namespace: openshift-ingress
        openshiftRoute:
          enabled: false
          gatewayParametersName: maas-gateway-options
          host: ""
          name: maas-gateway-route
          servingCertSecretName: maas-gw-service-tls
        spec:
          gatewayClassName: maas-gateway-class
          listeners:
          - allowedRoutes:
              namespaces: null
            name: https
            port: 443
            protocol: HTTPS
      gatewayClass:
        create: auto
        name: maas-gateway-class
        spec:
          controllerName: openshift.io/gateway-controller/v1
  aipipelines:
    dependencies: {}
    dsc: {}
  dashboard:
    dependencies: {}
    dsc:
      maasPortal: {}
      standard: {}
  data:
    dependencies: {}
    dsc:
      dataRegistry: {}
      featureStore: {}
  kserve:
    dependencies:
      certManager: true
      customMetricsAutoscaler: false
      leaderWorkerSet: false
      rhcl: true
    dsc:
      modelExpress: {}
      nim: {}
      rawDeploymentServiceConfig: Headless
    gateway:
      create: auto
      gridModelClient:
        create: auto
        namespace: redhat-ai-grid
        serviceAccountName: grid-model-client
        tokenSecretName: grid-model-client-token
      labels:
        istio.io/rev: openshift-gateway
      name: openshift-ai-inference
      namespace: openshift-ingress
      spec:
        gatewayClassName: openshift-ai-inference
        listeners:
        - allowedRoutes:
            namespaces: null
          name: https
          port: 443
          protocol: HTTPS
    gatewayClass:
      create: auto
      name: openshift-ai-inference
      spec:
        controllerName: openshift.io/gateway-controller/v1
  kueue:
    dependencies:
      certManager: true
      kueue: true
    dsc:
      defaultClusterQueueName: default
      defaultLocalQueueName: default
  mcplifecycleoperator:
    dependencies: {}
    dsc: {}
  mlflowoperator:
    dependencies: {}
    dsc: {}
  ogx:
    dependencies:
      nfd: true
      nvidiaGPUOperator: true
    dsc: {}
  ray:
    dependencies:
      certManager: true
    dsc: {}
  sparkoperator:
    dependencies: {}
    dsc:
      managementState: Removed
  trainer:
    dependencies:
      certManager: true
      jobSet: true
    dsc: {}
  trustyai:
    dependencies: {}
    dsc:
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
  workbenches:
    defaults:
      odh:
        workbenchNamespace: opendatahub
      rhoai:
        workbenchNamespace: rhods-notebooks
    dependencies: {}
    dsc:
      workbenchesV2: {}
dependencies:
  agentSandbox:
    dependencies: {}
    enabled: auto
    olm:
      channel: preview-0.9
      name: agent-sandbox-operator
      namespace: agent-sandbox-system
  certManager:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable-v1
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
  clusterObservability:
    dependencies:
      opentelemetry: true
    enabled: auto
    olm:
      channel: stable
      name: cluster-observability-operator
      namespace: openshift-cluster-observability-operator
      operatorGroupName: openshift-cluster-observability-operator
  customMetricsAutoscaler:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable
      name: openshift-custom-metrics-autoscaler-operator
      namespace: openshift-keda
  jobSet:
    config:
      spec:
        logLevel: Normal
        operatorLogLevel: Normal
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable-v1.0
      name: job-set
      namespace: openshift-jobset-operator
      targetNamespaces:
      - openshift-jobset-operator
  kueue:
    config:
      spec:
        config:
          integrations:
            frameworks:
            - Deployment
            - Pod
            - PyTorchJob
            - RayCluster
            - RayJob
            - StatefulSet
            - TrainJob
        managementState: Managed
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable-v1.5
      name: kueue-operator
      namespace: openshift-kueue-operator
  leaderWorkerSet:
    config:
      spec:
        logLevel: Normal
        managementState: Managed
        operatorLogLevel: Normal
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable-v1.0
      name: leader-worker-set
      namespace: openshift-lws-operator
      targetNamespaces:
      - openshift-lws-operator
  loki:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable-6.5
      createNamespace: true
      createOperatorGroup: true
      name: loki-operator
      namespace: openshift-operators-redhat
  nfd:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable
      name: nfd
      namespace: openshift-nfd
      targetNamespaces:
      - openshift-nfd
  nvidiaGPUOperator:
    dependencies:
      nfd: true
    enabled: auto
    olm:
      channel: v25.10
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      source: certified-operators
      targetNamespaces:
      - nvidia-gpu-operator
  opentelemetry:
    dependencies: {}
    enabled: auto
    olm:
      channel: stable
      name: opentelemetry-product
      namespace: openshift-opentelemetry-operator
  rhcl:
    config:
      authorinoServiceCaTrust: false
      authorinoSpec:
        clusterWide: true
        listener:
          tls:
            certSecretRef:
              name: authorino-server-cert
            enabled: true
        oidcServer:
          tls:
            enabled: false
        replicas: 1
      authorinoTrustedCA: {}
      spec: {}
      tlsEnabled: false
    dependencies:
      certManager: true
    enabled: auto
    olm:
      channel: stable
      name: rhcl-operator
      namespace: kuadrant-system
  tempo:
    dependencies:
      opentelemetry: true
    enabled: auto
    olm:
      channel: stable
      name: tempo-product
      namespace: openshift-tempo-operator
global:
  relatedImages: []
  skipCrdCheck: false
grid-enrollment:
  enabled: false
  fullnameOverride: grid-enrollment
  image:
    digest: sha256:c931a7e0daa66093233ed1fc807438d33dd61372eadc4bb8e93871be8ee46dbd
labels: {}
olm:
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
operator:
  enabled: true
  odh:
    applicationsNamespace: opendatahub
    monitoringNamespace: opendatahub
    olm:
      channel: fast-3
      createNamespace: true
      name: opendatahub-operator
      namespace: opendatahub-operator-system
      source: community-operators
  rhoai:
    applicationsNamespace: redhat-ods-applications
    monitoringNamespace: redhat-ods-monitoring
    olm:
      channel: beta
      createNamespace: true
      name: rhods-operator
      namespace: redhat-ods-operator
      source: redhat-operators
  type: odh
praxis-gateway:
  affinity: {}
  args:
  - --config
  - /etc/praxis/praxis.yaml
  command: []
  commonLabels: {}
  env: []
  envTpl: false
  fips:
    required: false
  fullnameOverride: grid-gateway
  global:
    relatedImages: []
    skipCrdCheck: false
  grid:
    networkName: ""
    siteName: ""
  gridIdentity:
    caSecretName: ""
    mountPath: /etc/praxis/tls
    tlsSecretName: ""
  health:
    adminProbeCommand: []
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
      tcpSocket: {}
    readiness:
      initialDelaySeconds: 3
      periodSeconds: 5
      tcpSocket: {}
  image:
    digest: sha256:0c3ecddfffdfba7c068d645e8bd878aeba6ac92570d6b50a88430ada0c92602b
    flavor: grid-gateway
    pullPolicy: IfNotPresent
    repository: ghcr.io/praxis-proxy/grid-gateway
    tag: v0.3.0
  imagePullSecrets: []
  imageUser:
    enabled: auto
    gid: 101
    uid: 100
  listenerTls:
    mountPath: /etc/praxis/listener-tls
    secretName: ""
  loadBalancerScope: internal
  log:
    filter: ""
    level: ""
  metricsListener:
    enabled: auto
    existingSecret: ""
    fromNamespaces: []
    mountPath: /etc/praxis/metrics-tls
    port: 9443
    service:
      annotations: {}
    serviceMonitor:
      caConfigMap:
        key: ca.crt
        name: ""
      enabled: auto
      interval: 30s
      labels: {}
      scrapeTimeout: ""
  mountReconciliation:
    enabled: false
    gatewayRef: ""
    managedCredentialNames: []
    network: ""
    operator:
      namespace: ""
      serviceAccount: grid-operator
    rbac:
      create: true
    releaseHelmMounts: false
  nameOverride: ""
  networkPolicy:
    enabled: false
    from: []
  nodeSelector: {}
  overlay:
    configMapName: ""
    mountPath: /etc/praxis/routing
    sidecar:
      dataKey: routing-overlay.json
      enabled: true
      image:
        pullPolicy: IfNotPresent
        repository: ghcr.io/praxis-proxy/grid-overlay-sync
        tag: v0.3.0
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
  platform: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  port:
    containerPort: 8080
    name: ""
    protocol: TCP
  praxisConfig:
    byo:
      configMapName: ""
      inline: |
        admin:
          metrics_address: "127.0.0.1:9901"
        listeners:
          - name: default
            address: "0.0.0.0:8080"
            filter_chains: [default]
        filter_chains:
          - name: default
            filters:
              - filter: static_response
                status: 200
                headers:
                  - name: Content-Type
                    value: application/json
                body: '{"status": "ok", "server": "praxis"}'
                conditions:
                  - when:
                      path: "/"
              - filter: static_response
                status: 404
                headers:
                  - name: Content-Type
                    value: application/json
                body: '{"error": "not found"}'
      key: praxis.yaml
      tpl: false
    operator:
      allowUnauthenticatedExposure: false
      configMapName: ""
      gridServing:
        configMapName: ""
        enabled: false
        gatewayRefName: ""
        mountPath: /etc/praxis/grid-serving
        networkName: ""
    render:
      auth:
        allowPrivateEndpoint: false
        allowUnauthenticatedExposure: false
        mode: ""
        prefix: 'Bearer '
        stripAuthorization: true
        timeoutSecs: 5
        validateCA:
          configMapName: ""
          key: ca.crt
          mountPath: /etc/praxis/validate-ca
          secretName: ""
        validateUrl: ""
      bodyLimits: {}
      gridServing:
        backendCAs: []
        configMapName: ""
        enabled: false
        gatewayRefName: ""
        mountPath: /etc/praxis/grid-serving
        networkName: ""
        siteRoute:
          availability: {}
          prefixAffinity: {}
          sovereignty:
            header: ""
            mode: enforce
      model: ""
      peerTrust:
        allowAnyGridSite: false
        certDigests: []
        digest: ""
        mode: pin
        nextDigest: ""
        rateLimit: {}
        spiffeId: ""
        spiffeIds: []
      provider:
        allowedPaths:
        - /v1/chat/completions
        - /v1/completions
        - /v1/models
        - /v1/embeddings
        - /v1/messages
        - /v1/responses
      role: consumer
      runtime: {}
      telemetry:
        enabled: false
        environment: ""
        otlpEndpoint: ""
        serviceName: ""
        serviceVersion: ""
    source: byo
  priorityClassName: ""
  providerCredentials: []
  replicaCount: 1
  resources: {}
  route:
    annotations: {}
    enabled: false
    host: ""
    tls:
      destinationCACertificate: ""
      termination: passthrough
  service:
    annotations: {}
    enabled: true
    loadBalancerIP: ""
    port: 8080
    type: ""
  shutdownDelaySeconds: 5
  tolerations: []
  topologySpreadConstraints: []
  upstreamCA:
    key: ca.crt
    mountPath: /etc/praxis/upstream-ca
    secretName: ""
