apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
