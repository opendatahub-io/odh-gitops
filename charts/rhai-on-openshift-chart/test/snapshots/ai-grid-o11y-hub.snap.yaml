---
# Source: rhai-on-openshift-chart/charts/ai-grid-o11y-hub/templates/store/lokistack.yaml
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: "usage-logs"
  namespace: "ai-grid-o11y"
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-o11y-hub
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-usage-logs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.3.0"
spec:
  size: "1x.demo"
  managementState: Managed
  storageClassName: "gp3-csi"
  storage:
    schemas:
      - effectiveDate: "2026-10-01"
        version: v13
    secret:
      name: "usage-logs-object-storage"
      type: s3
    tls:
      caName: "openshift-service-ca-bundle"
      caKey: service-ca.crt
  tenants:
    mode: openshift-logging
  limits:
    global:
      otlp:
        streamLabels:
          resourceAttributes:
          - name: cluster_name
          - name: cluster_id
          - name: service.name
      retention:
        days: 30

