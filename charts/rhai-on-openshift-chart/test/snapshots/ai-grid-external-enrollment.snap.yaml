apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grid-gateway
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: praxis-gateway
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: praxis-gateway
      app.kubernetes.io/instance: release-test
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              grid.opendatahub.io/gateway-client: "true"
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 8080
          protocol: TCP


---
# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grid-gateway-config
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: praxis-gateway
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
data:
  praxis.yaml: |
    admin:
      metrics_address: "127.0.0.1:9901"
    listeners:
      - name: default
        address: "0.0.0.0:8080"
        filter_chains: [default]
    filter_chains:
      - name: default
        filters:
          - filter: static_response
            status: 200
            headers:
              - name: Content-Type
                value: application/json
            body: '{"status": "ok", "server": "praxis"}'
            conditions:
              - when:
                  path: "/"
          - filter: static_response
            status: 404
            headers:
              - name: Content-Type
                value: application/json
            body: '{"error": "not found"}'


