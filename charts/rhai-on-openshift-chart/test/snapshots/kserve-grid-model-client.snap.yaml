# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment-db
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: db
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Postgres refuses a key with group/world access. The Secret mount is
        # root-owned and group-readable, so copy the pair into an emptyDir owned
        # by this uid with the key at 0600.
        - name: db-tls-perms
          image: "quay.io/sclorg/postgresql-16-c9s:20260923"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          command:
            - sh
            - -c
            - "install -m 0644 /tls-src/tls.crt /tls/server.crt && install -m 0600 /tls-src/tls.key /tls/server.key"
          volumeMounts:
            - name: db-tls-src
              mountPath: /tls-src
              readOnly: true
            - name: db-tls
              mountPath: /tls
      containers:
        - name: postgres
          image: "quay.io/sclorg/postgresql-16-c9s:20260923"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: "enrollment"
            - name: POSTGRESQL_USER
              value: "enrollment"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-enrollment-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "enrollment", "-d", "enrollment"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # sclorg writes passwd and generated config under HOME at startup.
            - name: db-home
              mountPath: /var/lib/pgsql
            - name: db-tmp
              mountPath: /tmp
            - name: db-run
              mountPath: /var/run/postgresql
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: db-tls
              mountPath: /tls
              readOnly: true
            - name: db-ssl-config
              mountPath: /opt/app-root/src/postgresql-cfg
              readOnly: true
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: db-home
          emptyDir: {}
        - name: db-tmp
          emptyDir: {}
        - name: db-run
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: grid-enrollment-db
        - name: db-tls-src
          secret:
            secretName: grid-db-serving-tls
        - name: db-tls
          emptyDir: {}
        - name: db-ssl-config
          configMap:
            name: grid-enrollment-db-tls


---
# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: enrollment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: enrollment
    spec:
      enableServiceLinks: false
      serviceAccountName: grid-enrollment
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The service applies its schema on first connect, so it only needs the
        # DB reachable. External DBs are assumed already up.
        - name: wait-for-db
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          image: "quay.io/sclorg/postgresql-16-c9s:20260923"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command:
