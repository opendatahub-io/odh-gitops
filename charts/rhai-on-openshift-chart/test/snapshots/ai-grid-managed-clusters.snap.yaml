      metadata:
        name: grid-bootstrap-membership
      spec:
        remediationAction: enforce
        severity: high
        evaluationInterval:
          compliant: watch
          noncompliant: watch
        # Withdraw peer records and observer permissions on membership removal.
        # The local GridSite remains authoritative and is never copied back.
        pruneObjectBehavior: DeleteAll
        object-templates-raw: |
          {{hub $network := "grid" hub}}
          {{hub $label := "grid.praxis.fast/member" hub}}
          {{hub $labelValue := "true" hub}}
          {{hub $workName := "grid-site-observer" hub}}
          {{hub $namespace := "grid-system" hub}}
          {{hub $clusterSet := "default" hub}}
          {{ range $name := (list "gridnetworks.grid.praxis.fast" "gridsites.grid.praxis.fast") }}
          {{ $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name }}
          {{ $established := false }}
          {{ range $condition := $crd.status.conditions }}
          {{ if and (eq $condition.type "Established") (eq $condition.status "True") }}
          {{ $established = true }}
          {{ end }}
          {{ end }}
          {{ if not $established }}{{ fail (printf "waiting for CRD %s to be Established" $name) }}{{ end }}
          {{ end }}
          {{hub $members := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: grid-operator-config
                namespace: {{hub printf "%q" $namespace hub}}
              data:
                config.yaml: |
                  version: 1
                  site:
                    name: {{hub printf "%q" .ManagedClusterName hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: {{hub printf "%q" (printf "%s-reader" $workName) hub}}
                labels:
                  open-cluster-management.io/aggregate-to-work: "true"
              rules:
              - apiGroups: [grid.praxis.fast]
                resources: [gridsites]
                verbs: [get, list, watch]
          {{hub range $cluster := $members hub}}
          {{hub if and (eq (index $cluster.metadata.labels $label) $labelValue) (or (eq $clusterSet "global") (eq (index $cluster.metadata.labels "cluster.open-cluster-management.io/clusterset") $clusterSet)) (ne $cluster.metadata.name $.ManagedClusterName) hub}}
