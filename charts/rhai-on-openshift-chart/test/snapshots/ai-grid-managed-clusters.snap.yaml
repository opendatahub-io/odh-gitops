                gridNetworkRef: {{hub printf "%q" $network hub}}
                {{hub if ne $gatewayAddress "" hub}}
                gatewayEndpoint:
                  address: {{hub printf "%q" $gatewayAddress hub}}
                  tls:
                    mode: Mutual
                    serverName: {{hub if ne $gatewayServerName "" hub}}{{hub printf "%q" $gatewayServerName hub}}{{hub else hub}}{{hub printf "%q" (printf "%s.grid.internal" $site) hub}}{{hub end hub}}
