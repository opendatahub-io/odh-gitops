                  address: {{hub printf "%q" $signalsAddress hub}}
                  {{hub else hub}}
                  address: null
                  {{hub end hub}}
                  {{hub if ne $signalsServerName "" hub}}
                  serverName: {{hub printf "%q" $signalsServerName hub}}
                  {{hub else hub}}
                  serverName: null
                  {{hub end hub}}
                {{hub else hub}}
                signalsEndpoint: null
                {{hub end hub}}
                {{hub if ne $region "" hub}}
                region: {{hub printf "%q" $region hub}}
                {{hub else hub}}
                region: null
                {{hub end hub}}
                {{hub if ne $zone "" hub}}
                zone: {{hub printf "%q" $zone hub}}
                {{hub else hub}}
                zone: null
                {{hub end hub}}
                {{hub if ne $sovereigntyZone "" hub}}
                sovereigntyZone: {{hub printf "%q" $sovereigntyZone hub}}
                {{hub else hub}}
                sovereigntyZone: null
                {{hub end hub}}
          {{hub end hub}}
          {{hub end hub}}
          {{hub end hub}}
          {{hub end hub}}
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-bootstrap-membership-network
      spec:
        remediationAction: enforce
        severity: high
