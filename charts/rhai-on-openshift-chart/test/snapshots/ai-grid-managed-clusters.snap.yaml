# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-bootstrap-membership
  namespace: default
  annotations:
    # A denied lookup cannot watch its dependency; RBAC changes must retry it.
    policy.open-cluster-management.io/trigger-update: "9e13da720620b5377550978b51cf593e7b82d7135035d8209940d2a8ee9936ec"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: grid-bootstrap-membership
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-bootstrap-membership
      spec:
        remediationAction: enforce
        severity: high
        evaluationInterval:
          compliant: watch
          noncompliant: watch
        # Withdraw peer records and observer permissions on membership removal.
        # The local GridSite remains authoritative and is never copied back.
        pruneObjectBehavior: DeleteAll
        object-templates-raw: |
          {{hub $network := "grid" hub}}
          {{hub $label := "grid.praxis.fast/member" hub}}
          {{hub $labelValue := "true" hub}}
          {{hub $workName := "grid-site-observer" hub}}
          {{hub $namespace := "grid-system" hub}}
          {{hub $clusterSet := "default" hub}}
          {{ range $name := (list "gridnetworks.grid.praxis.fast" "gridsites.grid.praxis.fast") }}
          {{ $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name }}
          {{ $established := false }}
          {{ range $condition := $crd.status.conditions }}
          {{ if and (eq $condition.type "Established") (eq $condition.status "True") }}
          {{ $established = true }}
          {{ end }}
          {{ end }}
          {{ if not $established }}{{ fail (printf "waiting for CRD %s to be Established" $name) }}{{ end }}
          {{ end }}
          {{hub $members := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: grid-operator-config
                namespace: {{hub printf "%q" $namespace hub}}
              data:
                config.yaml: |
                  version: 1
                  site:
                    name: {{hub printf "%q" .ManagedClusterName hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: {{hub printf "%q" (printf "%s-reader" $workName) hub}}
                labels:
                  open-cluster-management.io/aggregate-to-work: "true"
              rules:
              - apiGroups: [grid.praxis.fast]
                resources: [gridsites]
                verbs: [get, list, watch]
          {{hub range $cluster := $members hub}}
          {{hub if and (eq (index $cluster.metadata.labels $label) $labelValue) (or (eq $clusterSet "global") (eq (index $cluster.metadata.labels "cluster.open-cluster-management.io/clusterset") $clusterSet)) (ne $cluster.metadata.name $.ManagedClusterName) hub}}
          {{hub $work := lookup "work.open-cluster-management.io/v1" "ManifestWork" $cluster.metadata.name $workName hub}}
          {{hub range $manifest := $work.status.resourceStatus.manifests hub}}
          {{hub $site := "" hub}}
          {{hub $siteNetwork := "" hub}}
          {{hub $gatewayAddress := "" hub}}
          {{hub $gatewayServerName := "" hub}}
          {{hub $signalsAddress := "" hub}}
          {{hub $signalsServerName := "" hub}}
          {{hub $region := "" hub}}
          {{hub $zone := "" hub}}
          {{hub $sovereigntyZone := "" hub}}
          {{hub range $field := $manifest.statusFeedback.values hub}}
          {{hub if eq $field.name "siteName" hub}}{{hub $site = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "networkName" hub}}{{hub $siteNetwork = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "gatewayAddress" hub}}{{hub $gatewayAddress = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "gatewayServerName" hub}}{{hub $gatewayServerName = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "signalsAddress" hub}}{{hub $signalsAddress = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "signalsServerName" hub}}{{hub $signalsServerName = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "region" hub}}{{hub $region = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "zone" hub}}{{hub $zone = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "sovereigntyZone" hub}}{{hub $sovereigntyZone = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub end hub}}
          {{hub/* A member without a gateway still calls its peers, which admit only the sites they hold. */hub}}
          {{hub if and (eq $site $cluster.metadata.name) (eq $siteNetwork $network) hub}}
          - complianceType: mustonlyhave
            metadataComplianceType: musthave
            objectDefinition:
              apiVersion: grid.praxis.fast/v1alpha1
              kind: GridSite
              metadata:
                name: {{hub printf "%q" $site hub}}
                labels:
                  grid.praxis.fast/membership: declared
                  grid.praxis.fast/auto-discovered: "false"
              spec:
                gridNetworkRef: {{hub printf "%q" $network hub}}
                {{hub if ne $gatewayAddress "" hub}}
                gatewayEndpoint:
                  address: {{hub printf "%q" $gatewayAddress hub}}
                  tls:
                    mode: Mutual
                    serverName: {{hub if ne $gatewayServerName "" hub}}{{hub printf "%q" $gatewayServerName hub}}{{hub else hub}}{{hub printf "%q" (printf "%s.grid.internal" $site) hub}}{{hub end hub}}
                {{hub else hub}}
                gatewayEndpoint: null
                {{hub end hub}}
                # Replace the peer spec to remove legacy aliases, including explicit nulls.
                # Preserve controller-owned labels, annotations, and status.
                trust: null
                {{hub if or (ne $signalsAddress "") (ne $signalsServerName "") hub}}
                signalsEndpoint:
                  {{hub if ne $signalsAddress "" hub}}
                  address: {{hub printf "%q" $signalsAddress hub}}
                  {{hub else hub}}
                  address: null
                  {{hub end hub}}
                  {{hub if ne $signalsServerName "" hub}}
                  serverName: {{hub printf "%q" $signalsServerName hub}}
                  {{hub else hub}}
                  serverName: null
                  {{hub end hub}}
                {{hub else hub}}
                signalsEndpoint: null
                {{hub end hub}}
                {{hub if ne $region "" hub}}
                region: {{hub printf "%q" $region hub}}
                {{hub else hub}}
                region: null
                {{hub end hub}}
                {{hub if ne $zone "" hub}}
                zone: {{hub printf "%q" $zone hub}}
                {{hub else hub}}
                zone: null
                {{hub end hub}}
                {{hub if ne $sovereigntyZone "" hub}}
                sovereigntyZone: {{hub printf "%q" $sovereigntyZone hub}}
                {{hub else hub}}
                sovereigntyZone: null
                {{hub end hub}}
          {{hub end hub}}
          {{hub end hub}}
          {{hub end hub}}
          {{hub end hub}}
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-bootstrap-membership-network
      spec:
        remediationAction: enforce
        severity: high
        evaluationInterval:
          compliant: watch
          noncompliant: watch
        # A membership removal must not delete the grid or reset its identity.
        pruneObjectBehavior: None
        object-templates-raw: |
          {{hub $stateNamespace := "default" hub}}
          {{hub $stateName := "grid-bootstrap-state" hub}}
          {{hub $network := "grid" hub}}
          {{hub $namespace := "grid-system" hub}}
          {{hub $identity := "grid-site-identity" hub}}
          {{hub $ca := "grid-ca" hub}}
          {{hub $gateway := "grid-gateway" hub}}
          {{ range $name := (list "gridnetworks.grid.praxis.fast" "gridsites.grid.praxis.fast") }}
          {{ $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name }}
          {{ $established := false }}
          {{ range $condition := $crd.status.conditions }}
          {{ if and (eq $condition.type "Established") (eq $condition.status "True") }}
          {{ $established = true }}
          {{ end }}
          {{ end }}
          {{ if not $established }}{{ fail (printf "waiting for CRD %s to be Established" $name) }}{{ end }}
          {{ end }}
          {{hub $state := lookup "v1" "ConfigMap" $stateNamespace $stateName hub}}
          {{hub $id := index $state.data "gridId" hub}}
          {{hub if not $id hub}}{{hub fail "waiting for bootstrap grid identity" hub}}{{hub end hub}}
          {{hub if not $state.immutable hub}}{{hub fail (printf "bootstrap grid identity is not immutable; patch %s in place with {\"immutable\":true}" $stateName) hub}}{{hub end hub}}
          {{ $namespace := {{hub printf "%q" $namespace hub}} }}
          {{ $identity := {{hub printf "%q" $identity hub}} }}
          {{ $ca := {{hub printf "%q" $ca hub}} }}
          {{ if not (lookup "v1" "Secret" $namespace $identity).metadata.name }}
          {{ fail "waiting for the enrolled site identity" }}{{ end }}
          {{ if not (lookup "v1" "Secret" $namespace $ca).metadata.name }}
          {{ fail "waiting for the grid trust bundle" }}{{ end }}
          {{/* Adopting a different ID would move a status-only member or wedge a spec-set one. */}}
          {{ $bootstrapId := {{hub printf "%q" $id hub}} }}
          {{ $network := {{hub printf "%q" $network hub}} }}
          {{/* All of them: a site runs one grid, and a differently named network would escape a by-name check. */}}
          {{ range (lookup "grid.praxis.fast/v1alpha1" "GridNetwork" "" "").items }}
          {{ if ne .metadata.name $network }}
          {{ fail (printf "GridNetwork %s already exists on this site; enrollment manages only GridNetwork %s and will not add a second" .metadata.name $network) }}
          {{ end }}
          {{ $existingId := "" }}
          {{ with .status }}{{ $existingId = default "" .gridId }}{{ end }}
          {{ with .spec }}{{ $existingId = default $existingId .gridId }}{{ end }}
          {{ if $existingId }}{{ if ne $existingId $bootstrapId }}
          {{ fail (printf "existing grid ID %s differs from bootstrap state %s; delete and recreate %s with %s (immutable), or recreate this GridNetwork to join %s" $existingId $bootstrapId {{hub printf "%q" $stateName hub}} $existingId $bootstrapId) }}
          {{ end }}{{ end }}
          {{ end }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: grid.praxis.fast/v1alpha1
              kind: GridNetwork
              metadata:
                name: {{hub printf "%q" $network hub}}
              spec:
                gridId: {{hub printf "%q" $id hub}}
                membership:
                  mode: Local
                signalTransport:
                  mode: poll
                peerTrust:
                  mode: spiffe
                tls:
                  siteSecretRef:
                    name: {{hub printf "%q" $identity hub}}
                    namespace: {{hub printf "%q" $namespace hub}}
                  caSecretRef:
                    name: {{hub printf "%q" $ca hub}}
                    namespace: {{hub printf "%q" $namespace hub}}
                {{hub if $gateway hub}}
                consumerGateways:
                - name: {{hub printf "%q" $gateway hub}}
                  namespace: {{hub printf "%q" $namespace hub}}
                  siteName: {{hub printf "%q" .ManagedClusterName hub}}
                {{hub end hub}}
