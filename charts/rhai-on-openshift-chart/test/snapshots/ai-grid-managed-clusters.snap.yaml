spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-gateway
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: gateway-metrics
  endpoints:
    - port: metrics
      scheme: https
      path: /metrics
      interval: 30s
      tlsConfig:
        serverName: grid-gateway-metrics.default.svc
        ca:
          configMap:
            name: "openshift-service-ca.crt"
