          {{ $established := false }}
          {{ range $condition := $crd.status.conditions }}
          {{ if and (eq $condition.type "Established") (eq $condition.status "True") }}
          {{ $established = true }}
          {{ end }}
          {{ end }}
          {{ if not $established }}{{ fail (printf "waiting for CRD %s to be Established" $name) }}{{ end }}
          {{ end }}
          {{hub $members := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: grid-operator-config
                namespace: {{hub printf "%q" $namespace hub}}
              data:
                config.yaml: |
                  version: 1
                  site:
                    name: {{hub printf "%q" .ManagedClusterName hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: {{hub printf "%q" (printf "%s-reader" $workName) hub}}
                labels:
                  open-cluster-management.io/aggregate-to-work: "true"
              rules:
              - apiGroups: [grid.praxis.fast]
                resources: [gridsites]
                verbs: [get, list, watch]
          {{hub range $cluster := $members hub}}
          {{hub if and (eq (index $cluster.metadata.labels $label) $labelValue) (or (eq $clusterSet "global") (eq (index $cluster.metadata.labels "cluster.open-cluster-management.io/clusterset") $clusterSet)) (ne $cluster.metadata.name $.ManagedClusterName) hub}}
          {{hub $work := lookup "work.open-cluster-management.io/v1" "ManifestWork" $cluster.metadata.name $workName hub}}
          {{hub range $manifest := $work.status.resourceStatus.manifests hub}}
          {{hub $site := "" hub}}
          {{hub $siteNetwork := "" hub}}
          {{hub $gatewayAddress := "" hub}}
          {{hub $gatewayServerName := "" hub}}
          {{hub $signalsAddress := "" hub}}
          {{hub $signalsServerName := "" hub}}
          {{hub $region := "" hub}}
          {{hub $zone := "" hub}}
          {{hub $sovereigntyZone := "" hub}}
          {{hub range $field := $manifest.statusFeedback.values hub}}
          {{hub if eq $field.name "siteName" hub}}{{hub $site = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "networkName" hub}}{{hub $siteNetwork = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "gatewayAddress" hub}}{{hub $gatewayAddress = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "gatewayServerName" hub}}{{hub $gatewayServerName = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "signalsAddress" hub}}{{hub $signalsAddress = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "signalsServerName" hub}}{{hub $signalsServerName = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "region" hub}}{{hub $region = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "zone" hub}}{{hub $zone = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub if eq $field.name "sovereigntyZone" hub}}{{hub $sovereigntyZone = $field.fieldValue.string hub}}{{hub end hub}}
          {{hub end hub}}
          {{hub/* A member without a gateway still calls its peers, which admit only the sites they hold. */hub}}
          {{hub if and (eq $site $cluster.metadata.name) (eq $siteNetwork $network) hub}}
