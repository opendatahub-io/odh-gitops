# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-bootstrap-membership-hub
  namespace: default
  annotations:
    policy.open-cluster-management.io/trigger-update: "9e13da720620b5377550978b51cf593e7b82d7135035d8209940d2a8ee9936ec"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: grid-bootstrap-membership
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-bootstrap-membership-enrollment
      spec:
        remediationAction: enforce
        severity: high
        evaluationInterval:
          compliant: watch
          noncompliant: watch
        # Withdraw observers and stop renewal after inventory removal. Existing
        # shared resources (including the namespace and CA) are never pruned.
        pruneObjectBehavior: DeleteIfCreated
        object-templates-raw: |
          {{hub $label := "grid.praxis.fast/member" hub}}
          {{hub $labelValue := "true" hub}}
          {{hub $clusterSet := "default" hub}}
          {{hub $workName := "grid-site-observer" hub}}
          {{hub $namespace := "default" hub}}
          {{hub $secretPrefix := "grid-site-" hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "default"
          {{hub range $cluster := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items hub}}
          
          {{hub if and (eq (index $cluster.metadata.labels $label) $labelValue) (or (eq $clusterSet "global") (eq (index $cluster.metadata.labels "cluster.open-cluster-management.io/clusterset") $clusterSet)) hub}}
          {{hub $site := $cluster.metadata.name hub}}
          {{hub $secret := printf "%s%s" $secretPrefix $site hub}}
          - complianceType: musthave
            objectDefinition:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: "{{hub $secret hub}}"
                namespace: "default"
                labels:
                  helm.sh/chart: HELM_CHART_VERSION_REDACTED
                  app.kubernetes.io/name: grid-enrollment
                  app.kubernetes.io/instance: release-test
                  app.kubernetes.io/version: "v0.3.0"
                  app.kubernetes.io/managed-by: Helm
              spec:
                secretName: "{{hub $secret hub}}"
                commonName: "{{hub $site hub}}"
                subject:
                  organizations: ["{{hub $site hub}}"]
                uris: ["spiffe://grid.internal/site/{{hub $site hub}}"]
                dnsNames:
                  - '{{hub $site hub}}.grid.internal'
                  - '{{hub $site hub}}-signals.grid.internal'
                duration: "4320h"
                renewBefore: "1440h"
                privateKey:
                  algorithm: ECDSA
                  size: 256
                  encoding: PKCS8
                  rotationPolicy: Always
                usages: [digital signature, client auth, server auth]
                issuerRef:
                  name: "grid-ca"
                  kind: "Issuer"
                  group: "cert-manager.io"
          - complianceType: musthave
            objectDefinition:
              apiVersion: work.open-cluster-management.io/v1
              kind: ManifestWork
              metadata:
                name: {{hub printf "%q" $workName hub}}
                namespace: {{hub printf "%q" $site hub}}
              spec:
                deleteOption:
                  propagationPolicy: Orphan
                workload:
                  manifests:
                  - apiVersion: grid.praxis.fast/v1alpha1
                    kind: GridSite
                    metadata:
                      name: {{hub printf "%q" $site hub}}
                manifestConfigs:
                - resourceIdentifier:
                    group: grid.praxis.fast
                    resource: gridsites
                    name: {{hub printf "%q" $site hub}}
                  updateStrategy:
                    type: ReadOnly
                  feedbackScrapeType: Watch
                  feedbackRules:
                  - type: JSONPaths
                    jsonPaths:
                    - {name: siteName, path: .metadata.name}
                    - {name: networkName, path: .spec.gridNetworkRef}
                    - {name: gatewayAddress, path: .spec.gatewayEndpoint.address}
                    - {name: gatewayServerName, path: .spec.gatewayEndpoint.tls.serverName}
                    - {name: signalsAddress, path: .spec.signalsEndpoint.address}
                    - {name: signalsServerName, path: .spec.signalsEndpoint.serverName}
                    - {name: region, path: .spec.region}
                    - {name: zone, path: .spec.zone}
                    - {name: sovereigntyZone, path: .spec.sovereigntyZone}
          
          {{hub end hub}}
          {{hub end hub}}
