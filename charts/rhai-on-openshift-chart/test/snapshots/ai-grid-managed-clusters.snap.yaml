              value: "/etc/praxis/metrics-tls/tls.crt"
            - name: GRID_METRICS_TLS_KEY
              value: "/etc/praxis/metrics-tls/tls.key"
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
