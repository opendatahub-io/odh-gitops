        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: "grid-ca"
              namespace: "grid-system"
            data:
              ca.crt: '{{hub fromSecret "default" "grid-ca-key" "tls.crt" hub}}'


