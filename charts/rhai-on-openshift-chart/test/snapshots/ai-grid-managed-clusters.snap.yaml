        object-templates-raw: |
          {{hub $stateNamespace := "default" hub}}
          {{hub $stateName := "grid-bootstrap-state" hub}}
          {{hub $network := "grid" hub}}
          {{hub $namespace := "grid-system" hub}}
          {{hub $identity := "grid-site-identity" hub}}
          {{hub $ca := "grid-ca" hub}}
          {{hub $gateway := "grid-gateway" hub}}
          {{ range $name := (list "gridnetworks.grid.praxis.fast" "gridsites.grid.praxis.fast") }}
          {{ $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name }}
          {{ $established := false }}
          {{ range $condition := $crd.status.conditions }}
          {{ if and (eq $condition.type "Established") (eq $condition.status "True") }}
          {{ $established = true }}
          {{ end }}
          {{ end }}
          {{ if not $established }}{{ fail (printf "waiting for CRD %s to be Established" $name) }}{{ end }}
          {{ end }}
          {{hub $state := lookup "v1" "ConfigMap" $stateNamespace $stateName hub}}
          {{hub $id := index $state.data "gridId" hub}}
          {{hub if not $id hub}}{{hub fail "waiting for bootstrap grid identity" hub}}{{hub end hub}}
          {{hub if not $state.immutable hub}}{{hub fail (printf "bootstrap grid identity is not immutable; patch %s in place with {\"immutable\":true}" $stateName) hub}}{{hub end hub}}
          {{ $namespace := {{hub printf "%q" $namespace hub}} }}
          {{ $identity := {{hub printf "%q" $identity hub}} }}
          {{ $ca := {{hub printf "%q" $ca hub}} }}
          {{ if not (lookup "v1" "Secret" $namespace $identity).metadata.name }}
          {{ fail "waiting for the enrolled site identity" }}{{ end }}
          {{ if not (lookup "v1" "Secret" $namespace $ca).metadata.name }}
          {{ fail "waiting for the grid trust bundle" }}{{ end }}
          {{/* Adopting a different ID would move a status-only member or wedge a spec-set one. */}}
          {{ $bootstrapId := {{hub printf "%q" $id hub}} }}
          {{ $network := {{hub printf "%q" $network hub}} }}
          {{/* All of them: a site runs one grid, and a differently named network would escape a by-name check. */}}
          {{ range (lookup "grid.praxis.fast/v1alpha1" "GridNetwork" "" "").items }}
          {{ if ne .metadata.name $network }}
          {{ fail (printf "GridNetwork %s already exists on this site; enrollment manages only GridNetwork %s and will not add a second" .metadata.name $network) }}
          {{ end }}
          {{ $existingId := "" }}
          {{ with .status }}{{ $existingId = default "" .gridId }}{{ end }}
          {{ with .spec }}{{ $existingId = default $existingId .gridId }}{{ end }}
          {{ if $existingId }}{{ if ne $existingId $bootstrapId }}
          {{ fail (printf "existing grid ID %s differs from bootstrap state %s; delete and recreate %s with %s (immutable), or recreate this GridNetwork to join %s" $existingId $bootstrapId {{hub printf "%q" $stateName hub}} $existingId $bootstrapId) }}
          {{ end }}{{ end }}
          {{ end }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: grid.praxis.fast/v1alpha1
              kind: GridNetwork
              metadata:
                name: {{hub printf "%q" $network hub}}
              spec:
                gridId: {{hub printf "%q" $id hub}}
                membership:
                  mode: Local
                signalTransport:
                  mode: poll
                peerTrust:
                  mode: spiffe
                tls:
                  siteSecretRef:
                    name: {{hub printf "%q" $identity hub}}
                    namespace: {{hub printf "%q" $namespace hub}}
                  caSecretRef:
                    name: {{hub printf "%q" $ca hub}}
                    namespace: {{hub printf "%q" $namespace hub}}
                {{hub if $gateway hub}}
                consumerGateways:
                - name: {{hub printf "%q" $gateway hub}}
                  namespace: {{hub printf "%q" $namespace hub}}
                  siteName: {{hub printf "%q" .ManagedClusterName hub}}
                {{hub end hub}}


