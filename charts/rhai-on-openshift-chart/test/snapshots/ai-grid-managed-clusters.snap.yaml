apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-bootstrap-membership-identities
  namespace: default
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-bootstrap-membership-identities
      spec:
        remediationAction: enforce
        severity: high
        evaluationInterval:
          compliant: watch
          noncompliant: watch
        # Retain delivered identities on removal; membership controls peer access.
        pruneObjectBehavior: None
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: "grid-system"
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: kubernetes.io/tls
            metadata:
              name: "grid-site-identity"
              namespace: "grid-system"
              annotations:
                cert-manager.io/certificate-name: '{{hub printf "%s%s" "grid-site-" .ManagedClusterName hub}}'
            data:
              tls.crt: '{{hub fromSecret "default" (printf "%s%s" "grid-site-" .ManagedClusterName) "tls.crt" hub}}'
              tls.key: '{{hub fromSecret "default" (printf "%s%s" "grid-site-" .ManagedClusterName) "tls.key" hub}}'
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: "grid-ca"
              namespace: "grid-system"
            data:
              ca.crt: '{{hub fromSecret "default" "grid-ca-key" "tls.crt" hub}}'
