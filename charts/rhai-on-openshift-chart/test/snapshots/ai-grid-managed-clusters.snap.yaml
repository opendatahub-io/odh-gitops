data:
  praxis.yaml: |
    runtime:
      upstream_ca_file: "/etc/praxis/upstream-ca/ca.crt"
    admin:
      metrics_address: "127.0.0.1:9901"
    listeners:
      - name: gateway
        address: "0.0.0.0:8443"
        tls:
          certificates:
            - cert_path: "/etc/praxis/listener-tls/tls.crt"
              key_path: "/etc/praxis/listener-tls/tls.key"
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          # The caller's credential authenticates this hop only; never forward it upstream.
          - filter: headers
            request_remove: [Authorization]
          - filter: model_to_header
            header: X-Gateway-Model-Name
          - filter: grid_site_route
            model_header: X-Gateway-Model-Name
            clusters: []
