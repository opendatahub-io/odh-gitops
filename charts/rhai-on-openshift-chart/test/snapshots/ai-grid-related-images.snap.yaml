# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grid-gateway-metrics
  labels:
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: praxis-gateway
    app.kubernetes.io/version: 0.7.0
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    monitoring.opendatahub.io/scrape: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-gateway
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: gateway-metrics
  endpoints:
    - port: metrics
      scheme: https
      path: /metrics
      interval: 30s
      tlsConfig:
        serverName: grid-gateway-metrics.default.svc
        ca:
          configMap:
            name: "openshift-service-ca.crt"
            key: "service-ca.crt"
      metricRelabelings:
        # Reserve "cluster" for the managed cluster; Praxis uses it for the backend.
        - sourceLabels: [cluster]
          regex: "(.+)"
          targetLabel: backend
        - action: labeldrop
          regex: cluster

