# Source: rhai-on-openshift-chart/templates/operator/dscinitialization.yaml
apiVersion: dscinitialization.opendatahub.io/v2
kind: DSCInitialization
metadata:
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/managed-by: Helm
  name: default-dsci
spec:
  monitoring:
    managementState: Managed
    namespace: redhat-ods-monitoring
    usageLogs:
      attributes:
        cluster_id: 00000000-0000-0000-0000-000000000000
        cluster_name: my-spoke
      credentialSecret: hub-usage-logs-auth
      exporters:
        otlphttp/hub:
          endpoint: https://usage-logs-ai-grid-o11y.apps.hub.example.com/api/logs/v1/infrastructure/otlp
  applicationsNamespace: redhat-ods-applications
  trustedCABundle:
    managementState: Managed
    customCABundle: ""

