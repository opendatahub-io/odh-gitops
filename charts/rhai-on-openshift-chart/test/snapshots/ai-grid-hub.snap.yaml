# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: grid-enrollment-default-bootstrap-secrets
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: grid-enrollment-bootstrap
      expression: "request.userInfo.username == \"system:serviceaccount:default:grid-enrollment-ca-bootstrap\""
  validations:
    - expression: "(request.namespace == \"default\" && object.metadata.name in [\"enrollment-serving-tls\",\"grid-ca-bundle\",\"grid-ca-key\"])"
      message: "the grid enrollment bootstrap may only create the Secrets its chart renders"
      reason: Forbidden
    
    - expression: "!has(object.type) || object.type in [\"Opaque\",\"kubernetes.io/tls\"]"
      message: "the grid enrollment bootstrap may only create an Opaque or kubernetes.io/tls Secret, so it cannot mint a token for another ServiceAccount"
      reason: Forbidden

