# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: enrollment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: enrollment
    spec:
      enableServiceLinks: false
      serviceAccountName: grid-enrollment
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrollment
          image: "ghcr.io/praxis-proxy/grid-enrollment:v0.3.0-rc.3"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: RUST_LOG
              value: "info"
            # CA signing material (file paths; read via std::fs). Key is mounted
            # ONLY into this pod, never the gateway.
            - name: ENROLLMENT_CA_CERT
              value: /etc/grid-ca/tls.crt
            - name: ENROLLMENT_CA_KEY
              value: /etc/grid-ca/tls.key
            - name: ENROLLMENT_CA_COMMON_NAME
              value: "grid-ca"
            # In-process TLS serving cert (file paths).
            - name: ENROLLMENT_TLS_CERT
              value: /etc/grid-tls/tls.crt
            - name: ENROLLMENT_TLS_KEY
              value: /etc/grid-tls/tls.key
            - name: ENROLLMENT_LISTEN_ADDR
              value: "0.0.0.0:8443"
            - name: ENROLLMENT_AUTHZ
              value: "kube"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENROLLMENT_INVITE_SECRET_NAMESPACE
              value: "default-invites"
            - name: ENROLLMENT_TOKEN_AUDIENCE
              value: "grid-enrollment"
            - name: ENROLLMENT_CSR_RECORD
              value: "true"
            - name: ENROLLMENT_CSR_SIGNER_NAME
              value: "grid.praxis.fast/site"
            - name: DB_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: maas-db-config
                  key: DB_CONNECTION_URL
          volumeMounts:
            - name: grid-ca
              mountPath: /etc/grid-ca
              readOnly: true
            - name: grid-tls
              mountPath: /etc/grid-tls
              readOnly: true
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        # Signing key + cert. This is the only pod that mounts grid-ca-key.
        - name: grid-ca
          secret:
            secretName: grid-ca-key
        - name: grid-tls
          secret:
            secretName: enrollment-serving-tls


---
# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-gateway
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: praxis-gateway
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-gateway
      app.kubernetes.io/instance: release-test
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/name: praxis-gateway
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis
          image: ghcr.io/praxis-proxy/grid-gateway:v0.3.0-rc.3
          imagePullPolicy: "IfNotPresent"
          args:
            - --config
            - /etc/praxis/praxis.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: "TCP"
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 5
            tcpSocket:
              port: http
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: http
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              cpu: 2
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: "grid-gateway-config"
            items:
              - key: "praxis.yaml"
                path: "praxis.yaml"


