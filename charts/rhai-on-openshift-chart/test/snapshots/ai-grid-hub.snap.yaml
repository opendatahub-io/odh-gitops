    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  # create cannot be resourceName-scoped (the object does not exist yet).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/update restricted to exactly the Secrets the bootstrap manages,
  # so this SA cannot read any other Secret in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "grid-ca-key"
      - "grid-ca-bundle"
      - "enrollment-serving-tls"
    verbs: ["get", "update"]

