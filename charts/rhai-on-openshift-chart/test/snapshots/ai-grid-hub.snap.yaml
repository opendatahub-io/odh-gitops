apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: grid-enrollment-default-csr-record
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["certificates.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["certificatesigningrequests"]
  matchConditions:
    - name: grid-signer
      expression: "object.spec.signerName == \"grid.praxis.fast/site\""
  validations:
    - expression: "request.userInfo.username == \"system:serviceaccount:default:grid-enrollment\""
      message: "only the grid enrollment service may file a request under a grid signer name"
      reason: Forbidden

