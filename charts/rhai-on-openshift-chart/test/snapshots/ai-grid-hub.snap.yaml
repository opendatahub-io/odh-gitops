# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grid-provider-gateway-config
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: praxis-gateway
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "0.7.0"
    app.kubernetes.io/managed-by: Helm
data:
  praxis.yaml: |
    runtime:
      upstream_ca_file: "/etc/praxis/upstream-ca/ca.crt"
    admin:
      metrics_address: "127.0.0.1:9901"
    listeners:
      - name: gateway
        address: "0.0.0.0:8080"
        tls:
          certificates:
            - cert_path: "/etc/praxis/tls/tls.crt"
              key_path: "/etc/praxis/tls/tls.key"
          client_ca:
            ca_path: "/etc/praxis/tls/ca.crt"
          client_cert_mode: require_named
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          - filter: grid_provider
            allowed_paths:
              - "/v1/chat/completions"
              - "/v1/completions"
              - "/v1/models"
              - "/v1/embeddings"
          - filter: headers
            response_set:
              - name: X-Grid-Provider-Site
                value: "local-cluster"


