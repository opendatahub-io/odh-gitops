# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-enrollment-ca-bootstrap
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ca-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Kept for its logs until the next hook run or its TTL.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: grid-enrollment-ca-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ca-bootstrap
          image: "ghcr.io/praxis-proxy/grid-enrollment@sha256:cdb9c6f5d9ccca8f87920a19db6ba3b38faea3f0dc4153bacd3e34a00c0ab749"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command: ["enrollment", "bootstrap"]
          env:
            - name: RUST_LOG
              value: "info"
            - name: ENROLLMENT_WAIT_FOR_CONFINEMENT
              value: "true"
          args:
            - "--namespace"
            - "default"
            - "--common-name"
            - "grid-ca"
            - "--ca-key-secret"
            - "grid-ca-key"
            - "--ca-bundle-secret"
            - "grid-ca-bundle"
            - "--serving-secret"
            - "enrollment-serving-tls"
            - "--serving-dns"
            - "grid-enrollment.default.svc"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi


