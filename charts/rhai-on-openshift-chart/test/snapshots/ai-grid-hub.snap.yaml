apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: grid-enrollment-default-invite-secrets
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.3.0-rc.3"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: grid-enrollment-service
      expression: "request.userInfo.username == \"system:serviceaccount:default:grid-enrollment\""
  validations:
    
    - expression: "request.namespace == \"default-invites\" && (request.operation == \"DELETE\" ? oldObject.metadata.name.startsWith(\"grid-invite-\") : object.metadata.name.startsWith(\"grid-invite-\"))"
      message: "the grid enrollment service may only write grid-invite- Secrets, in its invite namespace"
      reason: Forbidden
    - expression: "request.operation == \"DELETE\" || !has(object.type) || object.type == \"Opaque\""
      message: "the grid enrollment service may only create an Opaque Secret, so it cannot mint a token for another ServiceAccount"
      reason: Forbidden

