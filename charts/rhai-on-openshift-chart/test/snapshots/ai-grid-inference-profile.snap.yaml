# Source: rhai-on-openshift-chart/templates/dependencies/gateway/kserve-gatewayclass.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/managed-by: Helm
    istio.io/rev: openshift-gateway
  annotations:
    grid.opendatahub.io/serving: |-
      {
        "networkName": "grid",
        "namespace": "redhat-ai-grid",
        "serviceAccount": "grid-model-client",
        "tokenSecret": "grid-model-client-token",
        "publishMetrics": true
      }
spec:
  gatewayClassName: openshift-ai-inference
  listeners:
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            grid.opendatahub.io/allowed: "true"
    name: https
    port: 443
    protocol: HTTPS

