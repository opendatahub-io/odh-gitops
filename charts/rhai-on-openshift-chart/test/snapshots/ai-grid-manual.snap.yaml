    verbs: ["get", "update"]
  # patch marks the generated credentials so Argo CD never prunes them.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "grid-enrollment-db"
    verbs: ["patch"]
  # Read and roll the builtin Postgres, and nothing else, so it serves the
  # certificate its Secret holds.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - "grid-enrollment-db"
    verbs: ["get", "patch"]

