# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment-db
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: db
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Postgres refuses a key with group/world access. The Secret mount is
        # root-owned and group-readable, so copy the pair into an emptyDir owned
        # by this uid with the key at 0600.
        - name: db-tls-perms
          image: "quay.io/sclorg/postgresql-16-c9s:20260923@sha256:b508e74304788fb4a5a2af76d8d013f20a18ee38bff3d24a705d7b730b8c0a30"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          command:
            - sh
            - -c
            - "install -m 0644 /tls-src/tls.crt /tls/server.crt && install -m 0600 /tls-src/tls.key /tls/server.key"
          volumeMounts:
            - name: db-tls-src
              mountPath: /tls-src
              readOnly: true
            - name: db-tls
              mountPath: /tls
      containers:
        - name: postgres
          image: "quay.io/sclorg/postgresql-16-c9s:20260923@sha256:b508e74304788fb4a5a2af76d8d013f20a18ee38bff3d24a705d7b730b8c0a30"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: "enrollment"
            - name: POSTGRESQL_USER
              value: "enrollment"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-enrollment-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "enrollment", "-d", "enrollment"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # sclorg writes passwd and generated config under HOME at startup.
            - name: db-home
              mountPath: /var/lib/pgsql
            - name: db-tmp
              mountPath: /tmp
            - name: db-run
              mountPath: /var/run/postgresql
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: db-tls
              mountPath: /tls
              readOnly: true
            - name: db-ssl-config
              mountPath: /opt/app-root/src/postgresql-cfg
              readOnly: true
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: db-home
          emptyDir: {}
        - name: db-tmp
          emptyDir: {}
        - name: db-run
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: grid-enrollment-db
        - name: db-tls-src
          secret:
            secretName: grid-db-serving-tls
        - name: db-tls
          emptyDir: {}
        - name: db-ssl-config
          configMap:
            name: grid-enrollment-db-tls


---
# Source: rhai-on-openshift-chart/templates/components/ai-grid.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: enrollment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: enrollment
    spec:
      enableServiceLinks: false
      serviceAccountName: grid-enrollment
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The service applies its schema on first connect, so it only needs the
        # DB reachable. External DBs are assumed already up.
        - name: wait-for-db
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          image: "quay.io/sclorg/postgresql-16-c9s:20260923@sha256:b508e74304788fb4a5a2af76d8d013f20a18ee38bff3d24a705d7b730b8c0a30"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - "until pg_isready -h grid-enrollment-db -p 5432; do echo 'waiting for db'; sleep 2; done"
      containers:
        - name: enrollment
          image: "ghcr.io/praxis-proxy/grid-enrollment@sha256:9d73ea9dee05a5e5d09437f05b42a903c867341a28c22f6e053e142693118170"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: RUST_LOG
              value: "info"
            # CA signing material (file paths; read via std::fs). Key is mounted
            # ONLY into this pod, never the gateway.
            - name: ENROLLMENT_CA_CERT
              value: /etc/grid-ca/tls.crt
            - name: ENROLLMENT_CA_KEY
              value: /etc/grid-ca/tls.key
            - name: ENROLLMENT_CA_COMMON_NAME
              value: "grid-ca"
            # In-process TLS serving cert (file paths).
            - name: ENROLLMENT_TLS_CERT
              value: /etc/grid-tls/tls.crt
            - name: ENROLLMENT_TLS_KEY
              value: /etc/grid-tls/tls.key
            - name: ENROLLMENT_LISTEN_ADDR
              value: "0.0.0.0:8443"
            - name: ENROLLMENT_AUTHZ
              value: "kube"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENROLLMENT_TOKEN_AUDIENCE
              value: "grid-enrollment"
            - name: ENROLLMENT_CSR_RECORD
              value: "true"
            - name: ENROLLMENT_CSR_SIGNER_NAME
              value: "grid.praxis.fast/site"
            - name: DB_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: grid-enrollment-db
                  key: DB_CONNECTION_URL
          volumeMounts:
            - name: grid-ca
              mountPath: /etc/grid-ca
              readOnly: true
            - name: grid-tls
              mountPath: /etc/grid-tls
              readOnly: true
            # sslrootcert for the builtin DB's verify-full connection.
            - name: grid-ca-bundle
              mountPath: /etc/grid-ca-bundle
              readOnly: true
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        # Signing key + cert. This is the only pod that mounts grid-ca-key.
        - name: grid-ca
          secret:
            secretName: grid-ca-key
        - name: grid-tls
          secret:
            secretName: enrollment-serving-tls
        - name: grid-ca-bundle
          secret:
            secretName: grid-ca-bundle


