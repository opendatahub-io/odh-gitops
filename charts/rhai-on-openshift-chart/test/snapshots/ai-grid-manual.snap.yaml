data:
  praxis.yaml: |
    admin:
      address: "127.0.0.1:9901"
    listeners:
      - name: default
        address: "0.0.0.0:8080"
        filter_chains: [default]
    filter_chains:
      - name: default
        filters:
          - filter: static_response
            status: 200
            headers:
              - name: Content-Type
                value: application/json
            body: '{"status": "ok", "server": "praxis"}'
            conditions:
              - when:
                  path: "/"
          - filter: static_response
            status: 404
            headers:
              - name: Content-Type
                value: application/json
            body: '{"error": "not found"}'


