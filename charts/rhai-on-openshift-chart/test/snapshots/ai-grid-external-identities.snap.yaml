# Source: rhai-on-openshift-chart/templates/dependencies/rhcl/authorino-service-ca.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorino
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false,DisableClientSideApplyMigration=true,Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "10"
spec:
  template:
    spec:
      containers:
        - name: authorino
          env:
            - name: SSL_CERT_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
            - name: SSL_CERT_DIR
              value: /etc/pki/tls/certs:/etc/ssl/certs
          volumeMounts:
            - name: trusted-ca-bundle
              mountPath: /etc/pki/tls/certs
              readOnly: true
      volumes:
        - name: trusted-ca-bundle
          projected:
            sources:
              - configMap:
                  name: odh-trusted-ca-bundle
              - configMap:
                  name: openshift-service-ca.crt

