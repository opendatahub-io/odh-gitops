  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-gateway
      app.kubernetes.io/instance: release-test
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/name: praxis-gateway
      annotations:
        checksum/config: b099dc29d2cd4e4e41e991034048514147121029a5e559b438d0df94324b5397
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis
          image: ghcr.io/praxis-proxy/grid-gateway@sha256:0010bc2167b5b0e13c533d6c789092566dd5f764661626b0e4dd05d37b94849b
          imagePullPolicy: "IfNotPresent"
          args:
            - --config
            - /etc/praxis/praxis.yaml
          env:
            - name: GRID_SERVING_CONFIG
              value: "/etc/praxis/grid-serving/serving-config.json"
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: 8443
              protocol: "TCP"
          readinessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - 'if command -v curl >/dev/null 2>&1; then exec curl -fsS -m 2 -o /dev/null -H
                ''Host: 127.0.0.1'' "$1"; else exec wget -q -T 2 --header ''Host: 127.0.0.1''
                -O /dev/null "$1"; fi'
              - probe
              - http://127.0.0.1:9901/healthy
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - 'if command -v curl >/dev/null 2>&1; then exec curl -fsS -m 2 -o /dev/null -H
                ''Host: 127.0.0.1'' "$1"; else exec wget -q -T 2 --header ''Host: 127.0.0.1''
                -O /dev/null "$1"; fi'
              - probe
              - http://127.0.0.1:9901/healthy
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              cpu: 2
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            - name: tls
              mountPath: "/etc/praxis/tls"
              readOnly: true
            - name: grid-serving
              mountPath: "/etc/praxis/grid-serving"
              readOnly: true
            - name: upstream-ca
              mountPath: "/etc/praxis/upstream-ca"
              readOnly: true
            - name: listener-tls
              mountPath: "/etc/praxis/listener-tls"
              readOnly: true
            - name: credential-0
              mountPath: "/run/secrets/grid-credentials/grid-model-client-token"
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: "grid-gateway-config"
            items:
              - key: "praxis.yaml"
                path: "praxis.yaml"
        - name: tls
          projected:
            sources:
              - secret:
                  name: "grid-site-identity"
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: "grid-ca"
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: grid-serving
          configMap:
            name: "grid-serving-grid-grid-gateway"
            optional: false
        - name: upstream-ca
          secret:
            secretName: "openshift-service-ca"
        - name: listener-tls
          secret:
            secretName: "grid-gateway-listener-tls"
        - name: credential-0
          secret:
            secretName: "grid-model-client-token"
            optional: false


