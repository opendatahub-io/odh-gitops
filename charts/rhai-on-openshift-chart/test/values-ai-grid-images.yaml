profile: ai-grid
praxis-gateway:
  grid:
    networkName: grid-network
    siteName: hub
  overlay:
    configMapName: grid-routing
    sidecar:
      enabled: true
  praxisConfig:
    byo:
      configMapName: grid-gateway-config
grid-enrollment:
  route:
    enabled: false
  enrollment:
    authz: kube
    serviceAccount:
      create: true
