      value: registry.example.com/rhai/grid-enrollment@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_POSTGRES_IMAGE
      value: registry.example.com/rhai/postgresql@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_OVERLAY_SYNC_IMAGE
      value: registry.example.com/rhai/grid-overlay-sync@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
