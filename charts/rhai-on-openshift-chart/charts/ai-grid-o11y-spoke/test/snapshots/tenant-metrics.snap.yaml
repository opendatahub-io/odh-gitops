# Source: ai-grid-o11y-spoke/templates/tenant-metrics-proxy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-grid-tenant-hub-relay
  namespace: redhat-ods-monitoring
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-tenant-metrics
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-observability
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: tenant-metrics-proxy
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        access_log /dev/stdout;

        server {
            listen 8081;

            location / {
                proxy_pass https://thanos.example.test:443;
                proxy_http_version 1.1;
                proxy_set_header Host thanos.example.test:443;
                proxy_set_header Authorization $http_authorization;
                proxy_set_header x-maas-orgid $http_x_maas_orgid;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_ssl_server_name on;
                proxy_ssl_name thanos.example.test;
                proxy_ssl_verify on;
                proxy_ssl_verify_depth 2;
                proxy_ssl_trusted_certificate /etc/thanos-ca/ca.crt;
            }
        }
    }
