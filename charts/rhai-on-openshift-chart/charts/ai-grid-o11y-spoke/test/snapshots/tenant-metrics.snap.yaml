apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grid-tenant-prom-label-proxy
  namespace: redhat-ods-monitoring
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-tenant-metrics
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-observability
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: tenant-metrics-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-grid-tenant-prom-label-proxy
  template:
    metadata:
      annotations:
        checksum/tenant-metrics: 704a13b029f241c1ef027f4c0f719a85983dcdf52092916f848133e8bddeeca0
      labels:
        app.kubernetes.io/name: ai-grid-tenant-prom-label-proxy
        app.kubernetes.io/component: tenant-metrics-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prom-label-proxy
          image: "registry.example.invalid/prom-label-proxy:testing"
          imagePullPolicy: IfNotPresent
          args:
            - --insecure-listen-address=0.0.0.0:9091
            - "--upstream=http://127.0.0.1:8081"
            - --label=organization_id
            - --header-name=x-maas-orgid
            - --error-on-replace
            - --enable-label-apis
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: SSL_CERT_DIR
              value: /etc/thanos-ca:/etc/ssl/certs:/etc/pki/tls/certs
          volumeMounts:
            - name: thanos-ca
              mountPath: /etc/thanos-ca
              readOnly: true
        - name: hub-relay
          image: "registry.example.invalid/nginx:testing"
          imagePullPolicy: IfNotPresent
          command:
            - /usr/libexec/s2i/run
          ports:
            - name: hub-relay
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: hub-relay-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: hub-relay-tmp
              mountPath: /tmp
            - name: hub-relay-tmp
              mountPath: /var/cache/nginx
            - name: thanos-ca
              mountPath: /etc/thanos-ca
              readOnly: true
      volumes:
        - name: hub-relay-config
          configMap:
            name: ai-grid-tenant-hub-relay
        - name: hub-relay-tmp
          emptyDir: {}
        - name: thanos-ca
          configMap:
            name: "odh-trusted-ca-bundle"
            items:
              - key: "ca-bundle.crt"
                path: ca.crt
