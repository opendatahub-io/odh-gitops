apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-grid-tenant-prom-label-proxy-ingress
  namespace: redhat-ods-monitoring
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-tenant-metrics
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-observability
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-grid-tenant-prom-label-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: data-science-perses
              app.kubernetes.io/managed-by: perses-operator
      ports:
        - protocol: TCP
          port: 9091

