# Source: ai-grid-o11y-spoke/templates/tenant-metrics-dashboards.yaml
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-0-ai-grid-tenant-cluster-admin
  namespace: redhat-ods-monitoring
spec:
  config:
    display:
      name: Tenant cluster
    duration: 1h
    # Namespace variable - queries the cluster-scoped Prometheus datasource, can be overridden by NamespaceVariablesProvider
    variables:
      - kind: ListVariable
        spec:
          name: namespace
          display:
            name: Project
            description: Filter by project
          allowMultiple: true
          allowAllValue: true
          customAllValue: ".*"
          defaultValue: "$__all"
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              datasource:
                kind: PrometheusDatasource
                name: ai-grid-tenant-prometheus-datasource
              labelName: namespace
              matchers:
                - kserve_vllm:num_requests_running
      # Cluster details variables - set by ClusterDetailsVariablesProvider
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_API_SERVER
          display:
            name: API server
            hidden: true
          value: "N/A"
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_CHANNEL
          display:
            name: Channel
            hidden: true
          value: "N/A"
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_OPENSHIFT_VERSION
          display:
            name: OpenShift version
            hidden: true
          value: "N/A"
      - kind: TextVariable
        spec:
          name: CLUSTER_DETAILS_INFRASTRUCTURE_PROVIDER
          display:
            name: Infrastructure provider
            hidden: true
          value: "N/A"
    panels:
      # Overview Stats
      systemHealth:
        kind: Panel
        spec:
          display:
            name: System health
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: percent-decimal
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    # Healthy nodes / Total nodes
                    query: count(max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 1)) / count(max by (node) (kube_node_status_condition{condition="Ready",status="true"}))
                    seriesNameFormat: System health
      deployedModels:
        kind: Panel
        spec:
          display:
            name: Deployed models
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    # Count unique models by model_name and namespace from vLLM metrics
                    query: count(group(kserve_vllm:num_requests_running) by (model_name, namespace))
                    seriesNameFormat: Deployed models
      gpuUtilizationStat:
        kind: Panel
        spec:
          display:
            name: GPU utilization
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: percent
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    query: avg(accelerator_gpu_utilization)
                    seriesNameFormat: GPU usage
      successRate:
        kind: Panel
        spec:
          display:
            name: Request success rate
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              format:
                unit: percent-decimal
                decimalPlaces: 1
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    # Request success rate using kserve_vllm metrics
                    query: (sum(increase(kserve_vllm:request_success_total{namespace=~"$namespace", finished_reason=~"length|stop"}[$__range])) / sum(increase(kserve_vllm:request_success_total{namespace=~"$namespace"}[$__range]))) and (sum(increase(kserve_vllm:request_success_total{namespace=~"$namespace"}[$__range])) > 0)
                    seriesNameFormat: Request success rate
      # Cluster-wide usage - Area charts
      gpuUtilizationArea:
        kind: Panel
        spec:
          display:
            name: GPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    query: avg(accelerator_gpu_utilization)
                    seriesNameFormat: GPU usage
      memoryUtilizationArea:
        kind: Panel
        spec:
          display:
            name: Memory allocated
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    query: sum(container_memory_working_set_bytes{container!="", image!=""}) / sum(node_memory_MemTotal_bytes)
                    seriesNameFormat: Memory allocated
      cpuUtilizationArea:
        kind: Panel
        spec:
          display:
            name: CPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    query: sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate) / sum(kube_node_status_allocatable{resource="cpu"})
                    seriesNameFormat: CPU usage
      networkUtilizationArea:
        kind: Panel
        spec:
          display:
            name: Inbound traffic
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.6
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: bytes
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    # Network receive rate in bytes/second
                    query: sum(rate(container_network_receive_bytes_total[$__rate_interval]))
                    seriesNameFormat: Network
      gpuUtilizationByProject:
        kind: Panel
        spec:
          display:
            name: GPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 0.25
                stack: all
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    query: sum by (exported_namespace) (accelerator_gpu_utilization{exported_namespace=~"$namespace"}) / scalar(count(accelerator_gpu_utilization))
                    seriesNameFormat: "{{exported_namespace}}"
      cpuUtilizationByProject:
        kind: Panel
        spec:
          display:
            name: CPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 0.25
                stack: all
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    # CPU usage by namespace as percentage of total cluster allocatable CPU
                    query: sum by (namespace) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~"$namespace"}) / scalar(sum(kube_node_status_allocatable{resource="cpu"}))
                    seriesNameFormat: "{{namespace}}"
      memoryUsageByProject:
        kind: Panel
        spec:
          display:
            name: Memory allocated
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 0.25
                stack: all
              yAxis:
                format:
                  unit: percent-decimal
                min: 0
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: ai-grid-tenant-prometheus-datasource
                    # Memory allocated by namespace as percentage of total cluster memory
                    query: sum by (namespace) (container_memory_working_set_bytes{namespace=~"$namespace", container!="", image!=""}) / scalar(sum(node_memory_MemTotal_bytes))
                    seriesNameFormat: "{{namespace}}"
      # Cluster Details - Static Markdown Panel
      clusterDetails:
        kind: Panel
        spec:
          display:
            name: Cluster details
          plugin:
            kind: Markdown
            spec:
              text: |
                <dl class="pf-v6-c-description-list pf-m-auto-column-widths pf-m-horizontal">
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">Provider</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_INFRASTRUCTURE_PROVIDER}</div>
                    </dd>
                  </div>
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">OpenShift version</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_OPENSHIFT_VERSION}</div>
                    </dd>
                  </div>
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">Channel</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_CHANNEL}</div>
                    </dd>
                  </div>
                  <div class="pf-v6-c-description-list__group">
                    <dt class="pf-v6-c-description-list__term">
                      <span class="pf-v6-c-description-list__text">API server</span>
                    </dt>
                    <dd class="pf-v6-c-description-list__description">
                      <div class="pf-v6-c-description-list__text">${CLUSTER_DETAILS_API_SERVER}</div>
                    </dd>
                  </div>
                </dl>
    layouts:
      # Overview Section - Stats Row
      - kind: Grid
        spec:
          display:
            title: Overview
            collapse:
              open: true
          items:
            - x: 0
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/systemHealth'
            - x: 6
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/deployedModels'
            - x: 12
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/gpuUtilizationStat'
            - x: 18
              'y': 0
              width: 6
              height: 4
              content:
                '$ref': '#/spec/panels/successRate'
      # Cluster-wide usage section
      - kind: Grid
        spec:
          display:
