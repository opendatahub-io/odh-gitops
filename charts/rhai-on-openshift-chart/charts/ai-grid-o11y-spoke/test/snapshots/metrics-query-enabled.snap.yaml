apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-test-ai-grid-o11y-spoke-query
  namespace: ai-grid-o11y-tenant-admin
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-o11y-spoke
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-usage-logs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-grid-o11y-spoke
      app.kubernetes.io/instance: release-test
      app.kubernetes.io/component: metrics-query
  template:
    metadata:
      annotations:
        checksum/config: f16bea279da7c559f387200191173b379412ce9404afd31422bfee967b2d5240
      labels:
        app.kubernetes.io/name: ai-grid-o11y-spoke
        app.kubernetes.io/instance: release-test
        app.kubernetes.io/component: metrics-query
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prom-label-proxy
          image: "registry.redhat.io/openshift4/ose-prom-label-proxy-rhel9@sha256:4053948b40f66dc5f8d2baaeb62463aec85079b55add1151a658f1005cc604f4"
          imagePullPolicy: IfNotPresent
          args:
            - "-insecure-listen-address=0.0.0.0:8081"
            - -header-name=X-Scope-OrgID
            - "-label=organization_id"
            - -enable-label-apis
            # Perses checks this data-free Thanos endpoint for datasource health.
            - -unsafe-passthrough-paths=/-/healthy
            - "-upstream=http://127.0.0.1:8080"
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
        - name: nginx
          image: "registry.access.redhat.com/ubi9/nginx-124@sha256:d1eb117322c0374e286f73d6f67912c1171c605eb34cd5dd33005375747c77a5"
          imagePullPolicy: IfNotPresent
          command: ["nginx"]
          args: ["-e", "/dev/stderr", "-c", "/etc/grid/config/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: relay
              containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/grid/config
              readOnly: true
            - name: client
              mountPath: /etc/grid/client
              readOnly: true
            - name: server-ca
              mountPath: /etc/grid/server-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: release-test-ai-grid-o11y-spoke-relay
        - name: client
          secret:
            secretName: spoke-client-tls
        - name: server-ca
          secret:
            secretName: hub-server-ca
        - name: tmp
          emptyDir: {}

