# Source: ai-grid-o11y-spoke/templates/metrics-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grid-tenant-metrics
  namespace: ai-grid-o11y-tenant-admin
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-o11y-spoke
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-usage-logs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.3.0"
spec:
  parentRefs:
    - name: maas-default-gateway
      namespace: openshift-ingress
      sectionName: https
  hostnames:
    - "grid.example.test"
  rules:
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: "/metrics"
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: release-test-ai-grid-o11y-spoke-query
          port: 8081

