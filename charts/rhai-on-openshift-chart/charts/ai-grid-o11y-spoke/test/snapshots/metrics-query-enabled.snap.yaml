# Source: ai-grid-o11y-spoke/templates/metrics-relay-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-test-ai-grid-o11y-spoke-relay
  namespace: ai-grid-o11y-tenant-admin
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-o11y-spoke
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-usage-logs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.3.0"
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log off;
      resolver dns-default.openshift-dns.svc valid=30s;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 127.0.0.1:8080;
        if ($request_method != GET) { return 405; }
        location / {
          set $hub_upstream "metrics-hub.example.test";
          proxy_pass_request_headers off;
          proxy_pass https://$hub_upstream;
          proxy_ssl_server_name on;
          proxy_ssl_name metrics-hub.example.test;
          proxy_ssl_trusted_certificate /etc/grid/server-ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_certificate /etc/grid/client/tls.crt;
          proxy_ssl_certificate_key /etc/grid/client/tls.key;
          proxy_set_header Host metrics-hub.example.test;
          proxy_set_header Authorization "";
          proxy_http_version 1.1;
        }
      }
    }

