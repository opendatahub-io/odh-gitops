# Source: ai-grid-o11y-spoke/templates/metrics-authpolicy.yaml
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: grid-tenant-metrics
  namespace: ai-grid-o11y-tenant-admin
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-o11y-spoke
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-usage-logs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.3.0"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: grid-tenant-metrics
  rules:
    authentication:
      fixture-jwt:
        jwt:
          jwksUrl: https://identity.example.test/jwks
    authorization:
      require-get:
        patternMatching:
          patterns:
            - predicate: 'request.method == "GET"'
      deny-client-scope-header:
        patternMatching:
          patterns:
            - predicate: '!("x-scope-orgid" in request.headers)'
      require-trusted-issuer:
        patternMatching:
          patterns:
            - predicate: "auth.identity.iss == \"https://identity.example.test/\""
      require-intended-audience:
        patternMatching:
          patterns:
            - predicate: "auth.identity.aud == \"grid-metrics\" || (type(auth.identity.aud) == type([]) && \"grid-metrics\" in auth.identity.aud)"
      require-viewer:
        patternMatching:
          patterns:
            - predicate: "auth.identity.groups.exists(g, g == (auth.identity[\"https://redhat.com/maas/orgs\"][0].organization_id) + \"/ai-grid-dashboard-viewer\")"
    response:
      success:
        headers:
          X-Scope-OrgID:
            plain:
              expression: "auth.identity[\"https://redhat.com/maas/orgs\"][0].organization_id"

