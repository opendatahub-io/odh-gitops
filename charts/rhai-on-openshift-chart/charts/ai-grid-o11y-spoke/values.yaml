# ai-grid-o11y-spoke provides three capabilities on a spoke:
#
#   metrics collection  a NetworkPolicy for ACM metrics-collector agents, plus an optional
#                       ScrapeConfig when this cluster owns that resource
#   usage logs          the monitoring namespace and hub credential mounted by the collector
#   tenant queries      a protected Perses datasource and query path to hub Thanos
#
# The parent chart configures the collector and DSCInitialization; this subchart cannot
# contribute to those parent resources. Its usage-log credential must exist before the
# operator starts the collector. Helm orders this chart's Namespace and Secret ahead of
# DSCInitialization during install, avoiding a FailedMount that blocks local and remote logs.
#
# The parent chart includes this subchart only when `enabled` is true. The three features
# have separate switches below.

# -- Include this subchart through the parent chart's dependency condition. The metrics
# collection and credential templates use their own toggles in a standalone install;
# tenant query templates also check this key.
enabled: false

collector:
  # -- Namespace the collector runs in. Must match `operator.<type>.monitoringNamespace`
  # when used through the parent chart, which fails the render if they disagree:
  # `redhat-ods-monitoring` for RHOAI, `opendatahub` for ODH.
  namespace: redhat-ods-monitoring
  # -- Prometheus exporter port, shared by the scrape target, NetworkPolicy and
  # parent-injected exporter.
  port: 8890
  scrapeConfig:
    # -- Render ScrapeConfig for chart-managed collection. Enabled by default to preserve
    # collection on upgrade. Set false for query-only installs or after verifying an
    # ACM-managed replacement. Requires metrics.enabled, the ACM observability namespace,
    # and the rhobs ScrapeConfig CRD.
    enabled: true
  # -- Create `collector.namespace`, so the usage-log credential has somewhere to land
  # before the operator reconciles the DSCInitialization. Only consulted when
  # `credential.enabled` is set, since that Secret is the only reason to create it early.
  #
  # **Defaults to false**, because the common case for this chart is onboarding a spoke whose
  # usage logs already run locally: there RHOAI created the namespace long ago, Helm will not
  # adopt a namespace it does not own, and the upgrade fails with `invalid ownership metadata`
  # before delivering the credential. It must also stay false on OSD and ROSA, where GitOps
  # writes to Red Hat managed namespaces are rejected.
  #
  # Set it true only where this chart runs *before* the operator has reconciled the
  # DSCInitialization and the namespace genuinely does not exist. When true it carries
  # `helm.sh/resource-policy: keep`, so uninstalling never deletes the namespace the operator
  # is using.
  createNamespace: false

# -- Labels added to usage-log and tenant-query objects. Metrics collection resources
# keep their existing labels.
commonLabels: {}

metrics:
  # -- Allow ACM metrics-collector agents to reach the RHOAI collector through a
  # NetworkPolicy. On by default. Also gates the optional ScrapeConfig controlled by
  # collector.scrapeConfig.enabled. Set false on spokes without ACM metrics collection.
  enabled: true

credential:
  # -- Deliver the hub credential: render the Secret below, and `collector.namespace` ahead
  # of it. Off by default, because a spoke that only federates metrics needs no hub token
  # and should not be asked for one.
  enabled: false

  # -- Name of the Secret the collector mounts. It must equal
  # `services.monitoring.dsci.usageLogs.credentialSecret`; nothing can check that for you,
  # because a subchart cannot see the parent's values.
  secretName: hub-usage-logs-auth

  # -- The hub writer token, stored under key `token`. Mint it on the hub with
  # `oc create token <writer-sa> -n <o11y-namespace> --duration=8760h`.
  #
  # Required when `credential.enabled` is set, and deliberately has no other source: an
  # `existingSecret` option would look equivalent while silently giving up the ordering
  # guarantee above, since a Secret created outside the release may not exist when the
  # collector starts.
  #
  # Never commit it. Supply it out of band:
  #   --set-file credential.token=./token (standalone)
  #   --set-file ai-grid-o11y-spoke.credential.token=./token (parent)
  # or from a values file kept out of version control. Under GitOps, template it from
  # whatever secret manager is in use rather than checking it in.
  # Helm stores the supplied token in release history as well as the credential Secret.
  # Restrict access to the release namespace as strictly as the credential namespace.
  token: ""

metricsQuery:
  # -- Enable the tenant metrics datasource, Gateway route, policy, proxy, and hub relay.
  enabled: false
  # -- Hub mTLS Route hostname; the relay uses HTTPS with certificate verification.
  hubHostname: ""
  # -- OpenShift DNS resolver used to track hub Route address changes.
  dnsResolver: dns-default.openshift-dns.svc
  # -- Secret with tls.crt and tls.key for the spoke client certificate.
  clientTLSSecretName: ""
  # -- Secret with ca.crt for the hub server CA.
  serverCASecretName: ""
  # -- Optional pull secrets for the relay and proxy images.
  imagePullSecrets: []
  proxy:
    image:
      # -- Pinned OpenShift prom-label-proxy image repository.
      repository: registry.redhat.io/openshift4/ose-prom-label-proxy-rhel9
      # -- Image digest; align with the target RHOAI payload before rollout.
      digest: sha256:4053948b40f66dc5f8d2baaeb62463aec85079b55add1151a658f1005cc604f4
      pullPolicy: IfNotPresent
    # -- Gateway-facing proxy port. Must differ from metricsQuery.listenPort.
    listenPort: 8081
    # -- Tenant label stored in hub Thanos.
    label: organization_id
    # -- Enable tenant-filtered label name and value discovery.
    enableLabelAPIs: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  image:
    # -- Spoke NGINX mTLS relay image repository.
    repository: registry.access.redhat.com/ubi9/nginx-124
    digest: sha256:d1eb117322c0374e286f73d6f67912c1171c605eb34cd5dd33005375747c77a5
    pullPolicy: IfNotPresent
  # -- Loopback port for the NGINX mTLS relay sidecar.
  listenPort: 8080
  # -- Gateway namespace and pod selectors for the proxy ingress policy.
  gatewayNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: openshift-ingress
  gatewayPodSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

tenantAdminNamespace:
  # -- Perses project and datasource namespace for tenant metrics queries.
  name: ai-grid-o11y-tenant-admin
  # When created by this chart, it is labeled for MaaS Gateway route admission.
  # If managed elsewhere, apply the same gateway-access label there.
  # -- Create and own the namespace with this Helm release.
  create: false

datasource:
  name: grid-tenant-hub-metrics
  apiVersion: perses.dev/v1alpha2
  # Match only the intended spoke Perses instance.
  # -- Label selector for the intended spoke Perses instance.
  instanceSelector: {}

metricsRoute:
  # Empty uses tenantAdminNamespace.name. Set this to a namespace admitted by
  # the Gateway listener when the Perses project is not admitted. The local
  # backend Service and AuthPolicy must be in this namespace.
  # -- Namespace for the HTTPRoute and AuthPolicy; empty uses the Perses project.
  namespace: ""
  name: grid-tenant-metrics
  # -- Public Gateway hostname, used to derive the datasource's HTTPS /metrics URL.
  hostname: ""
  pathPrefix: /metrics
  # The Gateway listener must allow routes from the route namespace.
  # -- Target the default MaaS Gateway HTTPS listener; override for a different Gateway.
  parentRefs:
    - name: maas-default-gateway
      namespace: openshift-ingress
      sectionName: https
  # The chart creates the local proxy and mTLS relay pod in this namespace.

metricsAuthPolicy:
  # Gateway session/JWT authentication. The chart enforces the viewer group.
  # -- Gateway session or JWT authentication rules for Authorino.
  authentication: {}
  # -- Optional additional authorization rules; viewer membership is always required.
  authorization: {}
  # RHCL 1.4.3 jwt.issuerUrl discovered signing keys but did not reject a token
  # with the wrong iss or aud. The chart checks both in verified auth data.
  # -- Trusted shared OIDC issuer URL.
  issuer: ""
  # -- Intended MaaS audience.
  audience: ""
  # CEL expression deriving the QGUID from a verified selected organization.
  # The chart injects its result as X-Scope-OrgID after authentication.
  # -- CEL expression selecting the verified organization_id/QGUID.
  scopeExpression: ""
