{{- if and .Values.enabled .Values.metricsQuery.enabled }}
{{- $routeNamespace := default .Values.tenantAdminNamespace.name .Values.metricsRoute.namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-grid-o11y-spoke.fullname" . }}-query-ingress
  namespace: {{ $routeNamespace }}
  labels:
    {{- include "ai-grid-o11y-spoke.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-grid-o11y-spoke.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics-query
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.metricsQuery.gatewayNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.metricsQuery.gatewayPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metricsQuery.proxy.listenPort }}
{{- end }}
