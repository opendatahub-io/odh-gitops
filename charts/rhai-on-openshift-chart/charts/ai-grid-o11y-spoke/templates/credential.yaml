{{- if .Values.credential.enabled }}
{{- /* Rendered ahead of the DSCInitialization by Helm's install ordering, which places
       Secret before kinds it does not recognise. That is the whole point of the chart: the
       collector mounts this Secret, and a collector that starts without it blocks on
       FailedMount and stops writing locally too. */}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.credential.secretName | quote }}
  namespace: {{ .Values.collector.namespace | quote }}
  labels:
    {{- include "ai-grid-o11y-spoke.labels" . | nindent 4 }}
stringData:
  {{- /* A bare token under `token`, not a header value: the collector reads it through a
         bearertokenauth extension that prepends `Bearer` itself. Writing "Bearer <token>"
         here makes every write fail, and the hub redirects rather than returning 401, so it
         shows up only as otelcol_exporter_send_failed_log_records. */}}
  token: {{ include "ai-grid-o11y-spoke.token" . | quote }}
{{- end }}
