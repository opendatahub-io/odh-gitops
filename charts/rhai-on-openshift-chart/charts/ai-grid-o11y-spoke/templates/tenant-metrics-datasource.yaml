{{ if .Values.tenantMetrics.enabled }}
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: ai-grid-tenant-prometheus-datasource
  namespace: redhat-ods-monitoring
spec:
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
      insecureSkipVerify: false
  config:
    default: false
    display:
      name: AI Grid tenant metrics
      description: Organization-scoped hub Thanos queries
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            secret: ai-grid-tenant-prometheus-datasource-secret
            url: http://ai-grid-tenant-prom-label-proxy.redhat-ods-monitoring.svc:9091
{{ end }}
