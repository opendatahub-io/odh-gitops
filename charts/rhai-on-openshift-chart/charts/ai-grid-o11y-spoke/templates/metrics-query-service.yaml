{{- if and .Values.enabled .Values.metricsQuery.enabled }}
{{- $routeNamespace := default .Values.tenantAdminNamespace.name .Values.metricsRoute.namespace }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-grid-o11y-spoke.fullname" . }}-query
  namespace: {{ $routeNamespace }}
  labels:
    {{- include "ai-grid-o11y-spoke.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.metricsQuery.proxy.listenPort }}
      targetPort: http
  selector:
    {{- include "ai-grid-o11y-spoke.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-query
{{- end }}
