{{- define "grid-enrollment.rhoai.certs/ca-bootstrap-job.yaml" -}}
{{- if or (eq .Values.mode "service") .Values.gridIdentity.enabled }}
{{- include "grid-enrollment.normalize" . }}
{{- include "grid-enrollment.validateHubSite" . }}
{{- if include "grid-enrollment.bootstrapRuns" . }}
{{/*
Generate the Grid CA (if absent), derive the public bundle, and issue the
enrollment serving and DB serving certs, before the service starts. Also creates
the builtin DB credentials and the local grid-admin token table once. Runs
`enrollment bootstrap` in the app image (bootstrap feature). Idempotent: it loads
an existing CA rather than regenerate unless ca.forceRegenerate is set, and never
rotates a credentials Secret.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "grid-enrollment.fullname" . }}-ca-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
    app.kubernetes.io/component: ca-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Kept for its logs until the next hook run or its TTL.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  {{- $ttl := ((.Values.ca).bootstrap).ttlSecondsAfterFinished }}
  {{- if not (kindIs "invalid" $ttl) }}
  ttlSecondsAfterFinished: {{ $ttl }}
  {{- end }}
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "grid-enrollment.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: {{ include "grid-enrollment.bootstrapServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.enrollment.podSecurityContext | nindent 8 }}
      containers:
        - name: ca-bootstrap
          image: {{ include "grid-enrollment.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.enrollment.securityContext | nindent 12 }}
          command: ["enrollment", "bootstrap"]
          env:
            - name: RUST_LOG
              value: {{ include "grid-enrollment.rustLog" . | quote }}
            {{- if and (eq .Values.mode "service") (dig "bootstrap" "policy" "enabled" true .Values.ca) }}
            {{- /* Only this chart knows it rendered the policy, so only it asks the
                   bootstrap to wait for enforcement. An env var rather than an argument,
                   so an image predating the gate ignores it instead of refusing to
                   start. */}}
            - name: ENROLLMENT_WAIT_FOR_CONFINEMENT
              value: "true"
            {{- end }}
            {{- if and .Values.hubSite.name .Values.enrollment.certLifetimeSecs }}
            - name: ENROLLMENT_CERT_LIFETIME_SECS
              value: {{ .Values.enrollment.certLifetimeSecs | quote }}
            {{- end }}
          args:
            - "--namespace"
            - "{{ .Release.Namespace }}"

            {{- if .Values.gridIdentity.enabled }}
            - "--grid-id-config-map"
            - {{ .Values.gridIdentity.configMapName | quote }}
            {{- end }}
            {{- if eq .Values.mode "external" }}
            - "--skip-ca"
            {{- else }}
            {{- if include "grid-enrollment.generatesDbCredentials" . }}
            - "--db-credentials-secret"
            - "{{ include "grid-enrollment.dbUrlSecret" . }}"
            - "--db-user"
            - "{{ .Values.db.builtin.auth.username }}"
            - "--db-database"
            - "{{ .Values.db.builtin.auth.database }}"
            - "--db-host"
            - "{{ include "grid-enrollment.dbHost" . }}"
            {{- end }}
            {{- if include "grid-enrollment.generatesAdminTokens" . }}
            - "--admin-tokens-secret"
            - "{{ include "grid-enrollment.adminTokensSecret" . }}"
            {{- end }}
            {{- if eq (include "grid-enrollment.caProvided" .) "true" }}
            - "--skip-ca"
            {{- else }}
            - "--common-name"
            - "{{ .Values.ca.commonName }}"
            - "--ca-key-secret"
            - "{{ .Values.ca.keySecretName }}"
            - "--ca-bundle-secret"
            - "{{ .Values.ca.bundleSecretName }}"
            {{- if .Values.serving.existingSecretRef }}
            {{- /* A BYO serving cert serves; issue none. */}}
            - "--skip-serving"
            {{- else }}
            - "--serving-secret"
            - "{{ .Values.serving.secretName }}"
            - "--serving-dns"
            - "{{ include "grid-enrollment.serviceDns" . }}"
            {{- range .Values.serving.extraDnsNames }}
            - "--serving-dns"
            - "{{ . }}"
            {{- end }}
            {{- if and (include "grid-enrollment.routeEnabled" .) .Values.route.host (not (has .Values.route.host .Values.serving.extraDnsNames)) }}
            {{- /* auto-add the Route host so passthrough validates against the serving cert SAN,
                   unless host already put it in extraDnsNames, which is the usual case since
                   route.host defaults to host and a repeated SAN entry is just noise */}}
            - "--serving-dns"
            - "{{ .Values.route.host }}"
            {{- end }}
            {{- end }}
            {{- if eq .Values.db.type "builtin" }}
            - "--db-serving-secret"
            - "{{ .Values.db.builtin.tls.servingSecretName }}"
            - "--db-dns"
            - "{{ include "grid-enrollment.dbHost" . }}"
            - "--db-dns"
            - "{{ include "grid-enrollment.dbHost" . }}.{{ .Release.Namespace }}.svc"
            - "--db-deployment"
            - "{{ include "grid-enrollment.dbHost" . }}"
            {{- end }}
            {{- with .Values.hubSite.name }}
            - "--site-name"
            - "{{ . }}"
            - "--site-namespace"
            - "{{ $.Values.hubSite.namespace }}"
            - "--site-secret"
            - "{{ $.Values.hubSite.identitySecretName }}"
            - "--site-ca-secret"
            - "{{ $.Values.hubSite.caSecretName }}"
            - "--reserved-seeds-secret"
            - "{{ $.Values.hubSite.seedSecretName }}"
            {{- with $.Values.hubSite.swimKeySecretName }}
            - "--swim-key-secret"
            - "{{ . }}"
            {{- end }}
            {{- end }}
            {{- if .Values.ca.forceRegenerate }}
            - "--force-regenerate"
            {{- end }}
            {{- end }}
            {{- end }}
          {{- with .Values.ca.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "grid-enrollment.rhoai.certs/ca-bootstrap-job.yaml" . }}
{{- end }}
