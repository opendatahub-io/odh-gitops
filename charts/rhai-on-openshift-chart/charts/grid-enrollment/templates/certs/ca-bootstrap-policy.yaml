{{- define "grid-enrollment.rhoai.certs/ca-bootstrap-policy.yaml" -}}
{{- if eq .Values.mode "service" }}
{{- include "grid-enrollment.normalize" . }}
{{/* dig, not a field walk: an upgrade with --reuse-values carries no value for a key the release predates. */}}
{{- if dig "bootstrap" "policy" "enabled" true .Values.ca }}
{{- $svcSa := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "grid-enrollment.serviceAccountName" .) }}
{{- $inviteNs := include "grid-enrollment.inviteSecretsNamespace" . }}
{{- $invitePolicy := printf "%s-%s-invite-secrets" (include "grid-enrollment.fullname" .) .Release.Namespace }}
{{/*
Two accounts in this chart hold create on Secrets unscoped by name, because Kubernetes
cannot scope create by resourceName on the POST path. Each gets a policy confining what
that verb may produce, in the shape csr-record-policy.yaml uses for the signer: match the
account, then validate the object.

Cluster scoped and unbound by namespace, as there too: the property wanted is that these
accounts cannot write a Secret anywhere else, not that they cannot in some places. Each
name carries the release namespace so two releases on one cluster do not collide.

Both are pre-install hooks, since they have to admit the writes of hooks that follow
them. Like the hook RBAC beside them they outlive the hook and an uninstall, so the
README says how to remove them.
*/}}
{{- if include "grid-enrollment.bootstrapRuns" . }}
{{- $ca := ne (include "grid-enrollment.caProvided" .) "true" }}
{{- $sa := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "grid-enrollment.bootstrapServiceAccountName" .) }}
{{- $name := printf "%s-%s-bootstrap-secrets" (include "grid-enrollment.fullname" .) .Release.Namespace }}
{{- $own := list }}
{{- if $ca }}
{{- $own = append $own .Values.ca.keySecretName }}
{{- $own = append $own .Values.ca.bundleSecretName }}
{{- if not .Values.serving.existingSecretRef }}
{{- $own = append $own .Values.serving.secretName }}
{{- end }}
{{- if eq .Values.db.type "builtin" }}
{{- $own = append $own .Values.db.builtin.tls.servingSecretName }}
{{- end }}
{{- end }}
{{- if include "grid-enrollment.generatesDbCredentials" . }}
{{- $own = append $own (include "grid-enrollment.dbUrlSecret" .) }}
{{- end }}
{{- if include "grid-enrollment.generatesAdminTokens" . }}
{{- $own = append $own (include "grid-enrollment.adminTokensSecret" .) }}
{{- end }}
{{- $hub := list }}
{{- if .Values.hubSite.name }}
{{- $own = append $own .Values.hubSite.seedSecretName }}
{{- $hub = append $hub .Values.hubSite.identitySecretName }}
{{- $hub = append $hub .Values.hubSite.caSecretName }}
{{- with .Values.hubSite.swimKeySecretName }}
{{- $own = append $own . }}
{{- $hub = append $hub . }}
{{- end }}
{{- end }}
{{- $expr := printf "(request.namespace == %q && object.metadata.name in %s)" .Release.Namespace (toJson ($own | uniq | sortAlpha)) }}
{{- if $hub }}
{{- $expr = printf "%s || (request.namespace == %q && object.metadata.name in %s)" $expr .Values.hubSite.namespace (toJson ($hub | uniq | sortAlpha)) }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: grid-enrollment-bootstrap
      expression: {{ printf "request.userInfo.username == %q" $sa | quote }}
  validations:
    - expression: {{ $expr | quote }}
      message: "the grid enrollment bootstrap may only create the Secrets its chart renders"
      reason: Forbidden
    {{/*
    The name allowlist alone is not confinement. This account also holds delete on the
    hub identity Secret, so without a type constraint it can delete that name and
    recreate it as a kubernetes.io/service-account-token annotated for another account,
    which the token controller then fills with a non-expiring token for that account. The
    bootstrap itself writes only these two types.
    */}}
    - expression: "!has(object.type) || object.type in [\"Opaque\",\"kubernetes.io/tls\"]"
      message: "the grid enrollment bootstrap may only create an Opaque or kubernetes.io/tls Secret, so it cannot mint a token for another ServiceAccount"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
---
{{- end }}
{{/*
The enrollment service holds get, create and delete on Secrets unscoped by name, for the
invite tokens it writes per SiteInvite. Every name it writes carries the prefix
grid-invite- (site_invite.rs, and the service's own --secret-prefix default), so create
and delete are confined to that prefix and to the one namespace it writes in.

get is not constrainable here: admission does not run on reads, which is why
enrollment.inviteSecrets.namespace is a namespace of its own and the render refuses the
release namespace for it: sharing it would let this account read the Grid CA signing key.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $invitePolicy }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: grid-enrollment-service
      expression: {{ printf "request.userInfo.username == %q" $svcSa | quote }}
  validations:
    {{/* On a DELETE the request carries no object, so the name comes off oldObject. */}}
    - expression: {{ printf "request.namespace == %q && (request.operation == \"DELETE\" ? oldObject.metadata.name.startsWith(\"grid-invite-\") : object.metadata.name.startsWith(\"grid-invite-\"))" $inviteNs | quote }}
      message: "the grid enrollment service may only write grid-invite- Secrets, in its invite namespace"
      reason: Forbidden
    - expression: "request.operation == \"DELETE\" || !has(object.type) || object.type == \"Opaque\""
      message: "the grid enrollment service may only create an Opaque Secret, so it cannot mint a token for another ServiceAccount"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $invitePolicy }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  policyName: {{ $invitePolicy }}
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "grid-enrollment.rhoai.certs/ca-bootstrap-policy.yaml" . }}
{{- end }}
