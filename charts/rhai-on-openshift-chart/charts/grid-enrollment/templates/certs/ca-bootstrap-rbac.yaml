{{- define "grid-enrollment.rhoai.certs/ca-bootstrap-rbac.yaml" -}}
{{- include "grid-enrollment.normalize" . }}
{{- if include "grid-enrollment.bootstrapRuns" . }}
{{- $ca := ne (include "grid-enrollment.caProvided" .) "true" }}
{{/*
RBAC for the bootstrap Job: it reads and writes the CA, bundle, serving, DB
serving, and generated credentials Secrets in this namespace only. get+create
cover generate-if-absent; update covers ca.forceRegenerate (replace-in-place, no
absent window).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grid-enrollment.bootstrapServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "grid-enrollment.bootstrapServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  # create cannot be resourceName-scoped (the object does not exist yet).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/update restricted to exactly the Secrets the bootstrap manages,
  # so this SA cannot read any other Secret in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- if $ca }}
      - {{ .Values.ca.keySecretName | quote }}
      - {{ .Values.ca.bundleSecretName | quote }}
      - {{ .Values.serving.secretName | quote }}
      {{- if eq .Values.db.type "builtin" }}
      - {{ .Values.db.builtin.tls.servingSecretName | quote }}
      {{- end }}
      {{- end }}
      {{- if include "grid-enrollment.generatesDbCredentials" . }}
      - {{ include "grid-enrollment.dbUrlSecret" . | quote }}
      {{- end }}
      {{- if include "grid-enrollment.generatesAdminTokens" . }}
      - {{ include "grid-enrollment.adminTokensSecret" . | quote }}
      {{- end }}
    verbs: ["get", "update"]
  {{- if .Values.hubSite.name }}
  # The CA-signed seed registering the hub's key, applied server side. Secret create is
  # granted above; get and patch reach only this Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.hubSite.seedSecretName | quote }}
    verbs: ["get", "patch"]
  {{- end }}
  {{- if and .Values.hubSite.name .Values.hubSite.swimKeySecretName }}
  # The SWIM key is created once and only read back, never replaced.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.hubSite.swimKeySecretName | quote }}
    verbs: ["get"]
  {{- end }}
  {{- if or (include "grid-enrollment.generatesDbCredentials" .) (include "grid-enrollment.generatesAdminTokens" .) }}
  # patch marks the generated credentials so Argo CD never prunes them.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- if include "grid-enrollment.generatesDbCredentials" . }}
      - {{ include "grid-enrollment.dbUrlSecret" . | quote }}
      {{- end }}
      {{- if include "grid-enrollment.generatesAdminTokens" . }}
      - {{ include "grid-enrollment.adminTokensSecret" . | quote }}
      {{- end }}
    verbs: ["patch"]
  {{- end }}
  {{- if and $ca (eq .Values.db.type "builtin") }}
  # Read and roll the builtin Postgres, and nothing else, so it serves the
  # certificate its Secret holds.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ include "grid-enrollment.dbHost" . | quote }}
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "grid-enrollment.bootstrapServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "grid-enrollment.bootstrapServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grid-enrollment.bootstrapServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- with .Values.hubSite.name }}
{{- $name := printf "%s-hub-site" (include "grid-enrollment.bootstrapServiceAccountName" $) }}
---
{{- /* The hub identity lands in the operator namespace. create cannot be name-scoped, so for the hook's
lifetime this SA can create any Secret there; it already holds the CA key, so that adds little. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.hubSite.namespace }}
  labels:
    {{- include "grid-enrollment.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $.Values.hubSite.identitySecretName | quote }}
      - {{ $.Values.hubSite.caSecretName | quote }}
    verbs: ["get", "update"]
  # Replacing an operator's placeholder identity changes its type, which only delete
  # and create can do.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $.Values.hubSite.identitySecretName | quote }}
    verbs: ["delete"]
  {{- with $.Values.hubSite.swimKeySecretName }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ . | quote }}
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.hubSite.namespace }}
  labels:
    {{- include "grid-enrollment.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grid-enrollment.bootstrapServiceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "grid-enrollment.rhoai.certs/ca-bootstrap-rbac.yaml" . }}
{{- end }}
