{{- define "grid-enrollment.rhoai.tests/enrollment-ready.yaml" -}}
{{- include "grid-enrollment.normalize" . }}
{{/*
The Service routes only to ready endpoints, and readiness is the kubelet's own HTTPS probe
against /readyz, which reaches the database. So a TCP connect to the Service proves the
whole startup chain the pre-install hook feeds: the CA, the serving cert, the credentials
and the schema. Checked this way rather than with wget because busybox carries no usable
TLS, and pulling a TLS-capable image into a chart test is a worse trade than borrowing the
kubelet's probe.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "grid-enrollment.fullname" . }}-test-ready
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "grid-enrollment.testPodSecurityContext" . | nindent 4 }}
  containers:
    - name: readiness-check
      image: busybox:1.37
      securityContext:
        {{- toYaml .Values.enrollment.securityContext | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -eu
          nc -z -w 5 {{ include "grid-enrollment.fullname" . }} {{ include "grid-enrollment.listenPort" . }}
          echo "enrollment is serving on {{ include "grid-enrollment.listenPort" . }}, so its readiness probe passed"
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "grid-enrollment.rhoai.tests/enrollment-ready.yaml" . }}
{{- end }}
