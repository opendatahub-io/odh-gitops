{{- define "grid-enrollment.rhoai.tests/hub-identity.yaml" -}}
{{- include "grid-enrollment.normalize" . }}
{{- if .Values.hubSite.name }}
{{/*
Asserts the identity was issued and landed in hubSite.namespace. Mounting the two Secrets
is the whole assertion, since a Pod whose volume is missing never starts, so this needs no
RBAC and no kubectl. It does not judge whether that namespace is the right one: the
bootstrap writes wherever the value points, so only the cluster can say where the operator
runs, which the kind lifecycle checks instead.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "grid-enrollment.fullname" . }}-test-hub-identity
  namespace: {{ .Values.hubSite.namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "grid-enrollment.testPodSecurityContext" . | nindent 4 }}
  containers:
    - name: identity-check
      image: busybox:1.37
      securityContext:
        {{- toYaml .Values.enrollment.securityContext | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -eu
          test -s /identity/tls.crt
          test -s /identity/tls.key
          test -s /ca/ca.crt
          echo "hub identity and grid CA present"
      volumeMounts:
        - name: identity
          mountPath: /identity
          readOnly: true
        - name: ca
          mountPath: /ca
          readOnly: true
  volumes:
    - name: identity
      secret:
        secretName: {{ .Values.hubSite.identitySecretName | quote }}
    - name: ca
      secret:
        secretName: {{ .Values.hubSite.caSecretName | quote }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "grid-enrollment.rhoai.tests/hub-identity.yaml" . }}
{{- end }}
