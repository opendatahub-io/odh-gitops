{{- define "grid-enrollment.rhoai.enrollment/grid-admin-rbac.yaml" -}}
{{- if eq .Values.mode "service" }}
{{- include "grid-enrollment.normalize" . }}
{{- if eq .Values.enrollment.authz "kube" }}
{{- $fullname := include "grid-enrollment.fullname" . }}
{{- $admins := .Values.enrollment.gridAdmins }}
{{- $subjects := $admins.subjects | default list }}
{{- range $subjects }}
{{- if regexMatch "^system:(masters|authenticated|unauthenticated|serviceaccounts|nodes|anonymous|bootstrappers)(:.*)?$" .name }}
{{- fail (printf "enrollment.gridAdmins.subjects: %q is a cluster-wide group and would make it grid-admin" .name) }}
{{- end }}
{{- end }}
{{- if $admins.serviceAccount.create }}
{{- $subjects = append $subjects (dict "kind" "ServiceAccount" "name" $admins.serviceAccount.name "namespace" .Release.Namespace) }}
{{- end }}
{{/*
Grid-admin actions on the virtual enrollmenttokens resource. A template, since
no CRD publishes the resource for kubectl create role to discover.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-grid-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["grid.praxis.fast"]
    resources: ["enrollmenttokens"]
    verbs: ["create", "delete"]
  # Reading a site's enrollment diagnoses a refused rotation; it shows digests only.
  - apiGroups: ["grid.praxis.fast"]
    resources: ["enrollments"]
    verbs: ["get"]
{{- if $admins.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $admins.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- with $subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-grid-admin
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" $ | nindent 4 }}
subjects:
  {{- range . }}
  - kind: {{ .kind }}
    name: {{ .name | quote }}
    {{- if eq .kind "ServiceAccount" }}
    namespace: {{ .namespace | default $.Release.Namespace | quote }}
    {{- else }}
    apiGroup: rbac.authorization.k8s.io
    {{- end }}
  {{- end }}
roleRef:
  kind: Role
  name: {{ $fullname }}-grid-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- $deleters := (.Values.enrollment.enrollmentAdmins | default dict).subjects | default list }}
{{- range $deleters }}
{{- if regexMatch "^system:(masters|authenticated|unauthenticated|serviceaccounts|nodes|anonymous|bootstrappers)(:.*)?$" .name }}
{{- fail (printf "enrollment.enrollmentAdmins.subjects: %q is a cluster-wide group and would let it delete any site's enrollment" .name) }}
{{- end }}
{{- end }}
{{/*
Deleting a site's enrollment ends its rotations and releases its name. Its own Role,
bound to nobody by default: with mint it re-enrolls an existing site's name.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-enrollment-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["grid.praxis.fast"]
    resources: ["enrollments"]
    verbs: ["get", "delete"]
{{- with $deleters }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-enrollment-admin
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "grid-enrollment.labels" $ | nindent 4 }}
subjects:
  {{- range . }}
  - kind: {{ .kind }}
    name: {{ .name | quote }}
    {{- if eq .kind "ServiceAccount" }}
    namespace: {{ .namespace | default $.Release.Namespace | quote }}
    {{- else }}
    apiGroup: rbac.authorization.k8s.io
    {{- end }}
  {{- end }}
roleRef:
  kind: Role
  name: {{ $fullname }}-enrollment-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "grid-enrollment.rhoai.enrollment/grid-admin-rbac.yaml" . }}
{{- end }}
