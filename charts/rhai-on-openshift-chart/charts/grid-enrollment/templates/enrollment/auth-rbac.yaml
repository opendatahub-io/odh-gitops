{{- include "grid-enrollment.normalize" . }}
{{- if eq .Values.enrollment.authz "kube" }}
{{/*
Kube authz delegates admin decisions to the API server: the service creates
TokenReviews and SubjectAccessReviews. system:auth-delegator is the built-in
ClusterRole granting exactly create on tokenreviews + subjectaccessreviews.
Without this the TokenReview/SAR calls fail closed and the admin boundary breaks.
The binding is cluster-scoped, so its name carries the namespace to stay unique
across installs.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grid-enrollment.fullname" . }}-{{ .Release.Namespace }}-auth-delegator
  labels:
    {{- include "grid-enrollment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "grid-enrollment.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
