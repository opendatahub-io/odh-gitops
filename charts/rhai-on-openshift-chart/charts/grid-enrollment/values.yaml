# -- Identity lifecycle backend: service runs the enrollment API and bootstrap;
# external consumes identity Secrets supplied by another issuer or PKI.
mode: service

# -- Persist grid identity once during bootstrap, separately from CA issuance.
gridIdentity:
  enabled: false
  # -- Pre-create this ConfigMap with an existing grid's gridId to keep that ID.
  configMapName: grid-bootstrap-state

# -- External identities and optional cert-manager issuance, with managed-cluster delivery.
external:
  # -- Site names mapped to secretName, optional dnsNames, and optional managed cluster.
  sites: {}
  # -- Public trust bundle for externally supplied identities; never a signing key.
  trustBundleSecretRef: ''
  trustBundleSecretKey: ca.crt
  delivery:
    enabled: false
    namespace: ''
    clusterSet: default
    identitySecretName: grid-site-identity
    caSecretName: grid-ca
    createClusterSetBinding: true
    # -- Permit delivery to the local cluster, using the same flow as other members.
    includeLocalCluster: false
  certManager:
    # -- Optional integration; cert-manager must already be installed.
    enabled: false
    issuer:
      # -- False references an existing issuer; true creates a namespaced CA Issuer.
      create: false
      name: grid-ca
      kind: Issuer
      group: cert-manager.io
    ca:
      # -- Generate is only for a new grid; Existing never writes the CA Secret.
      mode: Existing
      secretName: grid-ca-key
      certificateName: grid-root-ca
      bootstrapIssuerName: grid-root-selfsigned
      commonName: grid-root-ca
      durationHours: 87600
      renewBeforeHours: 8760
    certificate:
      durationHours: 4320
      # Renew when one third remains, matching the operator's rotation deadline.
      renewBeforeHours: 1440

# -- Bootstrap managed-cluster discovery, GridSite watches and peer distribution. Requires managed-cluster APIs and external mode.
managedClusters:
  enabled: false
  networkName: grid
  # -- Per-cluster gateway referenced by the enrolled GridNetwork; empty omits it.
  gatewayName: grid-gateway
  clusterSet: default
  clusterLabel: grid.praxis.fast/member
  clusterLabelValue: 'true'
  # -- Bootstrap creates one shared binding unless another release owns it.
  createClusterSetBinding: true
  workName: grid-site-observer
  # -- The hub must be registered with the policy add-on so it can reconcile
  # dynamically generated Certificates, observers and their RBAC.
  hubClusterName: local-cluster
  identitySecretPrefix: grid-site-

# Service mode: batteries included by default.
# `helm install` with no overrides stands up a full grid site ready to enroll:
# it generates the Grid CA, issues the enrollment endpoint's serving cert,
# deploys Postgres, generates a grid-admin token, and runs the enrollment
# service over TLS. Every escape hatch below overrides one of those defaults.

# -- The enrollment name sites connect to. It joins the serving cert names and is the
# default route.host.
host: ""

# -- Cloud whose load balancer settings LoadBalancer Services get: `aws` (an NLB, since the
# default carries no UDP), `azure`, `gcp`, or `any` for all three. Each cloud reads only its
# own keys, so `any` suits a render that runs on every cloud.
platform: ""

# -- Reach of the enrollment load balancer on a cloud platform. `internal` keeps it on the
# cluster's private network, so sites need private connectivity between them. `external`
# makes it internet-facing. AWS sets the scope only when a load balancer is created:
# changing it means recreating the Service.
loadBalancerScope: internal

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

image:
  # Enrollment app image. The same binary serves the API and runs the
  # `enrollment bootstrap` Job (the sar and bootstrap features, on by default).
  repository: ghcr.io/praxis-proxy/grid-enrollment
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # sha256:<64 hex>; when set, tag is ignored
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Logging, rendered as RUST_LOG.
log:
  # -- Level for every module: error, warn, info, debug, or trace.
  level: info
  # -- Full RUST_LOG directive, such as "info,enrollment=debug". When set, it replaces level.
  filter: ""

# ------------------------------------------------------------------------------
# Grid CA. Default: GENERATE on install (bootstrap Job). Escape hatch: provide.
# The signing key (grid-ca-key) is mounted ONLY into the enrollment pod. The
# gateway and peers mount grid-ca-bundle (ca.crt), never the key.
# Prerequisite: enable an etcd encryption-at-rest provider before holding the CA
# key here. A k8s Secret is base64, not encrypted, without it. KMS/HSM is the GA gate.
# ------------------------------------------------------------------------------
ca:
  method: builtin                 # builtin = generate on install; provided = bring your own
  commonName: grid-ca
  keySecretName: grid-ca-key      # kubernetes.io/tls: tls.crt + tls.key (signing key)
  bundleSecretName: grid-ca-bundle # Opaque: ca.crt (public trust anchor)
  # Replace an existing CA in place. Off by default: regenerating the CA
  # invalidates every certificate it has issued. If the CA key Secret is lost while
  # the CA bundle still exists, bootstrap refuses to mint a new CA, since that would
  # split the grid: restore the key from backup, or set this and confirmRotation to
  # start a new grid.
  forceRegenerate: false
  # -- The service records the SHA-256 of the CA's public key in the database and
  # refuses to start with a CA on any other key. To start a new grid on purpose, set this to the OLD
  # fingerprint the refusal names, exactly as printed. Clear it once the new CA serves.
  confirmRotation: ""
  provided:
    # Reference to a pre-created {tls.crt,tls.key} Secret. Never inline the key
    # in values: Helm persists release values (helm get values, GitOps, CI logs).
    keySecretRef: ""
  bootstrap:
    # The `enrollment bootstrap` subcommand runs as the pre-install Job.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Seconds a finished bootstrap Job is kept for its logs. Null keeps it until the next hook.
    ttlSecondsAfterFinished: 86400
    policy:
      # Two ValidatingAdmissionPolicies confining what this chart's unscopable create on
      # Secrets may produce: the bootstrap to the names and types the chart renders, and
      # the enrollment service to grid-invite- Secrets in its invite namespace. Kubernetes
      # cannot scope create by name on that path, and with hubSite.name the bootstrap's
      # grant lands in a namespace this release does not own.
      #
      # They are pre-install hooks, because they must admit the hook writes that follow
      # them, so Helm does not reconcile or remove them: setting this false stops
      # rendering a policy but does NOT delete one already on the cluster, and
      # helm uninstall leaves both behind. The README gives the delete commands.
      enabled: true

# ------------------------------------------------------------------------------
# Enrollment endpoint serving cert (in-process TLS). Default: issued from the
# CA by the bootstrap. Escape hatch: provide an existing cert.
# ------------------------------------------------------------------------------
serving:
  secretName: enrollment-serving-tls  # kubernetes.io/tls: tls.crt + tls.key
  existingSecretRef: ""               # BYO serving cert; else the bootstrap issues it. With a Route, it must carry route.host
  extraDnsNames: []                   # extra SANs beyond the in-cluster Service DNS

# ------------------------------------------------------------------------------
# Route: enrollment is a cross-peer front door, so a Route ships by default on
# OpenShift. Passthrough keeps the grid-CA serving cert end-to-end; the site validates
# it with the out-of-band grid-CA bundle (--cacert). When a Route renders, route.host
# is required for passthrough and is auto-added to the serving cert SAN. Reencrypt
# is the opt-out for a trusted router cert. Edge is rejected.
# ------------------------------------------------------------------------------
route:
  # -- auto renders the Route when the cluster serves route.openshift.io/v1; true or
  # false forces it. helm template without --api-versions route.openshift.io/v1 renders
  # auto as off.
  enabled: auto
  # -- External hostname. Required for passthrough when a Route renders (auto-added to
  # the serving cert SAN). A DNS-1123 subdomain, no wildcard.
  host: ""
  # -- Extra Route annotations. They override rateLimit's annotations on a key clash.
  annotations: {}
  # -- Per-source-IP connection limits in the OpenShift router (they apply to
  # passthrough). Clients behind one SNAT address share a limit.
  rateLimit:
    enabled: true
    # -- Concurrent TCP connections per source IP.
    concurrentTcp: 10
    # -- TCP connection rate per source IP, in the router's rate window.
    rateTcp: 20
  tls:
    # -- passthrough keeps the grid-CA cert and the one-time token end-to-end.
    # reencrypt terminates at the router: it exposes the enrollment token to the
    # ingress and breaks the site's out-of-band grid-CA pin. edge is rejected,
    # since enrollment serves TLS only.
    termination: passthrough
    # -- Redirect or None. Allow is refused: plaintext would leak the token.
    insecureEdgeTerminationPolicy: None
    # -- PEM CA for reencrypt to verify the backend (grid-CA bundle, ca.crt from
    # Secret grid-ca-bundle). Required for reencrypt.
    destinationCACertificate: ""

# ------------------------------------------------------------------------------
# Enrollment service
# ------------------------------------------------------------------------------
enrollment:
  replicaCount: 1
  listenAddr: "0.0.0.0:8443"
  certLifetimeSecs: ""               # empty => service default, 180 days (ENROLLMENT_CERT_LIFETIME_SECS)
  rotation:
    # -- Sites rotate their identity here with their current certificate over mutual
    # TLS. A reencrypt Route drops that certificate, so the render refuses reencrypt
    # while this is on. false refuses every rotation (503 rotation_disabled) for the
    # whole grid; issued identities stay valid until they expire.
    enabled: true
  # kube (default): SAR via TokenReview + SubjectAccessReview, the in-cluster path
  # (needs the sar-feature image and the auth-delegator RBAC this chart binds).
  # local: the standalone grid-admin-token table, for non-kube deploys. Lines in the
  # "tokens" key are name:token, where the token is everything after the first colon
  # and may contain any character. Roles come from an optional "roles" key of
  # name:role[,role] lines, from grid-admin and enrollment-admin, comma separated. A
  # name with no roles line is grid-admin: mint and revoke tokens, and read
  # enrollments. Deleting an enrollment, or minting with allowDeletedName, needs
  # enrollment-admin. An unknown role, or a roles line naming nobody in the token
  # table, fails startup.
  authz: kube                        # kube | local
  # Record each enrollment as a CertificateSigningRequest on this cluster, under
  # signer grid.praxis.fast/site: created, approved on the invite's authority and
  # completed with the issued certificate by the service, so every enrollment shows
  # in kubectl get csr and the audit log. Needs authz=kube. The record never gates
  # issue: a failed record is logged and the certificate stands.
  csrRecord:
    enabled: true
    # Signer name the records are filed under, domain-qualified. Give each
    # enrollment service on a cluster its own, since the admission policy below
    # admits only this release's service for it.
    signerName: grid.praxis.fast/site
    policy:
      # Two ValidatingAdmissionPolicies: only the service may file a request under
      # the signer name, and the service may touch no other signer name. Required
      # while the record is on. Needs admissionregistration.k8s.io/v1 (Kubernetes
      # 1.30); on an older cluster turn the record off instead.
      enabled: true
  # Namespace that holds only SiteInvite token Secrets. Empty means
  # <release-namespace>-invites, beside this release rather than inside it. The chart
  # creates it, since nothing else owns it, as a pre-install hook that outlives an
  # uninstall like the rest of the hook resources.
  #
  # It is a namespace of its own because it has to be. The service's Role needs create
  # and delete on Secrets unscoped by name, since invite names are per site, and get so
  # it can read them back. Admission confines the writes but cannot touch get, because
  # admission does not run on reads. Sharing a namespace with the Grid CA signing key
  # would therefore let the service read that key, so the render refuses it.
  inviteSecrets:
    namespace: ""
  # Audience a grid-admin token must be bound to under authz=kube, e.g.
  # kubectl create token <sa> --audience grid-enrollment --duration 10m.
  # Never an API-server audience (kubernetes, https://kubernetes.default.svc,
  # or the cluster's service account issuer): every API token carries it.
  tokenAudience: grid-enrollment
  # Grid-admins under authz=kube. The chart always creates the
  # <fullname>-grid-admin Role (create/delete on enrollmenttokens) in the release
  # namespace and binds it to these subjects.
  gridAdmins:
    # RBAC subjects, e.g. [{kind: Group, name: grid-admins}].
    subjects: []
    serviceAccount:
      # Create a ServiceAccount to mint grid-admin tokens from, and bind it.
      create: false
      name: grid-admin
  # Who may delete a site's enrollment, which ends its rotations and releases its name.
  # A Role of its own, since delete and mint together re-enroll an existing site's name.
  enrollmentAdmins:
    # RBAC subjects, e.g. [{kind: Group, name: grid-security}].
    subjects: []
  gridAdminTokens:
    generate: true                   # the bootstrap Job creates a grid-admin-token Secret once
    existingSecretRef: ""            # BYO Secret with key "tokens" (name:token), optional "roles"
  serviceAccount:
    create: true
    name: ""
  service:
    # Port is derived from listenAddr (single source of truth); set the type only.
    # Empty: LoadBalancer when host is set and no Route renders, else ClusterIP.
    type: ""
    # Static LoadBalancer address, so the enrollment URL is known before install.
    loadBalancerIP: ""
    # -- CIDRs allowed to reach the endpoint, for a LoadBalancer. Empty accepts every
    # address the load balancer is reachable from, which for an internet-facing one is the
    # internet. The endpoint holds the Grid CA and mints identities, so narrowing this is
    # worth the bookkeeping even though a token is still required.
    #
    # It has to cover every site for the life of the grid, not just while one joins: sites
    # rotate their identity through this same endpoint while enrollment.rotation.enabled,
    # and whoever mints or revokes tokens reaches it too. Sites arrive from the address
    # they egress on, so on a cloud that is each site's NAT address, and a site whose NAT
    # address changes drops off the list silently. Nothing fails at the time; the site
    # stops rotating and its identity expires at enrollment.certLifetimeSecs, 180 days by
    # default, so the mistake surfaces months later. Keep it in step with the grid's
    # membership, or leave it empty and put the restriction in front of the endpoint.
    loadBalancerSourceRanges: []
    # Service annotations, merged over the platform's.
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  affinity: {}
  tolerations: []

# ------------------------------------------------------------------------------
# Database. Default: builtin Postgres. Escape hatch: external (e.g. MaaS).
# ------------------------------------------------------------------------------
db:
  type: builtin                      # builtin = in-chart Postgres; external = bring your own
  builtin:
    image: quay.io/sclorg/postgresql-16-c9s:20260923
    imageDigest: ""                  # sha256:<64 hex>; appended as image@digest when set
    # Registry image, decoupled from image.pullPolicy so a locally-loaded app
    # image (image.pullPolicy=Never, kind/airgap) does not force Postgres to Never.
    pullPolicy: IfNotPresent
    storage: 8Gi
    # The PVC holds every site record. A GitOps install annotates it so its tool never prunes
    # or deletes it, e.g. argocd.argoproj.io/sync-options: Prune=false,Delete=false.
    pvcAnnotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
    auth:
      database: enrollment
      username: enrollment
      # Without it, the bootstrap Job creates <fullname>-db once with a generated password.
      existingSecretRef: ""          # Secret with keys: password, DB_CONNECTION_URL
    # Builtin Postgres serves TLS with a grid-CA-issued cert minted by the
    # bootstrap Job; the enrollment client connects sslmode=verify-full against
    # the grid CA bundle. The enrollment binary refuses a plaintext DB, so this
    # is not optional on the builtin path. Requires the generated CA
    # (ca.method=builtin); with a provided CA, use an external DB. Bootstrap
    # rolls the builtin DB when it re-issues this cert.
    tls:
      servingSecretName: grid-db-serving-tls
  external:
    # Secret carrying the full connection URL under connectionUrlSecretKey.
    # The URL must set sslmode=verify-full with sslrootcert=/etc/grid-db-ca/<caConfigMapKey>;
    # the binary refuses any lesser mode. Set caConfigMapName so that file is the DB's issuer.
    # On a shared Postgres server, use a database and role dedicated to enrollment, with
    # its URL in a separate Secret: whoever can write these tables can mint site identities.
    connectionUrlSecretRef: ""
    connectionUrlSecretKey: DB_CONNECTION_URL
    # Optional CA bundle for the external DB, mounted at /etc/grid-db-ca (mirrors
    # FlightCtl's db.external.tlsConfigMapName). Reference it in the URL as
    # sslrootcert=/etc/grid-db-ca/<key>.
    caConfigMapName: ""
    caConfigMapKey: ca.crt

# -- Sites to invite, keyed by site name: network (default grid), expiresInSecs,
# allowDeletedName to invite a site whose enrollment was deleted, and
# cluster when the ManagedCluster is named something other than the site. Each run skips
# sites whose invite Secret exists. The older list of {siteName, gridNetworkRef,
# expiresInSecs} still renders.
# invites:
#   site-a:
#     network: grid
#     cluster: prod-01

# -- Governance Policy delivering each invited site its token, the CA bundle and the gossip key.
# The site names come from `invites`, so they are not restated here.
invitePolicy:
  # -- Render the policy. Requires governance policy APIs on the hub and registered member clusters.
  enabled: false
  # -- Namespace on each site that its operator reads the Secrets from. Required when the
  # policy is enabled, with no default: the grid operator's namespace is grid or
  # grid-system under a Helm install and odh-ai-grid or redhat-ai-grid under a platform
  # install, which derives it from the applications namespace, so any default would
  # deliver every Secret where nothing reads it on some install path. A platform
  # namespace is refused.
  namespace: ""
  # -- ManagedClusterSet the sites belong to. The binding is named for it.
  clusterSet: default

# -- The hub's own site identity, issued by the bootstrap Job straight from the grid
# CA, so the hub never enrolls or needs an invite. It rotates like an enrolled site.
# Delete the Secret and upgrade to re-issue it.
# -- Grid-wide settings shared with the other grid charts.
grid:
  membership:
    # -- Where sites learn their members, Swim or Local, as the grid-operator chart's
    # grid.membership.source. Local creates and delivers no SWIM key.
    source: Swim

hubSite:
  # -- Hub site name. Empty disables it. Must not also be invited.
  name: ""
  # -- Namespace of the hub's grid operator, where its identity Secrets go. Required when
  # hubSite.name is set, with no default: it is grid or grid-system under a Helm install
  # and odh-ai-grid or redhat-ai-grid under a platform install, which derives it from the
  # applications namespace, so any default would deliver the hub's identity where nothing
  # reads it on some install path. A platform namespace is refused. Must exist before
  # install: the chart does not create it.
  namespace: ""
  # -- Secret the site identity is written to.
  identitySecretName: grid-site-identity
  # -- Secret the grid CA is written to beside it.
  caSecretName: grid-ca
  # -- Secret for the grid's SWIM key, created once here and in hubSite.namespace. Empty skips it.
  swimKeySecretName: grid-swim-key
  # -- Secret, in this namespace, for the seed that registers the hub's key so it can
  # rotate. Bootstrap signs it with the CA key and the service applies only what verifies.
  # A Secret, so replaying an old seed needs the Secret access that already reads the CA key.
  seedSecretName: grid-reserved-seeds

# -- Resource budget for database readiness and TLS permission init containers.
initResources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}

# -- Restrict enrollment and database ingress. Add explicit clients for direct access.
networkPolicy:
  enabled: true
  # -- Additional NetworkPolicyPeer entries for the enrollment HTTPS listener.
  from: []
  # -- Router namespaces allowed when the enrollment Route is enabled.
  routerNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
