suite: enrollment Service
templates:
  - templates/enrollment/service.yaml
tests:
  - it: renders a static LoadBalancer address when set
    documentIndex: 0
    set:
      enrollment.service.type: LoadBalancer
      networkPolicy.from: [{ipBlock: {cidr: 192.0.2.0/24}}]
      enrollment.service.loadBalancerIP: 192.0.2.10
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.loadBalancerIP
          value: 192.0.2.10

  - it: omits the address on a ClusterIP Service
    documentIndex: 0
    set:
      enrollment.service.loadBalancerIP: 192.0.2.10
    asserts:
      - notExists:
          path: spec.loadBalancerIP

  - it: narrows the endpoint to the sites that enroll through it
    documentSelector:
      path: kind
      value: Service
    set:
      host: enroll.example.com
      route.enabled: false
      enrollment.service.type: LoadBalancer
      enrollment.service.loadBalancerSourceRanges:
        - 32.188.78.92/32
        - 44.242.20.128/32
    asserts:
      - equal:
          path: spec.loadBalancerSourceRanges
          value: ["32.188.78.92/32", "44.242.20.128/32"]

  - it: omits source ranges on a ClusterIP, where they mean nothing
    documentSelector:
      path: kind
      value: Service
    set:
      enrollment.service.type: ClusterIP
      enrollment.service.loadBalancerSourceRanges:
        - 32.188.78.92/32
    asserts:
      - notExists:
          path: spec.loadBalancerSourceRanges

  - it: leaves the endpoint open when no ranges are given
    documentSelector:
      path: kind
      value: Service
    set:
      host: enroll.example.com
      route.enabled: false
      enrollment.service.type: LoadBalancer
    asserts:
      - notExists:
          path: spec.loadBalancerSourceRanges
