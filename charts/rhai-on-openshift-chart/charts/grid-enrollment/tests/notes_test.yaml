suite: NOTES endpoint
templates:
  - templates/NOTES.txt
tests:
  - it: points at the Route host when one is set
    set:
      route.enabled: true
      route.host: enroll.apps.example.com
    asserts:
      - matchRegexRaw:
          pattern: "Endpoint: https://enroll.apps.example.com\n"
      - notMatchRegexRaw:
          pattern: In-cluster only

  - it: says the router assigns the host when a Route renders without one
    set:
      route.enabled: true
      route.tls.termination: reencrypt
      enrollment.rotation.enabled: false
      route.tls.destinationCACertificate: ca
    asserts:
      - matchRegexRaw:
          pattern: router-assigned host
      - notMatchRegexRaw:
          pattern: In-cluster only

  - it: says in-cluster only without a Route
    set:
      route.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: In-cluster only

  - it: warns that an external database URL must be verify-full
    set:
      db.type: external
      db.external.connectionUrlSecretRef: maas-db-config
    asserts:
      - matchRegexRaw:
          pattern: "Secret/maas-db-config must set sslmode=verify-full"

  - it: says nothing about the URL for the builtin database
    asserts:
      - notMatchRegexRaw:
          pattern: sslmode=verify-full
