suite: backends keyed by site
templates:
  - templates/gateway-config.yaml
  - templates/deployment.yaml
release:
  name: praxis-gateway
  namespace: grid
tests:
  - it: a hub consumer renders a site endpoint with its identity and Grid CA
    template: templates/gateway-config.yaml
    set:
      praxisConfig.source: render
      grid.siteName: hub
      praxisConfig.render.model: my-model
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends.site-a.endpoint: 203.0.113.20:8080
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '\{ kind: inference_model, name: "my-model", site: "site-a", cluster: "site-a" \}'
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '(?s)- name: "site-a"\s+tls:.*sni: "site-a.grid.internal"\s+verify: true\s+endpoints:\s+- "203.0.113.20:8080"'

  - it: a site consumer mounts the grid identity and the Grid CA
    template: templates/deployment.yaml
    set:
      praxisConfig.source: render
      grid.siteName: hub
      praxisConfig.render.model: my-model
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends.site-a.endpoint: 203.0.113.20:8080
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name=="tls")].projected.sources[1].secret.name
          value: grid-ca

  - it: renders keyed backends in sorted order
    template: templates/gateway-config.yaml
    set:
      praxisConfig.source: render
      grid.siteName: hub
      praxisConfig.render.model: my-model
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends.site-b.endpoint: 203.0.113.21:8080
      praxisConfig.render.backends.site-a.endpoint: 203.0.113.20:8080
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '(?s)cluster: "site-a" \}.*cluster: "site-b" \}'

  - it: rejects a site backend that would silently use plaintext
    template: templates/deployment.yaml
    set:
      praxisConfig.source: render
      grid.siteName: hub
      praxisConfig.render.model: my-model
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends.site-a.endpoint: 203.0.113.20:8080
    asserts:
      - failedTemplate:
          errorPattern: serves the remote site "site-a" but gridIdentity.tlsSecretName is empty

  - it: accepts a site backend that sets plaintext on purpose
    template: templates/gateway-config.yaml
    set:
      praxisConfig.source: render
      grid.siteName: hub
      praxisConfig.render.model: my-model
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends.site-a.endpoint: 203.0.113.20:8080
      praxisConfig.render.backends.site-a.site: site-a
      praxisConfig.render.backends.site-a.transport.mode: plaintext
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'site: "site-a", cluster: "site-a"'

  - it: a provider renders its local endpoint with its identity and Grid CA
    template: templates/gateway-config.yaml
    set:
      image.repository: ghcr.io/praxis-proxy/grid-gateway
      praxisConfig.source: render
      praxisConfig.render.role: provider
      grid.siteName: site-a
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
      praxisConfig.render.peerTrust.digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      praxisConfig.render.peerTrust.nextDigest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      praxisConfig.render.backends.local.endpoint: 10.96.0.20:8000
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'cert_digest: "a{64}"\s+- cert_digest: "b{64}"'
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '(?s)- name: "local"\s+endpoints:\s+- "10.96.0.20:8000"'
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: 'name: "local"\s+tls:'

  - it: a spiffeId scalar renders the allowlist
    template: templates/gateway-config.yaml
    set:
      image.repository: ghcr.io/praxis-proxy/grid-gateway
      praxisConfig.source: render
      praxisConfig.render.role: provider
      grid.siteName: site-a
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
      praxisConfig.render.peerTrust.mode: spiffe
      praxisConfig.render.peerTrust.spiffeId: spiffe://grid.internal/site/hub
      praxisConfig.render.backends.local.endpoint: 10.96.0.20:8000
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'trusted_spiffe_ids:\s+- "spiffe://grid.internal/site/hub"'

  - it: the older backend list still renders
    template: templates/gateway-config.yaml
    set:
      praxisConfig.source: render
      grid.siteName: hub
      praxisConfig.render.model: my-model
      praxisConfig.render.auth.mode: none
      praxisConfig.render.backends:
        - cluster: local-model
          endpoints: ["10.0.0.1:8000"]
          transport: { mode: plaintext }
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'site: "hub", cluster: "local-model"'
