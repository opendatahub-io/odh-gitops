suite: config checksum
templates:
  - templates/deployment.yaml
release:
  name: gw
  namespace: grid
set:
  image.flavor: grid-gateway
  gridIdentity.tlsSecretName: grid-site-identity
  gridIdentity.caSecretName: grid-ca
tests:
  - it: hashes the rendered config, so a praxisConfig.render change rolls the pods
    set:
      praxisConfig.source: render
      grid.siteName: east
      praxisConfig.render.role: provider
      praxisConfig.render.peerTrust.certDigests: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
      praxisConfig.render.backends:
        - cluster: local
          endpoints: ["10.96.0.20:8000"]
          transport: { mode: plaintext }
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
      # Pinned so the changed-endpoint test below compares against a real hash.
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 835f4ba5853398c65e91d760398bbbdc4aab0f6e04204da12d1b92a3edcacc65

  - it: hashes the config when render is selected explicitly
    set:
      praxisConfig.source: render
      grid.siteName: east
      praxisConfig.render.role: provider
      praxisConfig.render.peerTrust.certDigests: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
      praxisConfig.render.backends:
        - cluster: local
          endpoints: ["10.96.0.20:8000"]
          transport: { mode: plaintext }
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: a changed backend endpoint changes the checksum
    set:
      praxisConfig.source: render
      grid.siteName: east
      praxisConfig.render.role: provider
      praxisConfig.render.peerTrust.certDigests: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
      praxisConfig.render.backends:
        - cluster: local
          endpoints: ["10.96.0.21:8000"]
          transport: { mode: plaintext }
    asserts:
      # The 10.96.0.20 config's hash, from the first test.
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 835f4ba5853398c65e91d760398bbbdc4aab0f6e04204da12d1b92a3edcacc65

  - it: inline config is hashed as given
    set:
      praxisConfig.source: byo
      praxisConfig.byo.inline: 'listeners: [{name: default, address: "0.0.0.0:8080"}]'
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: a57d7f9e283ac1782f59ef0fdd09f136e368b10093eef3bb5be3ab463a1fb779

  - it: an existing ConfigMap the chart does not own gets no checksum
    set:
      praxisConfig.source: byo
      praxisConfig.byo.configMapName: my-praxis
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]
