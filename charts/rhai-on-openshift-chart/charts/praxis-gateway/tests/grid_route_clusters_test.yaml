suite: grid_site_route declared clusters
templates:
  - templates/gateway-config.yaml
  - templates/deployment.yaml
release:
  name: grid
  namespace: grid
# grid_site_route skips a candidate whose cluster this gateway does not declare, and
# load_balancer refuses an undeclared cluster outright. Both lists must come from the
# same backends, or a candidate the operator adds reaches load_balancer and the request
# fails with a 500 instead of a no-route.
tests:
  - it: declares every backend's cluster to the grid filter
    template: templates/gateway-config.yaml
    set:
      image.flavor: grid-gateway
      grid.siteName: dagobah
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
      praxisConfig.source: render
      praxisConfig.render.auth.mode: none
      praxisConfig.render.gridServing.enabled: true
      praxisConfig.render.gridServing.networkName: grid
      praxisConfig.render.backends:
        - cluster: grid-local-a
          endpoints: ["10.0.0.1:8000"]
          transport: { mode: plaintext }
        - cluster: grid-local-b
          site: dagobah
          endpoints: ["10.0.0.2:8000"]
          transport: { mode: plaintext }
        - cluster: grid-remote-e
          endpoints: ["192.168.1.218:443"]
          site: site-e
          transport:
            mode: mutual_tls
            sni: site-e.grid.internal
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'filter: grid_site_route\n\s+model_header: X-Gateway-Model-Name\n\s+clusters:\n\s+- "grid-local-a"\n\s+- "grid-local-b"\n\s+- "grid-remote-e"'

  - it: declares the remote cluster the draw can select, so it is never a 500
    template: templates/gateway-config.yaml
    set:
      image.flavor: grid-gateway
      grid.siteName: dagobah
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
      praxisConfig.source: render
      praxisConfig.render.auth.mode: none
      praxisConfig.render.gridServing.enabled: true
      praxisConfig.render.gridServing.networkName: grid
      praxisConfig.render.backends:
        - cluster: grid-local-a
          endpoints: ["10.0.0.1:8000"]
          transport: { mode: plaintext }
        - cluster: grid-remote-e
          endpoints: ["192.168.1.218:443"]
          site: site-e
          transport:
            mode: mutual_tls
            sni: site-e.grid.internal
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'clusters:\n\s+- "grid-local-a"\n\s+- "grid-remote-e"'

  - it: fails render mode without backends
    template: templates/deployment.yaml
    set:
      image.flavor: grid-gateway
      grid.siteName: dagobah
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
      praxisConfig.source: render
      praxisConfig.render.auth.mode: none
      praxisConfig.render.gridServing.enabled: true
      praxisConfig.render.gridServing.networkName: grid
      praxisConfig.render.backends: []
    asserts:
      - failedTemplate:
          errorPattern: praxisConfig.render.backends needs at least one backend
