suite: grid roles
templates:
  - templates/gateway-config.yaml
  - templates/deployment.yaml
release:
  name: gw
  namespace: grid
set:
  image.flavor: grid-gateway
  praxisConfig.source: render
  grid.siteName: east
  gridIdentity.tlsSecretName: grid-site-identity
  gridIdentity.caSecretName: grid-ca
  praxisConfig.render.role: provider
  praxisConfig.render.peerTrust.certDigests: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
  praxisConfig.render.backends:
    - cluster: local
      endpoints: ["10.96.0.20:8000"]
      transport: { mode: plaintext }
tests:
  - it: a pin provider requires a Grid-CA client certificate and checks the digest first
    template: templates/gateway-config.yaml
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'client_cert_mode: require\n'
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '(?s)filters:\s+- filter: peer_identity_trust.*cert_digest: "a{64}".*- filter: static_response.*- filter: router.*- filter: headers.*X-Grid-Provider-Site.*value: "east"'

  - it: a rate limit sits between peer trust and the router
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.peerTrust.rateLimit: { rate: 20, burst: 40 }
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '(?s)peer_identity_trust.*- filter: rate_limit\s+mode: global\s+rate: 20\s+burst: 40.*- filter: router'

  - it: the router forwards only the allowed paths, matched exactly
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.provider.allowedPaths: ["/v1/models"]
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '- path: "/v1/models"\s+cluster: "local"'
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: 'path_prefix'
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: '"/v1/chat/completions"'

  - it: refuses every method but GET and POST before routing
    template: templates/gateway-config.yaml
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '(?s)- filter: static_response\s+status: 405\s+conditions:\s+- unless:\s+methods: \[GET, POST\]\s+.*- filter: router'

  - it: refuses an allowed path that could traverse or widen the match
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.provider.allowedPaths: ["/v1/models/../../x"]
    asserts:
      - failedTemplate: {}

  - it: refuses a percent-encoded allowed path
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.provider.allowedPaths: ["/v1/%2e%2e/x"]
    asserts:
      - failedTemplate: {}

  - it: a spiffe provider names allowed peers at the handshake and again in the chain
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.peerTrust.mode: spiffe
      praxisConfig.render.peerTrust.certDigests: []
      praxisConfig.render.peerTrust.spiffeIds: ["spiffe://grid.internal/site/hub"]
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'client_cert_mode: require_named\s+trusted_spiffe_ids:\s+- "spiffe://grid.internal/site/hub"'
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '- filter: peer_identity_trust\s+trusted_peers:\s+- organization: "hub"'
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: cert_digest

  - it: projects the site identity and only the public Grid CA
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            projected:
              sources:
                - secret:
                    name: grid-site-identity
                    items:
                      - key: tls.crt
                        path: tls.crt
                      - key: tls.key
                        path: tls.key
                - secret:
                    name: grid-ca
                    items:
                      - key: ca.crt
                        path: ca.crt

  - it: does not require a model on a provider
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.model: ""
    asserts:
      - hasDocuments:
          count: 1

  - it: a provider needs the grid-gateway flavor
    template: templates/deployment.yaml
    set:
      image.flavor: ai
    asserts:
      - failedTemplate:
          errorPattern: "image.flavor grid-gateway"

  - it: a provider requires the Grid identity
    template: templates/deployment.yaml
    set:
      gridIdentity.tlsSecretName: ""
      gridIdentity.caSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: "praxisConfig.render.role provider needs gridIdentity.tlsSecretName"

  - it: a provider rejects api-key caller authentication
    template: templates/deployment.yaml
    set:
      praxisConfig.render.auth.mode: api-key
    asserts:
      - failedTemplate:
          errorPattern: "api-key is only supported for consumers"

  - it: renders connect timeouts only when set
    template: templates/gateway-config.yaml
    asserts:
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: connection_timeout_ms

  - it: renders connect timeouts that are set
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.backends:
        - cluster: local
          endpoints: ["10.96.0.20:8000"]
          connectTimeoutMs: 1000
          totalConnectTimeoutMs: 4000
          transport: { mode: plaintext }
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'connection_timeout_ms: 1000\s+total_connection_timeout_ms: 4000'

  - it: defaults a list-form provider local backend to plaintext
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.backends:
        - cluster: local
          endpoints: ["10.96.0.20:8000"]
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: '- name: "local"\s+endpoints:\s+- "10\.96\.0\.20:8000"'
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: 'name: "local"\s+tls:'

  - it: trusts only the hostname endpoints of a trustPrivate backend
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.backends:
        - cluster: local
          endpoints: ["m.ns.svc.cluster.local.:8000", "10.96.0.20:8000"]
          trustPrivate: true
          transport: { mode: tls, sni: m.ns.svc }
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'trusted_private_endpoints:\s+- "m.ns.svc.cluster.local"\n'
      - notMatchRegex:
          path: data["praxis.yaml"]
          pattern: 'trusted_private_endpoints:\s+(- "[^"]+"\s+)*- "10\.96'

  - it: a consumer candidate names the remote site it routes to
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.role: consumer
      grid.siteName: hub
      praxisConfig.render.model: m
      praxisConfig.render.auth.mode: none
      praxisConfig.render.peerTrust.certDigests: []
      praxisConfig.render.backends:
        - cluster: site-a
          site: site-a
          endpoints: ["203.0.113.20:8080"]
          transport: { mode: mutual_tls, sni: site-a.grid.internal }
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'site: "site-a", cluster: "site-a"'
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'local_site: "hub"'

  - it: refuses a remote consumer backend with no site
    template: templates/deployment.yaml
    set:
      praxisConfig.render.role: consumer
      grid.siteName: hub
      praxisConfig.render.model: m
      praxisConfig.render.auth.mode: none
      praxisConfig.render.peerTrust.certDigests: []
      praxisConfig.render.backends:
        - cluster: site-a
          endpoints: ["203.0.113.20:8080"]
          transport: { mode: mutual_tls, sni: site-a.grid.internal }
    asserts:
      - failedTemplate:
          errorPattern: set its site

  - it: refuses a remote consumer backend named as the local site
    template: templates/deployment.yaml
    set:
      praxisConfig.render.role: consumer
      grid.siteName: hub
      praxisConfig.render.model: m
      praxisConfig.render.auth.mode: none
      praxisConfig.render.peerTrust.certDigests: []
      praxisConfig.render.backends:
        - cluster: site-a
          site: hub
          endpoints: ["203.0.113.20:8080"]
          transport: { mode: mutual_tls, sni: site-a.grid.internal }
    asserts:
      - failedTemplate:
          errorPattern: a remote backend is another site

  - it: a remote backend verifies <site>.grid.internal by default
    template: templates/gateway-config.yaml
    set:
      praxisConfig.render.role: consumer
      grid.siteName: hub
      praxisConfig.render.model: m
      praxisConfig.render.auth.mode: none
      praxisConfig.render.peerTrust.certDigests: []
      praxisConfig.render.backends:
        - cluster: site-a
          site: site-a
          endpoints: ["203.0.113.20:8080"]
    asserts:
      - matchRegex:
          path: data["praxis.yaml"]
          pattern: 'sni: "site-a.grid.internal"'

  - it: a provider mounts the configured identity and CA Secrets
    template: templates/deployment.yaml
    set:
      gridIdentity.tlsSecretName: grid-site-identity
      gridIdentity.caSecretName: grid-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            projected:
              sources:
                - secret:
                    name: grid-site-identity
                    items:
                      - key: tls.crt
                        path: tls.crt
                      - key: tls.key
                        path: tls.key
                - secret:
                    name: grid-ca
                    items:
                      - key: ca.crt
                        path: ca.crt

  - it: mounts provider credentials at the operator default path
    template: templates/deployment.yaml
    set:
      providerCredentials:
        - secretName: model.api-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: credential-0
            mountPath: /run/secrets/grid-credentials/model-api-key
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credential-0
            secret:
              secretName: model.api-key
              optional: false

  - it: truncates the default provider credential path at 63 characters
    template: templates/deployment.yaml
    set:
      providerCredentials:
        - secretName: provider-credential-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "credential-0")].mountPath
          value: /run/secrets/grid-credentials/provider-credential-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
