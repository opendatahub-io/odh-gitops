suite: provider peer trust
templates:
  - templates/deployment.yaml
set:
  image.flavor: grid-gateway
  grid:
    siteName: site-a
  praxisConfig:
    source: render
    render:
      role: provider
      backends:
        - cluster: local
          endpoints: ["10.0.0.1:8000"]
          transport: {mode: plaintext}
  gridIdentity:
    tlsSecretName: grid-site-identity
    caSecretName: grid-ca
tests:
  - it: admits every Grid-CA site only when allowAnyGridSite is explicit
    set:
      praxisConfig.render.peerTrust.mode: spiffe
      praxisConfig.render.peerTrust.allowAnyGridSite: true
    asserts:
      - notFailedTemplate: {}
