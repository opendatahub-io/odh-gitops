# -- Number of gateway replicas.
replicaCount: 1

# -- Gateway container image settings.
image:
  # -- Image repository.
  repository: ghcr.io/praxis-proxy/ai
  # -- Image tag. Used when digest is empty.
  tag: "0.7.0"
  # -- Immutable image digest (sha256:<64 hex>). When set, tag is ignored.
  digest: ""
  # -- Image pull policy.
  pullPolicy: "IfNotPresent"
  # -- ai (praxis-proxy/ai) or grid-gateway, the grid build that the render provider role and
  # praxisConfig.render.gridServing need.
  flavor: ai

# -- Pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified app name, which also names the Service. Set this to
# the GridNetwork gatewayRefs[].name when using the overlay sidecar.
fullnameOverride: ""
# -- Labels added to all chart-managed resources.
commonLabels: {}
# -- Additional labels on the gateway pod template. Selector labels cannot
# be overridden.
podLabels: {}
# -- Annotations on the gateway pod template.
podAnnotations: {}

# -- Delegate generated Secret mounts to the Grid operator for an opted-in
# GridNetwork gateway. Grid owns only its reserved volumes and mounts.
mountReconciliation:
  # -- Annotate this Deployment so the operator can verify explicit ownership.
  enabled: false
  # -- GridNetwork name that delegates this gateway's generated mounts.
  network: ""
  # -- GridNetwork gatewayRefs name. Defaults to this chart's Deployment name.
  gatewayRef: ""
  # -- Release selected Helm-managed credential mounts and TLS mounts after
  # Grid reports the generated config Ready.
  # Keep false during the preparation rollout.
  releaseHelmMounts: false
  # -- Credential Secret names whose mounts Grid now owns. Other entries in
  # providerCredentials remain Helm-managed and are rendered as before. These mounts
  # are omitted only when releaseHelmMounts is true.
  managedCredentialNames: []
  # -- Create a Role and RoleBinding in the release namespace that let the AGN
  # Operator's ServiceAccount get and patch this chart's Deployment and no other.
  # The operator's own charts grant no unrestricted Deployment access; rotation
  # retains a grant on the named gateway. Set false to bring
  # your own Role (the README shows it), for example when the installer may not
  # create RBAC.
  rbac:
    create: true
  # -- The operator ServiceAccount the Role binds. The name matches the grid-operator
  # chart and the platform overlay alike, so it defaults. The namespace does not: a Helm
  # install puts the operator in grid or grid-system, and a platform install derives
  # odh-ai-grid or redhat-ai-grid from the applications namespace. A default would bind a
  # ServiceAccount that does not exist on the other path, and the only symptom is that
  # mount reconciliation never runs, so this is required.
  operator:
    serviceAccount: grid-operator
    namespace: ""

# -- Extra pod-level securityContext fields (e.g. runAsUser, runAsGroup).
# runAsNonRoot and seccompProfile are always set by the chart.
podSecurityContext: {}
# runAsUser: 100
# runAsGroup: 101

# -- Numeric user and group for the Praxis container when podSecurityContext sets
# no runAsUser; a podSecurityContext runAsGroup still replaces gid. The official
# Praxis images run as the named user praxis (100:101). The kubelet can only enforce
# runAsNonRoot against a numeric user, and refuses to start the container when it has
# none.
imageUser:
  # -- auto applies uid and gid only to the official praxis-proxy ai, praxis, and
  # grid-gateway images (mirrors that keep that path count), not their -fips tags,
  # which run as 1001:1001, and not on OpenShift (security.openshift.io/v1 is served),
  # where the restricted SCC assigns IDs from the namespace range. Other images keep
  # the user they declare. true forces it for any image, such as one built FROM the
  # official images that keeps the named user praxis; false never applies it. helm
  # template without --api-versions security.openshift.io/v1 renders auto as on.
  enabled: auto
  # -- runAsUser for the Praxis container.
  uid: 100
  # -- runAsGroup for the Praxis container.
  gid: 101

# -- Container command, replacing the image entrypoint. Empty keeps the entrypoint.
# Set it for images whose entrypoint already passes a config path, for example
# ["praxis"] for the core image ghcr.io/praxis-proxy/praxis.
command: []

# -- Container arguments. Defaults to the config file path.
args:
  - "--config"
  - "/etc/praxis/praxis.yaml"

# -- Environment variables passed to the Praxis container. Use valueFrom for
# -- credentials and other deployment-managed secrets.
env: []

# -- Logging, rendered as RUST_LOG on the gateway and overlay-sync containers. An env
# entry named RUST_LOG takes precedence on the gateway. Praxis adds config.runtime.log_overrides
# per module on top, and its admin listener can change the level at runtime without a restart.
log:
  # -- Level for every module: off, error, warn, info, debug, or trace. Empty leaves
  # RUST_LOG unset, so the binary uses its own default (info).
  level: ""
  # -- Full RUST_LOG directive, such as "info,praxis_filter=debug". When set, it replaces level.
  filter: ""

# -- GridNetwork and local site used by render and the overlay sidecar.
grid:
  # -- GridNetwork name. Required when the overlay sidecar is enabled.
  networkName: ""
  # -- This gateway's site. Required for render and when the overlay sidecar is enabled.
  siteName: ""

# -- Praxis configuration (praxis.yaml). source selects who writes the file. Render is
# explicit; Grid routing values do not change the selected source.
# render: the chart renders praxis.yaml + policy.yaml from render.
praxisConfig:
  # -- Source that writes praxis.yaml: byo (default), operator, or render.
  source: byo
  # -- BYO ConfigMap or inline Praxis configuration.
  byo:
    # -- Name of your ConfigMap holding the Praxis configuration. The chart mounts it
    # but does not manage it, so editing it does not restart the pods. Empty serves inline.
    configMapName: ""
    # -- Key within configMapName that holds praxis.yaml.
    key: "praxis.yaml"
    # -- Praxis configuration the chart stores in its own ConfigMap when configMapName
    # is empty. Changing it rolls the pods. One listener must bind port.containerPort,
    # or the install fails. The default answers GET / with a small JSON status and
    # everything else with 404, so a bare install serves traffic. Replace it with your
    # own listeners, routes, and clusters, for example with
    # --set-file praxisConfig.byo.inline=praxis.yaml.
    inline: |
      admin:
        metrics_address: "127.0.0.1:9901"
      listeners:
        - name: default
          address: "0.0.0.0:8080"
          filter_chains: [default]
      filter_chains:
        - name: default
          filters:
            - filter: static_response
              status: 200
              headers:
                - name: Content-Type
                  value: application/json
              body: '{"status": "ok", "server": "praxis"}'
              conditions:
                - when:
                    path: "/"
            - filter: static_response
              status: 404
              headers:
                - name: Content-Type
                  value: application/json
              body: '{"error": "not found"}'

  operator:
    # -- Name of the Grid operator's ConfigMap. Empty uses praxis-consumer-config.
    configMapName: ""
    # -- Allow a LoadBalancer or NodePort Service. The operator's praxis.yaml has no
    # caller authentication; use only when something outside this chart limits access.
    allowUnauthenticatedExposure: false
    # -- Operator serving data for a GridNetwork gatewayRef with praxisConfig.siteRouter
    # gridSiteRoute. Requires mountReconciliation and image.flavor grid-gateway.
    gridServing:
      # -- Mount the serving data and set GRID_SERVING_CONFIG.
      enabled: false
      # -- GridNetwork name. Empty uses mountReconciliation.network.
      networkName: ""
      # -- This gateway's name in the GridNetwork gatewayRefs. Empty uses mountReconciliation.gatewayRef.
      gatewayRefName: ""
      # -- Override the derived serving ConfigMap name grid-serving-<networkName>-<gatewayRefName>.
      configMapName: ""
      # -- Mount directory for the serving ConfigMap.
      mountPath: "/etc/praxis/grid-serving"

  # -- Settings used only with source render. Other source modes reject these values. The
  # chart emits
  # praxis.yaml + policy.yaml (the auth chain) from these values and never emits
  # insecure_options; endpoints are values.
  render:
    # -- Opt in to OTLP tracing in the generated praxis.yaml. Requires
    # image.flavor: grid-gateway, whose Grid image build includes the Praxis OTLP
    # exporter and Praxis AI routing-span features. Credentials belong in env as
    # Secret-backed OTEL_EXPORTER_OTLP_HEADERS, never here.
    telemetry:
      enabled: false
      # -- OTLP/gRPC endpoint. Empty uses OTEL_EXPORTER_OTLP_ENDPOINT from env.
      otlpEndpoint: ""
      # -- Root sampling probability in the inclusive range 0.0..1.0.
      samplingRate: null
      # -- OpenTelemetry service.name resource attribute.
      serviceName: ""
      # -- OpenTelemetry service.version resource attribute.
      serviceVersion: ""
      # -- deployment.environment resource attribute.
      environment: ""
      # -- Batch export interval in seconds; must be positive.
      batchIntervalSecs: null
      # -- Maximum spans per export batch; must be positive.
      batchSize: null
    # -- consumer routes callers. provider serves grid peers on the grid identity and forwards to one backend.
    role: consumer
    # -- Grid peers a provider accepts, each with a Grid-CA client certificate.
    peerTrust:
      # -- pin (certDigests) or spiffe (spiffeIds, experimental). Match the GridNetwork peerTrust.mode.
      mode: pin
      # -- pin mode: lowercase hex SHA-256 of each allowed peer's leaf certificate (DER).
      certDigests: []
      # -- pin mode: one allowed leaf digest, added to certDigests.
      digest: ""
      # -- pin mode: the next leaf digest during a rotation.
      nextDigest: ""
      # -- spiffe mode: allowed peer SPIFFE IDs (spiffe://grid.internal/site/<name>).
      spiffeIds: []
      # -- spiffe mode: one allowed SPIFFE ID, added to spiffeIds.
      spiffeId: ""
      # -- spiffe mode with no spiffeIds: accept any site the Grid CA signed.
      allowAnyGridSite: false
      # -- Optional inbound budget shared by all peers, for example { rate: 20, burst: 40 }.
      rateLimit: {}
    # -- Provider role settings.
    provider:
      # -- Exact paths forwarded to the local backend, GET and POST only. Other paths get a 404.
      allowedPaths:
        - /v1/chat/completions
        - /v1/completions
        - /v1/models
        - /v1/embeddings
    # -- Model advertised on the routing candidates. A consumer without
    # praxisConfig.render.gridServing needs it.
    model: ""
    auth:
      # -- Caller authentication, required when source is render. api-key validates a
      # consumer caller's key against validateUrl and needs an image whose policy engine
      # registers identity/api-key (praxis-policy 0.4 or later); provider role rejects it
      # because providers authenticate peers by Grid identity. The render refuses it on
      # the legacy ai:0.4.0 image. none
      # renders no policy filter and belongs only behind an authenticating front.
      mode: ""
      # -- With mode none, allow a LoadBalancer or NodePort Service. Without it the render
      # fails, since that exposes unauthenticated inference. The guard only sees this chart's
      # Service; see networkPolicy for exposure created outside the chart.
      allowUnauthenticatedExposure: false
      # -- Remove the caller's Authorization header before routing, in either mode. The
      # key authenticates this hop only. Forwarded grid hops authenticate by mTLS identity.
      # false forwards the caller's key or bearer to every backend and cross-site peer; use
      # it only when the backend validates that same credential.
      stripAuthorization: true
      # -- identity/validate endpoint URL (a backend answering the validate contract: POST {"key":...} returns {"valid":...}). Must be https, or the render fails, since a plaintext validate call ships the credential in the clear.
      validateUrl: ""
      # -- Let the validate call reach a private address (an in-cluster Service). Sets the
      # policy filter's allow_private_idp, which is engine-wide: every policy callout may then
      # reach any private, loopback, or link-local address, not only validateUrl.
      allowPrivateEndpoint: false
      # -- CA that signs the validate endpoint's certificate (for example the OpenShift
      # service CA). Mounted and set as SSL_CERT_FILE, which REPLACES the platform trust
      # store for the process: the validate call and https backends without a per-backend CA
      # or upstreamCA use it; mutual_tls backends and upstreamCA do not. Build the bundle as
      # the image's /etc/ssl/certs/ca-certificates.crt plus the service CA, or set upstreamCA
      # for public https backends. Set configMapName or secretName, not both. Empty keeps the
      # platform store.
      validateCA:
        # -- ConfigMap holding the bundle (for example one annotated
        # service.beta.openshift.io/inject-cabundle, key service-ca.crt).
        configMapName: ""
        # -- Secret holding the bundle.
        secretName: ""
        # -- Key holding the PEM bundle.
        key: "ca.crt"
        # -- Mount path for the bundle.
        mountPath: "/etc/praxis/validate-ca"
      # -- Credential prefix the resolver strips before lookup.
      prefix: "Bearer "
      # -- Validate call timeout (seconds).
      timeoutSecs: 5
    # -- Backend clusters. Each renders a health_check so a literal ClusterIP routes without
    # allow_private_upstreams, plus an explicit transport. A remote-site backend omitting
    # transport.mode uses mutual_tls when gridIdentity.tlsSecretName is set. Without
    # that identity, omitting mode fails the render; select plaintext explicitly
    # when cleartext is intended. A provider's local backend defaults to plaintext.
    # mutual_tls presents that identity (gridIdentity.mountPath tls.crt/tls.key, verified against its
    # ca.crt) and needs a sni naming the peer. tls verifies the backend's server cert with
    # no client cert: sni defaults to the endpoint host. Its trust, first match wins:
    # transport.ca (a ConfigMap or Secret), then upstreamCA (upstream_ca_file), then the
    # process store. With auth.validateCA set, SSL_CERT_FILE replaces the process store,
    # so such a backend then trusts only that bundle. An in-cluster hostname
    # resolves to a private address, which praxis refuses, so use the ClusterIP endpoint
    # with sni set to the Service DNS name. plaintext is cleartext.
    # The health_check type defaults to tcp for TLS transports (the active http probe is
    # plaintext and cannot reach a TLS peer) and http for plaintext. Override per backend
    # with healthCheck.type. A mutual_tls backend, another site's gateway, defaults to
    # connectTimeoutMs 2000, totalConnectTimeoutMs 4000 and a probe every 3s; other backends
    # probe every 5s with praxis's connect timeouts. Every probe times out at 2s.
    # Keyed by site. For a provider, local is its one local backend. The older list of
    # {cluster, endpoints, ...} still renders.
    # backends:
    #   site-a:
    #     endpoint: 203.0.113.20:8080        # transport mutual_tls, sni site-a.grid.internal
    #   local:                               # provider role
    #     endpoint: 10.96.0.20:8000
    # The older list form:
    #  - cluster: site-a
    #    site: site-a                     # the grid site it serves; required for a remote backend
    #    endpoints: ["172.30.202.42:8000"]
    #    healthCheck: { type: http, path: /health, intervalMs: 5000, timeoutMs: 2000 }
    #    transport: { mode: mutual_tls, sni: site-a.grid.internal }  # or { mode: plaintext }
    #  - cluster: local-qwen3            # KServe LLMInferenceService on OpenShift, HTTPS :8000
    #    endpoints: ["172.30.12.34:8000"]  # the workload Service ClusterIP
    #    transport:
    #      mode: tls
    #      sni: qwen3-kserve-workload-svc.llm.svc
    #      ca: { configMapName: openshift-service-ca.crt, key: service-ca.crt }
    # -- Operator-rendered serving data for grid_site_route. This does not select the operator
    # source: praxisConfig.source remains render and the chart still renders praxis.yaml.
    gridServing:
      # -- Mount the serving data, set GRID_SERVING_CONFIG, and use grid_site_route. On a provider,
      # read provider.json from the consumer gatewayRefName's ConfigMap and serve with grid_provider.
      enabled: false
      # -- GridNetwork name, which with gatewayRefName names the operator's ConfigMap. Empty uses grid.networkName.
      networkName: ""
      # -- This gateway's name in the GridNetwork gatewayRefs. Defaults to the release fullname.
      gatewayRefName: ""
      # -- Override the derived serving ConfigMap name grid-serving-<networkName>-<gatewayRefName>.
      configMapName: ""
      # -- Mount directory for the serving ConfigMap.
      mountPath: "/etc/praxis/grid-serving"
      # -- CA bundles the operator's tls dials verify against, each { secretName or
      # configMapName, key (default ca.crt) }, mounted read-only at
      # /run/secrets/grid-backend-ca/<name>/<key>. One entry per Secret or ConfigMap.
      # Leave empty when mountReconciliation lets the operator mount them.
      backendCAs: []
      # -- Tuning for the grid_site_route filter block: availability and prefixAffinity, keys as
      # the filter reads them. Fields and defaults in examples/gateway/grid-site-route.yaml.
      siteRoute:
        # -- Site availability. Every field defaults; `shedding` is the one switch.
        availability: {}
        # -- Prefix affinity. Cache limits: capacity (16384 entries per backend cluster),
        # ttl_secs (600 seconds); positive integers.
        prefixAffinity: {}

# -- CA bundle for backend TLS without a per-cluster CA. Empty secretName keeps the system
# trust store. A configured bundle replaces system trust roots; include public and
# private roots when both are needed. Per-cluster CAs override this bundle.
# `render` writes upstream_ca_file; with `byo`, set runtime.upstream_ca_file in
# your praxis.yaml. Not supported with `operator`.
upstreamCA:
  # -- Secret holding the CA bundle. Empty turns upstreamCA off.
  secretName: ""
  # -- Key within the Secret that holds the PEM bundle.
  key: "ca.crt"
  # -- Mount path for the CA bundle.
  mountPath: "/etc/praxis/upstream-ca"

# -- Inbound TLS on the gateway listener. The default posture assumes an inbound TLS
# front (an OpenShift Route or a Gateway) terminates TLS and forwards to this plaintext
# listener. Set secretName to terminate TLS from a mounted server cert (tls.crt/tls.key).
# Works with render consumers and BYO; a BYO praxis.yaml must reference mountPath.
# Render providers use gridIdentity.tlsSecretName and reject listenerTls.secretName.
# Not supported with source operator. A non-empty secretName names the container port https.
# On OpenShift, set
# service.annotations service.beta.openshift.io/serving-cert-secret-name to the Secret
# name and the service CA issues the cert.
listenerTls:
  # -- Secret holding the server certificate and key. Empty keeps the listener plaintext.
  secretName: ""
  # -- Mount path for the listener certificate.
  mountPath: "/etc/praxis/listener-tls"

# -- Primary listener port configuration.
port:
  # -- Container port number.
  containerPort: 8080
  # -- Port name. Empty: https when listenerTls.secretName is set, else http.
  name: ""
  # -- Port protocol.
  protocol: "TCP"

# -- NetworkPolicy that limits which pods can reach the listener port, where the CNI
# enforces NetworkPolicy. It is not authentication. With auth.mode none it narrows
# exposure the Service guard cannot see (oc expose, another Service, an HTTPRoute): list
# only the authenticating front. Node and host-network traffic handling is CNI-specific
# (OVN-Kubernetes: the policy-group.network.openshift.io/host-network namespace label), and
# a LoadBalancer with externalTrafficPolicy Cluster can SNAT clients to node IPs.
networkPolicy:
  # -- Render the NetworkPolicy.
  enabled: true
  # -- NetworkPolicyPeer entries allowed to reach the listener. Required when enabled.
  # {podSelector: {}} admits every pod in this namespace. An empty namespaceSelector and an
  # ipBlock of 0.0.0.0/0 or ::/0 admit everyone and fail the render.
  from:
    - podSelector:
        matchLabels:
          grid.opendatahub.io/gateway-client: "true"
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
  # - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress}}
  #   podSelector: {matchLabels: {app: authenticating-front}}

# -- TLS listener serving only GET /metrics, for an in-cluster Prometheus. The admin
# listener cannot be scraped from outside the pod. Needs the grid-gateway image and
# networkPolicy.enabled, since the port is reachable only from fromNamespaces.
metricsListener:
  # -- Serve the listener. auto serves it for the grid-gateway image on OpenShift with
  # networkPolicy.enabled, and fills each unset value below from the platform: the service
  # serving cert in <fullname>-metrics-tls, openshift-user-workload-monitoring, and the
  # openshift-service-ca.crt CA. true needs each value set.
  enabled: auto
  # -- Container and Service port.
  port: 9443
  # -- Secret holding tls.crt and tls.key, for example the serving cert that
  # service.annotations requests on OpenShift. Required when enabled.
  existingSecret: ""
  # -- Mount path for the cert. The listener reloads it when it changes.
  mountPath: "/etc/praxis/metrics-tls"
  # -- Namespaces, by name, whose pods may reach the port. Required when enabled.
  fromNamespaces: []
  service:
    # -- Annotations on the ClusterIP metrics Service.
    annotations: {}
  serviceMonitor:
    # -- Render a monitoring.coreos.com/v1 ServiceMonitor for the metrics Service. auto
    # renders it when the listener is on, monitoring.coreos.com/v1 is served, and a CA is set.
    enabled: auto
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout. Unset leaves Prometheus's default of 10s, which Prometheus
    # refuses when it exceeds the interval, so an interval under 10s needs this set
    # to at most the interval.
    scrapeTimeout: ""
    # -- ConfigMap holding the CA that signed the metrics cert. Required when enabled.
    caConfigMap:
      name: ""
      key: "ca.crt"
    # -- Additional labels on the ServiceMonitor, for a collector that selects by label.
    labels: {}

# -- Gateway Service configuration.
service:
  # -- Create a Service for the gateway.
  enabled: true
  # -- Service type. Empty: LoadBalancer for a provider, which peers dial, else ClusterIP.
  type: ""
  # -- Service port number.
  port: 8080
  # -- Service annotations.
  annotations: {}
  # -- Static IP for LoadBalancer type.
  loadBalancerIP: ""

# -- Cloud whose load balancer settings LoadBalancer Services get: `aws` (an NLB, since the
# default carries no UDP), `azure`, `gcp`, or `any` for all three. Each cloud reads only its
# own keys, so `any` suits a render that runs on every cloud.
platform: ""

# -- Reach of the provider load balancer on a cloud platform. `internal` keeps it on the
# cluster's private network, so sites need private connectivity between them. `external`
# makes it internet-facing. AWS sets the scope only when a load balancer is created:
# changing it means recreating the Service.
loadBalancerScope: internal

# -- OpenShift Route to the Service, for a stable HTTPS name. The gateway terminates TLS.
route:
  # -- Attest that a BYO praxis.yaml serves TLS on the Service port with a cert for route.host.
  externalTls: false
  # -- Render the Route. Needs the route.openshift.io/v1 API.
  enabled: false
  # -- External hostname, a name on the gateway certificate. Required when enabled.
  host: ""
  # -- Route annotations.
  annotations: {}
  tls:
    # -- passthrough keeps TLS and client certificates end to end. reencrypt terminates at the router.
    termination: passthrough
    # -- PEM CA that signed the gateway certificate. Required for reencrypt, unless the
    # listener cert is the one the Service's serving-cert-secret-name annotation issues.
    destinationCACertificate: ""

# -- Optional operator-produced routing overlay for BYO praxis.yaml. Setting configMapName
# turns it on; render and operator sources reject overlays because their praxis.yaml does
# not read overlay_file.
overlay:
  # -- Name of the operator-produced overlay ConfigMap. Empty turns overlay delivery off.
  configMapName: ""
  # -- Directory where praxis.yaml reads routing-overlay.json.
  mountPath: "/etc/praxis/routing"
  # -- Overlay sync sidecar settings.
  sidecar:
    # -- Run overlay-sync. False mounts routing-overlay.json directly, without validation or RBAC.
    enabled: true
    # -- Sidecar container image.
    image:
      # -- Image repository.
      repository: ghcr.io/praxis-proxy/grid-overlay-sync
      # -- Image tag. Empty uses the chart appVersion, which is the praxis version,
      # not a grid-overlay-sync tag, so keep this set.
      tag: "v0.3.0-rc.3"
      # -- Image pull policy.
      pullPolicy: IfNotPresent
    # -- ConfigMap data key containing the overlay envelope.
    dataKey: "routing-overlay.json"
    # -- Sidecar resource requests and limits.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi

# -- Grid identity Secret used for mTLS to backends and peer gateways. It must contain
# tls.crt and tls.key. Empty turns the identity off. When caSecretName is empty, the chart
# reads ca.crt from tlsSecretName. Set caSecretName only when the CA is in a separate Secret.
gridIdentity:
  # -- Secret holding the client certificate and key.
  tlsSecretName: ""
  # -- Secret holding ca.crt. Empty uses tlsSecretName. Set it when the CA is separate.
  caSecretName: ""
  # -- Mount path for TLS files.
  mountPath: "/etc/praxis/tls"

# -- Provider credential Secrets referenced by InferenceProvider CRs.
providerCredentials: []
# - secretName: openai-api-key
#   # mountPath defaults to /run/secrets/grid-credentials/openai-api-key
#   optional: false

# -- Probe configuration.
health:
  # -- Readiness probe settings. Set to null to disable.
  # A tcpSocket without a port becomes an HTTP probe of the loopback admin listener when
  # the chart sees one (rendered config or praxisConfig.byo.inline). It asks /healthy when
  # the gateway forwards to backends (rendered backends, gridServing, or inline clusters;
  # /ready fails while any backend is down), else /ready, and runs /bin/sh with curl or wget,
  # whichever the image has; see adminProbeCommand. When the chart sees no admin listener,
  # it stays a plain TCP connect to the listener port, which checks no path. A BYO inline TLS
  # listener without a visible admin listener is refused, since a TCP probe fails its
  # handshake every period. Give tcpSocket a port, or another handler, to keep your own probe.
  readiness:
    tcpSocket: {}
    initialDelaySeconds: 3
    periodSeconds: 5
  # -- Liveness probe settings. Set to null to disable. Chosen the same way as readiness,
  # but always asks /healthy.
  liveness:
    tcpSocket: {}
    initialDelaySeconds: 5
    periodSeconds: 10
  # -- Command for the admin-listener probe; the URL is appended as its last argument. Empty
  # uses /bin/sh with curl or wget. Set it for an image with neither, for example a
  # distroless image that ships its own HTTP check.
  adminProbeCommand: []

# -- Seconds a terminating pod keeps serving before Praxis is told to stop. Praxis
# closes its listener as soon as it gets SIGTERM, but Service endpoints take a moment
# to drop the pod, so without a delay every rollout refuses a few requests. Runs the
# image's sleep binary as a preStop hook, and the default terminationGracePeriodSeconds
# grows to cover it. 0 disables it, which an image without sleep (distroless or
# scratch) needs.
shutdownDelaySeconds: 5

# -- Seconds Kubernetes gives a terminating pod before killing it. Empty: 30 plus
# shutdownDelaySeconds, so Praxis still gets its default 30 seconds
# (shutdown_timeout_secs) to drain in-flight requests after the delay. Raise it if your
# Praxis config sets a longer shutdown_timeout_secs. Must exceed shutdownDelaySeconds,
# and with praxisConfig.source operator, whose config drains for 30, cover 30 plus it.
terminationGracePeriodSeconds: null

# -- Container resource requests and limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 2
    memory: 1Gi
# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Pod affinity rules.
affinity: {}
# -- Pod tolerations.
tolerations: []
# -- Topology spread constraints.
topologySpreadConstraints: []
# -- Priority class for the gateway pod.
priorityClassName: ""
