{{- define "praxis-gateway.rhoai.route.yaml" -}}
{{- include "praxis-gateway.normalize" . }}
{{- if .Values.route.enabled }}
{{- $termination := .Values.route.tls.termination }}
{{- $providerFile := and (eq .Values.praxisConfig.source "render") (eq (.Values.praxisConfig.render.role | default "consumer") "provider") (.Values.praxisConfig.render.gridServing).enabled }}
{{- /* Peers dial a provider by its site's grid name, the name its certificate carries. */}}
{{- $host := .Values.route.host | default (ternary (printf "%s.grid.internal" (toString .Values.grid.siteName)) "" (and $providerFile (not (empty .Values.grid.siteName)))) }}
{{- if not .Values.service.enabled }}
{{- fail "route.enabled needs service.enabled: the Route targets the chart Service" }}
{{- end }}
{{- if not $host }}
{{- fail "route.host is required when route.enabled is true: it must be a name on the gateway certificate" }}
{{- end }}
{{- if eq .Values.praxisConfig.source "operator" }}
{{- fail "route is not supported with praxisConfig.source operator: the operator's praxis.yaml listens on plaintext HTTP, and a Route here passes TLS through or re-encrypts to it. Expose the Service through an ingress that terminates TLS" }}
{{- end }}
{{- if and (eq .Values.praxisConfig.source "byo") (not (or .Values.route.externalTls .Values.listenerTls.secretName)) }}
{{- fail "route needs TLS at the gateway: inline/external config requires route.externalTls=true and a TLS listener on the Service port" }}
{{- end }}
{{- if eq .Values.praxisConfig.source "render" }}
{{- $provider := eq (.Values.praxisConfig.render.role | default "consumer") "provider" }}
{{- if not (or $provider .Values.listenerTls.secretName) }}
{{- fail "route needs TLS at the gateway: set listenerTls or use the provider role" }}
{{- end }}
{{- if and $provider (eq $termination "reencrypt") }}
{{- fail "route.tls.termination reencrypt drops the peer client certificate a provider requires; use passthrough" }}
{{- end }}
{{- if and (not $provider) (eq .Values.praxisConfig.render.auth.mode "none") (not .Values.praxisConfig.render.auth.allowUnauthenticatedExposure) }}
{{- fail "praxisConfig.render.auth.mode none with a Route exposes unauthenticated inference; use api-key or set praxisConfig.render.auth.allowUnauthenticatedExposure" }}
{{- end }}
{{- end }}
{{- /* A service-ca listener cert needs no destination CA: the router already trusts that CA. */}}
{{- $serviceCa := and .Values.listenerTls.secretName (eq (get (.Values.service.annotations | default dict) "service.beta.openshift.io/serving-cert-secret-name" | default "") (.Values.listenerTls.secretName | default "-")) }}
{{- if and (eq $termination "reencrypt") (not .Values.route.tls.destinationCACertificate) (not $serviceCa) }}
{{- fail "route.tls.termination reencrypt needs route.tls.destinationCACertificate, the CA that signed the gateway certificate, unless the listener cert is the service-ca one the Service annotation issues" }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "praxis-gateway.fullname" . }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ $host | quote }}
  to:
    kind: Service
    name: {{ include "praxis-gateway.fullname" . }}
    weight: 100
  port:
    targetPort: {{ include "praxis-gateway.portName" . }}
  tls:
    termination: {{ $termination }}
    {{- with .Values.route.tls.destinationCACertificate }}
    {{- if eq $termination "reencrypt" }}
    destinationCACertificate: |
      {{- . | nindent 6 }}
    {{- end }}
    {{- end }}
    insecureEdgeTerminationPolicy: None
  wildcardPolicy: None
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "praxis-gateway.rhoai.route.yaml" . }}
{{- end }}
