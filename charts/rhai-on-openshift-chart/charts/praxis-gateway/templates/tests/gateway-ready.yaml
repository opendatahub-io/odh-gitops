{{- define "praxis-gateway.rhoai.tests/gateway-ready.yaml" -}}
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "praxis-gateway.fullname" . }}-test
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
    grid.opendatahub.io/gateway-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    {{- if not (include "praxis-gateway.openshift" .) }}
    runAsUser: 65534
    runAsGroup: 65534
    {{- end }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: connectivity-check
      image: {{ include "praxis-gateway.relatedImage" (dict "root" . "name" "RELATED_IMAGE_ODH_PRAXIS_AI_GRID_TEST_IMAGE") | default "busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e" | quote }}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - sh
        - -c
        - |
          # TCP connectivity only: application routes and TLS identities are site-specific.
          nc -z -w5 {{ include "praxis-gateway.fullname" . }} {{ .Values.service.port }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "praxis-gateway.rhoai.tests/gateway-ready.yaml" . }}
{{- end }}
