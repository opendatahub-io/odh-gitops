{{- define "praxis-gateway.rhoai.rolebinding.yaml" -}}
{{- include "praxis-gateway.normalize" . }}
{{- if and .Values.overlay.configMapName .Values.overlay.sidecar.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "praxis-gateway.fullname" . }}-overlay-sync
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "praxis-gateway.fullname" . }}-overlay-sync
subjects:
  - kind: ServiceAccount
    {{- if .Values.metricsListener.enabled }}
    name: {{ include "praxis-gateway.metricsAuthSA" . }}
    {{- else }}
    name: {{ include "praxis-gateway.fullname" . }}-overlay-sync
    {{- end }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "praxis-gateway.rhoai.rolebinding.yaml" . }}
{{- end }}
