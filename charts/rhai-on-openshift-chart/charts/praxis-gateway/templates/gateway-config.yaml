{{- define "praxis-gateway.rhoai.gateway-config.yaml" -}}
{{- include "praxis-gateway.normalize" . }}
{{- /*
Secure-by-default: renders praxis.yaml (and policy.yaml with auth.mode api-key), never
emits insecure_options. Literal ClusterIP backends route through a per-cluster
health_check. Endpoints are values, not defaults.
*/ -}}
{{- if .Values.gatewayConfig.render }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "praxis-gateway.fullname" . }}-config
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
data:
{{- include "praxis-gateway.gatewayConfigData" . }}
{{- end }}
{{- end }}
{{- if .Chart.IsRoot }}
{{ include "praxis-gateway.rhoai.gateway-config.yaml" . }}
{{- end }}
