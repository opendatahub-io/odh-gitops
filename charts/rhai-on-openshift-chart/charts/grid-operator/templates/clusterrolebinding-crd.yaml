{{- include "grid-operator.normalize" . }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grid-operator.fullname" . }}-crd
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grid-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "grid-operator.fullname" . }}-crd
  apiGroup: rbac.authorization.k8s.io
{{- end }}
