# Source: ai-grid-o11y-hub/templates/tenant-metrics-reader-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-hub-metrics-reader
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-hub-metrics-reader
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-observability
    app.kubernetes.io/managed-by: Helm
rules:
  # Required by the hub Route's OAuth proxy.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # ACM metrics access for every namespace on every managed cluster.
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["metrics/*"]
