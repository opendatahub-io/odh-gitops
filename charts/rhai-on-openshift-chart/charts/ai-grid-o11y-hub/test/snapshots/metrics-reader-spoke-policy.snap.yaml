---
# Source: ai-grid-o11y-hub/templates/tenant-metrics-reader-policy.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: "ai-grid-hub-metrics-reader-token"
  namespace: "ai-grid-o11y"
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/name: ai-grid-hub-metrics-reader
    app.kubernetes.io/instance: release-test
    app.kubernetes.io/part-of: ai-grid-observability
    app.kubernetes.io/managed-by: Helm
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: "ai-grid-hub-metrics-reader-token"
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                type: Opaque
                metadata:
                  name: "ai-grid-hub-metrics-reader-token"
                  namespace: "redhat-ods-monitoring"
                data:
                  token: '{{hub fromSecret "ai-grid-o11y" "ai-grid-hub-metrics-reader-token" "token" hub}}'
