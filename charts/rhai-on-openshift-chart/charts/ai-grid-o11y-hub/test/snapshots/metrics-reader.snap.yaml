    app.kubernetes.io/part-of: ai-grid-observability
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-hub-metrics-reader
subjects:
  - kind: ServiceAccount
    name: ai-grid-hub-metrics-reader
    namespace: "ai-grid-o11y"
