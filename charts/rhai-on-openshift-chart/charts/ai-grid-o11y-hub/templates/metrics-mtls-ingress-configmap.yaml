{{- if .Values.mtlsIngress.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-grid-o11y-hub.fullname" . }}-mtls
  labels:
    {{- include "ai-grid-o11y-hub.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      # Only the read endpoints needed by the spoke label proxy can reach Thanos.
      map $uri $allowed_query_path {
        default 0;
        /-/healthy 1;
        /api/v1/query 1;
        /api/v1/query_range 1;
        /api/v1/query_exemplars 1;
        /api/v1/series 1;
        /api/v1/labels 1;
        ~^/api/v1/label/[a-zA-Z_][a-zA-Z0-9_]*/values$ 1;
      }
      resolver {{ .Values.mtlsIngress.dnsResolver }} valid=30s;
      server {
        listen {{ .Values.mtlsIngress.listenPort }} ssl;
        ssl_certificate /etc/grid/server/tls.crt;
        ssl_certificate_key /etc/grid/server/tls.key;
        ssl_client_certificate /etc/grid/client-ca/ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($request_method != GET) { return 405; }
        if ($allowed_query_path = 0) { return 404; }
        location / {
          set $thanos_upstream {{ printf "%s:%v" .Values.mtlsIngress.thanosHostname .Values.mtlsIngress.thanosPort | quote }};
          proxy_pass_request_headers off;
          proxy_pass_request_body off;
          proxy_pass http://$thanos_upstream$uri$is_args$args;
          proxy_set_header Host {{ .Values.mtlsIngress.thanosHostname | quote }};
          proxy_set_header Authorization "";
          proxy_set_header Content-Length "";
          proxy_http_version 1.1;
        }
      }
    }
{{- end }}
