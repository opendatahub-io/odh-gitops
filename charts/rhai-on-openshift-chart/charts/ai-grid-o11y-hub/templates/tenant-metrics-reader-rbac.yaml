{{- if and .Values.enabled .Values.tenantMetricsReader.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-grid-hub-metrics-reader
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "ai-grid-o11y-hub.tenantMetricsReader.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tenantMetricsReader.tokenSecretName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "ai-grid-o11y-hub.tenantMetricsReader.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: ai-grid-hub-metrics-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-hub-metrics-reader
  labels:
    {{- include "ai-grid-o11y-hub.tenantMetricsReader.labels" . | nindent 4 }}
rules:
  # Required by the hub Route's OAuth proxy.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  # ACM metrics access for every namespace on every managed cluster.
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["metrics/*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-hub-metrics-reader
  labels:
    {{- include "ai-grid-o11y-hub.tenantMetricsReader.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-hub-metrics-reader
subjects:
  - kind: ServiceAccount
    name: ai-grid-hub-metrics-reader
    namespace: {{ .Values.namespace | quote }}
{{- end }}
