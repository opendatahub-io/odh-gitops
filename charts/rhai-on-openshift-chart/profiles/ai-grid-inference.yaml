# AI Grid inference profile - an AI Grid site that serves models to the grid
# Enables KServe for model serving and AIGateway with only aiGrid (the Grid operator).
# MaaS and the dashboard stay Removed: callers reach this site's models through another
# cluster's MaaS gateway. Grid enrollment runs on the grid hub; the provider
# gateway runs locally so peers can dial this site's models directly.
# Dependencies auto-installed (through kserve): cert-manager, RHCL/Kuadrant

argocd:
  enabled: true

operator:
  type: rhoai

ai-grid-o11y-spoke:
  enabled: true
  collector:
    namespace: redhat-ods-monitoring

dependencies:
  nfd:
    enabled: true
  nvidiaGPUOperator:
    enabled: true
  rhcl:
    olm:
      config:
        env:
          - name: AUTH_SERVICE_TIMEOUT
            value: 5s
    config:
      authorinoServiceCaTrust: true
      spec:
        observability:
          enable: true

services:
  monitoring:
    dsci:
      managementState: Managed
      # Minimal dev config: metrics need storage size; traces require a
      # storage backend (pv = ephemeral-ish local dev storage, no S3 needed).
      # ACM reads the collector's own prometheus exporter, so no extra exporter here.
      metrics:
        storage:
          size: 20Gi
      traces:
        storage:
          backend: pv
          size: 10Gi

components:
  aigateway:
    dependencies:
      certManager: false
      leaderWorkerSet: false
      rhcl: false
    dsc:
      managementState: Managed
      aiGrid:
        managementState: Managed
  kserve:
    dependencies:
      jobSet: false
      certManager: true
      leaderWorkerSet: true
      rhcl: true
    dsc:
      managementState: Managed
    gateway:
      annotations:
        grid.opendatahub.io/serving: >-
          {
            "networkName": "grid",
            "namespace": "redhat-ai-grid",
            "serviceAccount": "grid-model-client",
            "tokenSecret": "grid-model-client-token",
            "publishMetrics": true
          }
      spec:
        # A platform-issued serving cert on the https listener.
        infrastructure:
          annotations:
            service.beta.openshift.io/serving-cert-secret-name: openshift-ai-inference-service-tls
        listeners:
          - name: http
            port: 80
            # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
            protocol: HTTP
            allowedRoutes:
              namespaces:
                # AI project namespaces opt in with grid.opendatahub.io/allowed=true.
                from: Selector
                selector:
                  matchLabels:
                    grid.opendatahub.io/allowed: "true"

          # TODO: fix https listener with TLS certs
          - name: https
            port: 443
            # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
                - name: openshift-ai-inference-service-tls
            allowedRoutes:
              namespaces:
                # AI project namespaces opt in with grid.opendatahub.io/allowed=true.
                from: Selector
                selector:
                  matchLabels:
                    grid.opendatahub.io/allowed: "true"

# Enrollment comes from grid-bootstrap on the hub, through ACM.

praxis-gateway:
  enabled: false

praxis-provider-gateway:
  enabled: true
  # The provider gateway of every site where models run: peers dial it over grid
  # mTLS, and it reaches the site's models through the RHOAI serving gateway.
  # Peers dial this directly, so the SNI stays <site>.grid.internal and matches the leaf.
  fullnameOverride: grid-provider-gateway

  image:
    flavor: grid-gateway
    repository: ghcr.io/praxis-proxy/grid-gateway
    digest: sha256:0c3ecddfffdfba7c068d645e8bd878aeba6ac92570d6b50a88430ada0c92602b

  grid:
    networkName: grid
    # siteName comes from the ApplicationSet, one per cluster.
  praxisConfig:
    source: render
    render:
      role: provider
      # Peers are admitted from the operator's provider file, by grid identity.
      peerTrust:
        mode: spiffe
      # No backends: the operator's provider file lists each local model with the
      # dial that reaches it, read from the consumer gateway's serving ConfigMap.
      gridServing:
        enabled: true
        networkName: grid
        gatewayRefName: grid-gateway
  # The model-client token a local dial sends to the serving gateway; a peer's own
  # token is dropped.
  providerCredentials:
    - secretName: grid-model-client-token
  # The service CA (rhoai-prerequisites copies it into this Secret) verifies the
  # serving gateway's cert on a local dial.
  upstreamCA:
    secretName: openshift-service-ca
    key: ca.crt
  gridIdentity:
    tlsSecretName: grid-site-identity
    caSecretName: grid-ca
    mountPath: /etc/praxis/tls
  # Peers arrive through the router, so the Service needs no address of its own.
  service:
    type: ClusterIP

  # The router carries 443, so peers arrive there. The Route's host defaults to
  # <site>.grid.internal, the name on this site's leaf and the SNI a peer sends,
  # so passthrough reaches the listener with the client certificate intact.
  route:
    enabled: true
    tls:
      termination: passthrough
    annotations:
      haproxy.router.openshift.io/timeout: 300s

  # The listener admits the serving gateway's clients and the router; the rhoai
  # ApplicationSet replaces from per site. The metrics port admits only the collectors.
  # Explicit, because auto turns the metrics listener on at 0.3.0 whether or not a
  # NetworkPolicy fronts it.
  networkPolicy:
    enabled: true
    from:
      - podSelector:
          matchLabels:
            grid.opendatahub.io/gateway-client: "true"
      - namespaceSelector:
          matchLabels:
            network.openshift.io/policy-group: ingress
  # TLS metrics on 9443 for the platform collector, which selects the scrape label.
  metricsListener:
    enabled: true
    existingSecret: grid-provider-gateway-metrics-tls
    fromNamespaces:
      - redhat-ods-monitoring
      - openshift-user-workload-monitoring
    service:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: grid-provider-gateway-metrics-tls
    serviceMonitor:
      enabled: true
      caConfigMap:
        name: openshift-service-ca.crt
        key: service-ca.crt
      labels:
        monitoring.opendatahub.io/scrape: "true"
