display:
  name: AI Grid routing
  description: 'Why this site''s grid gateway sent requests where it did: the outcome, how the candidate was chosen, the load and capacity it read, and how fresh those readings were. Site is the candidate''s
    site; backend is the candidate it routed to.'
duration: 1h
variables:
- kind: ListVariable
  spec:
    name: namespace
    display:
      name: Project
      description: Filter by project. The grid gateway lives in its own project; models and their endpoint pickers in theirs.
    allowMultiple: true
    allowAllValue: true
    customAllValue: .*
    defaultValue: $__all
    plugin:
      kind: PrometheusLabelValuesVariable
      spec:
        datasource: &id001
          kind: PrometheusDatasource
          name: data-science-prometheus-datasource
        labelName: exported_namespace
        matchers:
        - grid_route_site_rho
        - '{__name__=~"kserve_vllm:num_requests_running|vllm:num_requests_running"}'
- kind: ListVariable
  spec:
    name: site
    display:
      name: Site
      description: Grid sites this gateway routes to.
    allowMultiple: true
    allowAllValue: true
    customAllValue: .*
    defaultValue: $__all
    plugin:
      kind: PrometheusLabelValuesVariable
      spec:
        datasource: *id001
        labelName: site
        matchers:
        - grid_route_site_score{site!="",exported_namespace=~"$namespace"}
- kind: ListVariable
  spec:
    name: backend
    display:
      name: Backend cluster
      description: The candidate cluster the gateway routed to, the gateway's cluster label renamed to backend by its ServiceMonitor.
    allowMultiple: true
    allowAllValue: true
    customAllValue: .*
    defaultValue: $__all
    plugin:
      kind: PrometheusLabelValuesVariable
      spec:
        datasource: *id001
        labelName: backend
        matchers:
        - grid_route_site_score{site=~"$site",exported_namespace=~"$namespace"}
panels:
  decided:
    kind: Panel
    spec:
      display:
        name: Requests decided (requests/sec)
        description: Requests per second this gateway made a routing decision for, whether it sent them to a site or refused them.
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: decimal
            decimalPlaces: 2
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum(rate(grid_route_decisions_total{exported_namespace=~"$namespace"}[$__rate_interval]))
  refusedRatio:
    kind: Panel
    spec:
      display:
        name: Requests refused
        description: 'Share of requests this gateway answered with an error instead of sending to a site. The reasons: no site was ready for the model (503), the chosen site had no route from this gateway
          (503), the request named no model or one nobody serves (400 or 404), or the model was shed because every site serving it was full.'
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: percent-decimal
            decimalPlaces: 1
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: (sum(rate(grid_route_decisions_total{reason=~"not_ready|no_route|bad_request|shed",exported_namespace=~"$namespace"}[$__rate_interval]))) / (sum(rate(grid_route_decisions_total{exported_namespace=~"$namespace"}[$__rate_interval]))
                > 0)
  fallbackRatio:
    kind: Panel
    spec:
      display:
        name: Sent to unhealthy sites
        description: Share of requests this gateway sent to a site it had marked unhealthy, because no healthy site was left for that model. The request still gets served. Above zero means the grid is running
          a model on sites it would normally avoid.
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: percent-decimal
            decimalPlaces: 1
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: (sum(rate(grid_route_decisions_total{reason="fallback",exported_namespace=~"$namespace"}[$__rate_interval]))) / (sum(rate(grid_route_decisions_total{exported_namespace=~"$namespace"}[$__rate_interval]))
                > 0)
  shedding:
    kind: Panel
    spec:
      display:
        name: Models shedding
        description: 'Models this gateway is shedding now: every healthy site serving them is past full.'
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: decimal
            decimalPlaces: 0
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: count(max by (model) (grid_route_shedding{exported_namespace=~"$namespace"}) == 1) or vector(0)
  sitesFull:
    kind: Panel
    spec:
      display:
        name: Site capacity full
        description: Candidates at their ceiling with work waiting for 5 s. This reading has no hold and flips near the ceiling. A model sheds only when every site stays full, so read Shedding for the decision.
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: decimal
            decimalPlaces: 0
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: count(max by (backend) (grid_route_site_full{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"}) == 1) or vector(0)
  oldestReading:
    kind: Panel
    spec:
      display:
        name: Oldest site load reading in use
        description: Age of the stalest load reading any routing decision used, across every site this gateway routes to. The gateway refreshes readings every few seconds, so a value in the tens of seconds
          means a site has stopped answering and is routed on old data.
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: seconds
            decimalPlaces: 1
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max(grid_route_site_reading_age_seconds{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
  routedPerCandidate:
    kind: Panel
    spec:
      display:
        name: Routed per model and site (requests/sec)
        description: Requests sent to each site and cluster.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 0.25
            areaOpacity: 1
            connectNulls: false
            stack: all
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (site, backend) (rate(grid_route_decisions_total{site=~"$site",backend=~"$backend",reason=~"routed|fallback",exported_namespace=~"$namespace"}[$__rate_interval]))
              seriesNameFormat: '{{site}} {{backend}}'
  decisionsByReason:
    kind: Panel
    spec:
      display:
        name: Decisions by outcome (requests/sec)
        description: 'routed: a healthy site. fallback: a demoted site. not_ready: every candidate excluded (503). no_route: no route from this gateway (503). bad_request: no model or an unknown one (400/404).
          shed: every healthy site past full (429).'
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 0.25
            areaOpacity: 1
            connectNulls: false
            stack: all
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (reason) (rate(grid_route_decisions_total{exported_namespace=~"$namespace"}[$__rate_interval]))
              seriesNameFormat: '{{reason}}'
  selectionPath:
    kind: Panel
    spec:
      display:
        name: How the site was chosen (requests/sec)
        description: 'two_choices: three or more sites with room, the lower load of two drawn by capacity. between_two: two sites with room, weighted by capacity over 1 + load. lone: one site with room.
          by_capacity: no site with room, drawn by capacity among sites not full.'
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 0.25
            areaOpacity: 1
            connectNulls: false
            stack: all
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (path) (rate(grid_route_selections_total{exported_namespace=~"$namespace"}[$__rate_interval]))
              seriesNameFormat: '{{path}}'
  prefixAffinity:
    kind: Panel
    spec:
      display:
        name: Prompt affinity (requests/sec)
        description: 'sticky: kept to the sites holding the prompt. load_override: their queue outweighed the match. exploration: sent elsewhere to learn. no_match: no site held the prompt. not_applicable:
          fewer than two sites with room. Requests with no conversation are left out.'
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 0.25
            areaOpacity: 1
            connectNulls: false
            stack: all
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (outcome) (rate(grid_route_prefix_affinity_total{outcome!="not_applicable",exported_namespace=~"$namespace"}[$__rate_interval]))
              seriesNameFormat: '{{outcome}}'
  prefixIndexFill:
    kind: Panel
    spec:
      display:
        name: Prompt index fill
        description: Keys held over capacity, for the fullest gateway replica. Each replica keeps its own index. Expired keys count until displaced or re-sent.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: percent-decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (backend) (grid_route_prefix_index_entries{backend=~"$backend",exported_namespace=~"$namespace"} / (grid_route_prefix_index_capacity{backend=~"$backend",exported_namespace=~"$namespace"}
                > 0))
              seriesNameFormat: '{{backend}}'
  prefixIndexEvictions:
    kind: Panel
    spec:
      display:
        name: Prompt index evictions (requests/sec)
        description: 'capacity: a full index pushed out a live key, so raise the prefix affinity capacity. ttl: a turn arrived after its key expired with nothing waiting on it, so turns arrive late and
          capacity does not fix it. pending: an expired key was pushed out while a request still waited on it, so responses are slow or lost. forgotten: failed or refused requests withdrew their keys, so
          it tracks backend errors.'
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 0.25
            areaOpacity: 1
            connectNulls: false
            stack: all
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (backend, reason) (rate(grid_route_prefix_index_evictions_total{backend=~"$backend",exported_namespace=~"$namespace"}[$__rate_interval]))
              seriesNameFormat: '{{backend}} {{reason}}'
  rho:
    kind: Panel
    spec:
      display:
        name: Load per model and site
        description: 'Saturation the draw weighs each candidate by: the nearer of its counted and reported load, smoothed. 1 means no room. A gap means unmeasured.'
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_rho{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}} {{backend}}'
  rhoSources:
    kind: Panel
    spec:
      display:
        name: 'Load: site report vs this gateway''s in-flight requests'
        description: Two readings of the same load per model and site. The site report is the KV cache use the site publishes about itself, plus its spread, polled a few seconds ago and complete. The in-flight
          count is what this gateway has sent to that candidate and is still waiting on, over its ceiling, current but only its own traffic.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_rho_reported{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: site report {{site}} {{backend}}
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_rho_counted{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: this gateway in flight {{site}} {{backend}}
  weight:
    kind: Panel
    spec:
      display:
        name: Capacity per model and site
        description: How many requests the gateway believes each candidate can carry at once, measured from how it has been serving. A bigger capacity gets a bigger share of the traffic. A gap means not
          yet measured, and the gateway then assumes the average of the others.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_weight{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}} {{backend}}'
  inFlight:
    kind: Panel
    spec:
      display:
        name: In flight vs ceiling per model and site
        description: Requests this gateway has running at each candidate against the ceiling it used. The soft bound is what it learned from congestion and the hard bound is what the site declared. In flight
          near the ceiling with the soft bound under the hard one means the gateway capped the site below what it declared.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_in_flight{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: in flight {{site}} {{backend}}
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_ceiling{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: ceiling {{site}} {{backend}}
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_ceiling_soft{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: ceiling soft {{site}} {{backend}}
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_ceiling_hard{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: ceiling hard {{site}} {{backend}}
  score:
    kind: Panel
    spec:
      display:
        name: Score per model and site
        description: Score each candidate ranks by in the current snapshot. A gap means excluded or demoted. A 1 on the unavailable line means the selector had no score for that candidate and could only
          fall back.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_score{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}} {{backend}}'
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_score_unavailable{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: score unavailable {{site}} {{backend}}
  full:
    kind: Panel
    spec:
      display:
        name: Full per model and site
        description: 1 while a candidate has had a backlog at its ceiling long enough to shed.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            max: 1
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_full{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}} {{backend}}'
  silent:
    kind: Panel
    spec:
      display:
        name: Silent per model and site
        description: 1 while a site that has published sent nothing within the freshness window. A silent site takes no request while a live one can.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            max: 1
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_silent{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}} {{backend}}'
  readingAge:
    kind: Panel
    spec:
      display:
        name: Age of the load reading used per model and site
        description: How old the peer's load reading was when each decision used it. A line that only climbs is a frozen reading, not a steady one.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: seconds
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site, backend) (grid_route_site_reading_age_seconds{site=~"$site",backend=~"$backend",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}} {{backend}}'
  roundAge:
    kind: Panel
    spec:
      display:
        name: Seconds since each site last reported its load
        description: Seconds since this gateway last fetched a load reading from each peer site. Empty for its own site.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: seconds
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: max by (site) (grid_route_site_round_age_seconds{site=~"$site",exported_namespace=~"$namespace"})
              seriesNameFormat: '{{site}}'
  signalsPoll:
    kind: Panel
    spec:
      display:
        name: Load reading fetches per second
        description: How often this gateway fetches load readings from each peer site, by result. Anything but ok leaves that site's reading to age.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 0.25
            areaOpacity: 1
            connectNulls: false
            stack: all
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (result) (rate(grid_signals_poll_total{exported_namespace=~"$namespace"}[$__rate_interval]))
              seriesNameFormat: '{{result}}'
  ingestDropped:
    kind: Panel
    spec:
      display:
        name: Load readings rejected per second
        description: Load readings the gateway threw away instead of routing on them, by reason.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: decimal
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (reason) (rate(grid_signals_ingest_dropped_total{exported_namespace=~"$namespace"}[$__rate_interval])) or label_replace(vector(0), "reason", "none", "", "")
              seriesNameFormat: '{{reason}}'
  ttft:
    kind: Panel
    spec:
      display:
        name: Time to first token p95
        description: Per model server namespace, so a site's latency sits beside the share it was sent.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: seconds
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: histogram_quantile(0.95, sum by (le, exported_namespace) (rate({__name__=~"kserve_vllm:time_to_first_token_seconds_bucket|vllm:time_to_first_token_seconds_bucket",exported_namespace=~"$namespace"}[$__rate_interval])))
              seriesNameFormat: '{{exported_namespace}}'
  queueTime:
    kind: Panel
    spec:
      display:
        name: Queue time mean
        description: Time requests waited in the model server before running.
      plugin:
        kind: TimeSeriesChart
        spec:
          legend:
            position: bottom
            mode: list
            values: []
          yAxis:
            format:
              unit: seconds
            min: 0
          visual:
            display: line
            lineWidth: 1.5
            areaOpacity: 0
            connectNulls: false
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum by (exported_namespace) (rate({__name__=~"kserve_vllm:request_queue_time_seconds_sum|vllm:request_queue_time_seconds_sum",exported_namespace=~"$namespace"}[$__rate_interval])) /
                (sum by (exported_namespace) (rate({__name__=~"kserve_vllm:request_queue_time_seconds_count|vllm:request_queue_time_seconds_count",exported_namespace=~"$namespace"}[$__rate_interval])) >
                0)
              seriesNameFormat: '{{exported_namespace}}'
  affinityKept:
    kind: Panel
    spec:
      display:
        name: Prompt affinity kept
        description: 'Share of follow-up turns the gateway sent back to the site that already holds the conversation. Exploration and load overrides send a turn elsewhere on purpose; no match means the
          index had forgotten it. Needs chat traffic: text completions carry no conversation and count as not applicable.'
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: percent-decimal
            decimalPlaces: 1
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum(rate(grid_route_prefix_affinity_total{outcome="sticky",exported_namespace=~"$namespace"}[$__rate_interval])) / (sum(rate(grid_route_prefix_affinity_total{outcome!="not_applicable",exported_namespace=~"$namespace"}[$__rate_interval]))
                > 0)
  pollsOk:
    kind: Panel
    spec:
      display:
        name: Load reading fetch success rate
        description: Share of this gateway's fetches of peer sites' load readings that succeeded. Below 100% a site is routed on its last good reading until it answers again.
      plugin:
        kind: StatChart
        spec:
          calculation: last-number
          format:
            unit: percent-decimal
            decimalPlaces: 1
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              query: sum(rate(grid_signals_poll_total{result="ok",exported_namespace=~"$namespace"}[$__rate_interval])) / (sum(rate(grid_signals_poll_total{exported_namespace=~"$namespace"}[$__rate_interval]))
                > 0)
  sharePerCandidate:
    kind: Panel
    spec:
      display:
        name: Share of requests per model and site
        description: Each candidate's share of the requests this gateway sent anywhere, routed or fallback.
      plugin:
        kind: TimeSeriesChart
        spec:
          yAxis:
            format:
              unit: percent-decimal
              decimalPlaces: 0
            max: 1
            min: 0
          visual:
            stack: all
            areaOpacity: 1
            lineWidth: 0.25
            connectNulls: false
            display: line
          legend:
            position: bottom
            mode: list
            values: []
      queries:
      - kind: TimeSeriesQuery
        spec:
          plugin:
            kind: PrometheusTimeSeriesQuery
            spec:
              datasource: *id001
              seriesNameFormat: '{{site}} {{backend}}'
              query: sum by (site, backend) (rate(grid_route_decisions_total{site=~"$site",backend=~"$backend",reason=~"routed|fallback",exported_namespace=~"$namespace"}[$__rate_interval])) / ignoring(site,
                backend) group_left() (sum(rate(grid_route_decisions_total{reason=~"routed|fallback",exported_namespace=~"$namespace"}[$__rate_interval])) > 0)
