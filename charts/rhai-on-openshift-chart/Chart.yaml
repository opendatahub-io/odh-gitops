apiVersion: v2
name: rhai-on-openshift-chart
description: A Helm chart for installing ODH/RHOAI dependencies and component configurations
type: application
version: 3.6.0
appVersion: "3.6.0"
keywords:
  - openshift
  - rhoai
  - odh
  - ai
  - rhaii
  - rhai
dependencies:
  - name: praxis-gateway
    version: "0.3.0-rc.4"
    condition: praxis-gateway.enabled
  - name: praxis-gateway
    alias: praxis-provider-gateway
    version: "0.3.0-rc.4"
    condition: praxis-provider-gateway.enabled
  - name: ai-grid-o11y-hub
    version: 0.1.0
    condition: ai-grid-o11y-hub.enabled
  - name: ai-grid-o11y-spoke
    version: 0.1.0
    condition: ai-grid-o11y-spoke.enabled
