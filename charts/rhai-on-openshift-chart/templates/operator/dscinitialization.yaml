{{- /*
DSCInitialization configuration
*/ -}}
{{- if include "rhoai-dependencies.crdExists" (dict "crdName" "dscinitializations.dscinitialization.opendatahub.io" "root" $) }}
{{- $operatorType := .Values.operator.type -}}
{{- $operatorConfig := index .Values.operator $operatorType -}}
{{- /* When the ai-grid-o11y-spoke subchart is enabled, ensure the DSCInitialization
     monitoring spec exposes a prometheus/rhacm exporter on the spoke's collector
     port. Preserve other user-supplied exporter options; the parent/spoke
     connection is validated independently of CRD availability. */ -}}
{{- $dsci := deepCopy (.Values.services.monitoring.dsci | default dict) -}}
{{- $spoke := index .Values "ai-grid-o11y-spoke" -}}
{{- if $spoke.enabled }}
{{-   $metrics := deepCopy (index $dsci "metrics" | default dict) -}}
{{-   $exporters := deepCopy (index $metrics "exporters" | default dict) -}}
{{-   $rhacm := deepCopy (index $exporters "prometheus/rhacm" | default dict) -}}
{{-   if not $rhacm.endpoint }}
{{-     $_ := set $rhacm "endpoint" (printf "0.0.0.0:%v" $spoke.collector.port) }}
{{-   end }}
{{-   $_ := set $exporters "prometheus/rhacm" $rhacm -}}
{{-   $_ := set $metrics "exporters" $exporters -}}
{{-   $_ := set $dsci "metrics" $metrics -}}
{{- end }}
apiVersion: dscinitialization.opendatahub.io/v2
kind: DSCInitialization
metadata:
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
  name: default-dsci
spec:
  monitoring:
    managementState: {{ include "rhoai-dependencies.effectiveServiceManagementState" (dict "state" .Values.services.monitoring.dsci.managementState "root" $ "name" "monitoring") }}
    namespace: {{ $operatorConfig.monitoringNamespace }}
    {{- range $key, $value := $dsci }}
    {{- if and (ne $key "managementState") (not (empty $value)) }}
    {{ $key }}:
      {{- $value | toYaml | nindent 6 }}
    {{- end }}
    {{- end }}
  applicationsNamespace: {{ $operatorConfig.applicationsNamespace }}
  trustedCABundle:
    managementState: {{ .Values.trustedCABundle.managementState }}
    customCABundle: {{ .Values.trustedCABundle.customCABundle | quote }}
{{- end }}
