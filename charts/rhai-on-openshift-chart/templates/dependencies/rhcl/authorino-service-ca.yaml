{{- $dep := .Values.dependencies.rhcl -}}
{{- $shouldInstall := include "rhoai-dependencies.shouldInstall" (dict "dependencyName" "rhcl" "dependency" $dep "root" $) -}}
{{- if eq $shouldInstall "true" }}
{{- if and .Values.argocd.enabled $dep.config $dep.config.authorinoServiceCaTrust }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorino
  namespace: {{ $dep.olm.namespace }}
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false,DisableClientSideApplyMigration=true,Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "10"
spec:
  template:
    spec:
      containers:
        - name: authorino
          env:
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/var/run/secrets/kubernetes.io/serviceaccount
{{- end }}
{{- end }}
