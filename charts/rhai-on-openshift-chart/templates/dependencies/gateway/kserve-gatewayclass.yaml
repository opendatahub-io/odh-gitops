{{- $kserve := .Values.components.kserve | default dict -}}
{{- $kserveDsc := $kserve.dsc | default dict -}}
{{- $effectiveKserveState := include "rhoai-dependencies.effectiveComponentManagementState" (dict "state" $kserveDsc.managementState "root" . "name" "kserve") -}}
{{- $isKserveManaged := include "rhoai-dependencies.isComponentActive" $effectiveKserveState -}}
{{- $gwClass := $kserve.gatewayClass | default dict -}}
{{- $create := ($gwClass.create | toString) -}}
{{- if or (eq $create "true") (and (eq $create "auto") $isKserveManaged) }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $gwClass.name | default "openshift-ai-inference" }}
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
spec:
  {{- toYaml ($gwClass.spec | default (dict "controllerName" "openshift.io/gateway-controller/v1")) | nindent 2 }}
{{- end }}
---
{{- $gateway := $kserve.gateway | default dict -}}
{{- $gwCreate := ($gateway.create | toString) -}}
{{- if or (eq $gwCreate "true") (and (eq $gwCreate "auto") $isKserveManaged) }}
{{- range $i, $listener := $gateway.spec.listeners }}
  {{- $ns := (($listener.allowedRoutes | default dict).namespaces | default dict) }}
  {{- if not $ns.from }}
    {{- fail (printf "components.kserve.gateway.spec.listeners[%d].allowedRoutes.namespaces.from is required. Choose: Selector (recommended) or Same.\nSet it in your values file or use: --set-json 'components.kserve.gateway.spec.listeners=[{\"name\":\"https\",\"port\":443,\"protocol\":\"HTTPS\",\"allowedRoutes\":{\"namespaces\":{\"from\":\"Selector\",\"selector\":{\"matchLabels\":{\"example-label\":\"true\"}}}}}]'" $i) }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name | default "openshift-ai-inference" }}
  namespace: {{ $gateway.namespace | default "openshift-ingress" }}
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
    {{- with $gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $gateway.spec | nindent 2 }}
{{- end }}
