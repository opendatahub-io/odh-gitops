{{- include "rhoai-dependencies.applyProfileValues" . -}}
{{- if include "rhoai-dependencies.otelCertManagerGateEnabled" . }}
{{- $dep := .Values.dependencies.opentelemetry -}}
{{- $gate := $dep.certManagerReadiness -}}
{{- $name := include "rhoai-dependencies.otelCertManagerGateName" . -}}
{{- /* The operator template is the sole Namespace owner; it moves that existing
     Namespace to -30. createNamespace=false requires an external Namespace owner. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $dep.olm.namespace }}
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-gate
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [certificates.cert-manager.io, certificaterequests.cert-manager.io, issuers.cert-manager.io]
    verbs: [get]
  - nonResourceURLs: [/apis/cert-manager.io/v1]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-gate
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-gate
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $dep.olm.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $dep.olm.namespace }}
  labels:
    {{- include "rhoai-dependencies.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-20"
    # Retain success/failure logs until the next full sync, which recreates the Job.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: {{ add $gate.timeoutSeconds 30 }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: otel-cert-manager-readiness
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: readiness
          image: {{ $gate.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $gate.resources | nindent 12 }}
          env:
            - name: TIMEOUT_SECONDS
              value: {{ $gate.timeoutSeconds | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ $gate.pollIntervalSeconds | quote }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ $gate.requestTimeoutSeconds | quote }}
          command: [/bin/bash, -c]
          args:
            - |
              {{- regexReplaceAll "(?m)^ +$" (.Files.Get "files/wait-for-cert-manager.sh" | nindent 14) "" }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
