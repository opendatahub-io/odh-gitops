# Source: rhai-on-xks-chart/templates/hooks/post-install-crs-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rhai-post-install-crs
  namespace: default
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        helm.sh/chart: HELM_CHART_VERSION_REDACTED
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Never
      serviceAccountName: rhai-post-install-hook
      imagePullSecrets:
        - name: rhai-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-crs
          image: "registry.redhat.io/openshift4/ose-cli-rhel9:v4.20@sha256:d876c1d98b39d65c00c4261431bb84b90284699f3aef84d8701a25c786fb79a1"
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Creating AzureKubernetesEngine CR..."
              kubectl apply -f - <<'EOF'
              apiVersion: infrastructure.opendatahub.io/v1alpha1
              kind: AzureKubernetesEngine
              metadata:
                name: default-azurekubernetesengine
                labels:
                  helm.sh/chart: HELM_CHART_VERSION_REDACTED
                  app.kubernetes.io/managed-by: Helm
              spec:
                dependencies:
                  certManager:
                    configuration: {}
                    managementPolicy: Managed
                  gatewayAPI:
                    configuration: {}
                    managementPolicy: Managed
                  lws:
                    configuration:
                      namespace: openshift-lws-operator
                    managementPolicy: Unmanaged
                  sailOperator:
                    configuration:
                      namespace: istio-system
                    managementPolicy: Managed
              EOF
              echo "Waiting for CRD platforms.config.opendatahub.io to be established..."
              kubectl wait --for condition=established --timeout=300s crd/platforms.config.opendatahub.io
              echo "Creating Platform CR..."
              kubectl apply -f - <<'EOF'
              apiVersion: config.opendatahub.io/v1alpha1
              kind: Platform
              metadata:
                name: default
                labels:
                  helm.sh/chart: HELM_CHART_VERSION_REDACTED
                  app.kubernetes.io/managed-by: Helm
              spec:
                modules:
                  kserve:
                    managementState: Managed
              EOF
              echo "Waiting for CRD kserves.components.platform.opendatahub.io to exist..."
              elapsed=0; while [ $elapsed -lt 300 ]; do
                kubectl get crd/kserves.components.platform.opendatahub.io &>/dev/null && break
                sleep 5; elapsed=$((elapsed + 5))
              done
              echo "Waiting for CRD kserves.components.platform.opendatahub.io to be established..."
              kubectl wait --for condition=established --timeout=300s crd/kserves.components.platform.opendatahub.io
              echo "Creating Kserve CR..."
              kubectl apply -f - <<'EOF'
              apiVersion: components.platform.opendatahub.io/v1alpha1
              kind: Kserve
              metadata:
                name: default-kserve
                labels:
                  helm.sh/chart: HELM_CHART_VERSION_REDACTED
                  app.kubernetes.io/managed-by: Helm
              spec: {}
              EOF
              echo "Done."

