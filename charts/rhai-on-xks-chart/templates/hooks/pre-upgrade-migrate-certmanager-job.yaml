{{- if .Values.enabled }}
{{- if (include "rhai-on-xks-chart.imagePullSecretEnabled" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: rhai-migrate-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerConfigJson | b64enc }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - list
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - roles
    verbs:
      - get
      - list
      - patch
      - escalate
      - bind
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - rolebindings
    verbs:
      - get
      - list
      - patch
      - bind
  - apiGroups:
      - operator.openshift.io
    resources:
      - certmanagers
    verbs:
      - get
      - list
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhai-pre-upgrade-migrate-certmanager
subjects:
  - kind: ServiceAccount
    name: rhai-pre-upgrade-migrate-certmanager
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "rhai-on-xks-chart.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: rhai-pre-upgrade-migrate-certmanager
      {{- if (include "rhai-on-xks-chart.imagePullSecretEnabled" .) }}
      imagePullSecrets:
        - name: rhai-migrate-pull-secret
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-certmanager
          image: {{ required "hooks.cliImage is required" .Values.hooks.cliImage | quote }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CERT_MANAGER_ENABLED
              value: {{ index .Values "cert-manager-operator" "enabled" | quote }}
            - name: OPERATOR_NS
              value: {{ index .Values "cert-manager-operator" "operatorNamespace" | quote }}
            - name: OPERAND_NS
              value: {{ index .Values "cert-manager-operator" "operandNamespace" | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              OLD_RELEASE="cert-manager-operator"

              # Returns 0 when cert-manager was installed by RHAI (subchart, parent release, or prior CCM standalone release).
              is_rhai_managed() {
                if kubectl get secrets -A -l "owner=helm,name=${OLD_RELEASE}" --no-headers 2>/dev/null | grep -q .; then
                  return 0
                fi
                if kubectl get certmanager cluster &>/dev/null; then
                  local owner
                  owner=$(kubectl get certmanager cluster \
                    -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                  if [[ "$owner" == "$OLD_RELEASE" || "$owner" == "$RELEASE_NAME" ]]; then
                    return 0
                  fi
                fi
                if kubectl get namespace "${OPERATOR_NS}" &>/dev/null; then
                  local owner
                  owner=$(kubectl get namespace "${OPERATOR_NS}" \
                    -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                  if [[ "$owner" == "$OLD_RELEASE" || "$owner" == "$RELEASE_NAME" ]]; then
                    return 0
                  fi
                fi
                if kubectl get namespace "${OPERAND_NS}" &>/dev/null; then
                  local owner
                  owner=$(kubectl get namespace "${OPERAND_NS}" \
                    -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                  if [[ "$owner" == "$OLD_RELEASE" || "$owner" == "$RELEASE_NAME" ]]; then
                    return 0
                  fi
                fi
                return 1
              }

              # Returns 0 if resource absent or RHAI-owned; 1 if present but external/unowned.
              verify_cleanup_target() {
                local ns_args="$1"
                local resource="$2"

                if ! kubectl get $ns_args "$resource" &>/dev/null; then
                  return 0
                fi

                local owner
                owner=$(kubectl get $ns_args "$resource" \
                  -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                if [[ "$owner" == "$OLD_RELEASE" || "$owner" == "$RELEASE_NAME" ]]; then
                  return 0
                fi

                if [[ -z "$owner" ]]; then
                  echo "ERROR: ${resource} ${ns_args} exists but has no Helm release owner."
                else
                  echo "ERROR: ${resource} ${ns_args} is owned by Helm release '${owner}', not RHAI."
                fi
                return 1
              }

              # ── Cleanup path: delete CertManager CR + operands before subchart is disabled ──
              if [[ "$CERT_MANAGER_ENABLED" == "false" ]]; then
                CLEANUP_ERRORS=0
                verify_cleanup_target "" "certmanager/cluster" || CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1))
                verify_cleanup_target "" "namespace/${OPERAND_NS}" || CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1))
                verify_cleanup_target "" "namespace/${OPERATOR_NS}" || CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1))
                if [[ "$CLEANUP_ERRORS" -gt 0 ]]; then
                  echo "ERROR: Refusing to clean up cert-manager: external or unowned resources detected."
                  exit 1
                fi

                if ! kubectl get certmanager cluster &>/dev/null \
                   && ! kubectl get namespace "${OPERAND_NS}" &>/dev/null \
                   && ! kubectl get namespace "${OPERATOR_NS}" &>/dev/null; then
                  echo "No RHAI-owned cert-manager resources detected; skipping cleanup."
                  exit 0
                fi

                echo "Cleaning up RHAI-managed cert-manager before disabling subchart..."
                if kubectl get certmanager cluster &>/dev/null; then
                  kubectl patch certmanager cluster --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
                  kubectl delete certmanager cluster --timeout=30s 2>/dev/null || true
                fi
                for deploy in cert-manager cert-manager-cainjector cert-manager-webhook; do
                  kubectl delete deployment "${deploy}" -n "${OPERAND_NS}" \
                    --ignore-not-found --timeout=60s 2>/dev/null || true
                done
                kubectl delete deployment cert-manager-operator-controller-manager \
                  -n "${OPERATOR_NS}" --ignore-not-found --timeout=60s 2>/dev/null || true
                kubectl delete namespace "${OPERAND_NS}" --ignore-not-found --timeout=60s 2>/dev/null || true
                kubectl delete namespace "${OPERATOR_NS}" --ignore-not-found --timeout=60s 2>/dev/null || true
                echo "Cert-manager cleanup complete."
                exit 0
              fi

              # ── Fail upgrade when external cert-manager occupies the operand namespace ──
              if kubectl get namespace "${OPERAND_NS}" &>/dev/null && ! is_rhai_managed; then
                OWNER=$(kubectl get namespace "${OPERAND_NS}" \
                  -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                echo "ERROR: namespace ${OPERAND_NS} exists but is not RHAI-managed (Helm owner: ${OWNER:-none})."
                echo "Set cert-manager-operator.enabled=false to use your own cert-manager."
                exit 1
              fi

              # ── Migration path: adopt existing RHAI-managed cert-manager resources into this release ──
              if ! is_rhai_managed; then
                echo "No RHAI-managed cert-manager detected; skipping migration."
                exit 0
              fi

              OLD_SECRETS=$(kubectl get secrets -A -l "owner=helm,name=${OLD_RELEASE}" \
                -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

              echo "Migrating cert-manager resources to release '${RELEASE_NAME}'..."
              FAILURES=0

              adopt_resource() {
                local ns_args="$1"
                local resource="$2"

                if ! kubectl get $ns_args "$resource" &>/dev/null; then
                  echo "  Skipping ${resource} ${ns_args} (not found)"
                  return
                fi

                local owner
                owner=$(kubectl get $ns_args "$resource" \
                  -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                if [[ "$owner" == "${RELEASE_NAME}" ]]; then
                  return
                fi
                if [[ "$owner" != "$OLD_RELEASE" ]]; then
                  if [[ -z "$owner" ]]; then
                    echo "  Skipping ${resource} ${ns_args} (no Helm release owner)"
                  else
                    echo "  Skipping ${resource} ${ns_args} (owned by Helm release '${owner}')"
                  fi
                  return
                fi

                echo "  Patching ${resource} ${ns_args}..."
                if ! kubectl annotate $ns_args "$resource" \
                  meta.helm.sh/release-name="${RELEASE_NAME}" \
                  meta.helm.sh/release-namespace="${RELEASE_NAMESPACE}" \
                  --overwrite 2>&1; then
                  echo "    FAILED to patch annotations on ${resource}"
                  FAILURES=$((FAILURES + 1))
                  return
                fi
                if ! kubectl label $ns_args "$resource" \
                  app.kubernetes.io/managed-by=Helm \
                  --overwrite 2>&1; then
                  echo "    FAILED to patch label on ${resource}"
                  FAILURES=$((FAILURES + 1))
                fi
              }

              # Adopt each resource the cert-manager-operator subchart creates.
              adopt_resource "" "namespace/${OPERATOR_NS}"
              adopt_resource "" "namespace/${OPERAND_NS}"
              adopt_resource "-n ${OPERATOR_NS}" "serviceaccount/cert-manager-operator-controller-manager"
              adopt_resource "-n ${OPERAND_NS}" "serviceaccount/cert-manager"
              adopt_resource "-n ${OPERAND_NS}" "serviceaccount/cert-manager-cainjector"
              adopt_resource "-n ${OPERAND_NS}" "serviceaccount/cert-manager-webhook"
              adopt_resource "" "clusterrole/cert-manager-operator-controller-manager-clusterrole"
              adopt_resource "" "clusterrole/cert-manager-operator-metrics-reader"
              adopt_resource "" "clusterrolebinding/cert-manager-operator-controller-manager-clusterrolebinding"
              adopt_resource "-n ${OPERATOR_NS}" "role/cert-manager-operator-controller-manager-role"
              adopt_resource "-n ${OPERATOR_NS}" "rolebinding/cert-manager-operator-controller-manager-rolebinding"
              adopt_resource "-n ${OPERATOR_NS}" "service/cert-manager-operator-controller-manager-metrics-service"
              adopt_resource "-n ${OPERATOR_NS}" "deployment.apps/cert-manager-operator-controller-manager"
              adopt_resource "" "certmanager/cluster"

              if [[ "$FAILURES" -gt 0 ]]; then
                echo "ERROR: ${FAILURES} resource(s) failed to patch. Will retry (backoffLimit=3)."
                exit 1
              fi

              # Delete old Helm release secrets after all patches succeeded
              if [[ -n "$OLD_SECRETS" ]]; then
                echo "  Deleting old release secrets for '${OLD_RELEASE}'..."
                kubectl delete secrets -A -l "owner=helm,name=${OLD_RELEASE}" 2>/dev/null || true
              fi

              echo "Migration complete."
{{- end }}
