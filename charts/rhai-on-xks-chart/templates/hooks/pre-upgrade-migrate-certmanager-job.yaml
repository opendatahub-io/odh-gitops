{{- if .Values.enabled }}
{{- if (include "rhai-on-xks-chart.imagePullSecretEnabled" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: rhai-migrate-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerConfigJson | b64enc }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - list
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - roles
    verbs:
      - get
      - list
      - patch
      - escalate
      - bind
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - rolebindings
    verbs:
      - get
      - list
      - patch
      - bind
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - operator.openshift.io
    resources:
      - certmanagers
    verbs:
      - get
      - list
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhai-pre-upgrade-migrate-certmanager
subjects:
  - kind: ServiceAccount
    name: rhai-pre-upgrade-migrate-certmanager
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhai-pre-upgrade-migrate-certmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rhai-on-xks-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "rhai-on-xks-chart.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: rhai-pre-upgrade-migrate-certmanager
      {{- if (include "rhai-on-xks-chart.imagePullSecretEnabled" .) }}
      imagePullSecrets:
        - name: rhai-migrate-pull-secret
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-certmanager
          image: {{ required "hooks.cliImage is required" .Values.hooks.cliImage | quote }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CERT_MANAGER_ENABLED
              value: {{ index .Values "cert-manager-operator" "enabled" | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              adopt_crd() {
                local crd_name="$1"
                if ! kubectl get crd "$crd_name" &>/dev/null; then
                  return
                fi
                OWNER=$(kubectl get crd "$crd_name" -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                if [[ "$OWNER" == "${RELEASE_NAME}" ]]; then
                  return
                fi
                echo "Adopting CRD ${crd_name} into Helm release '${RELEASE_NAME}'..."
                kubectl label crd "$crd_name" app.kubernetes.io/managed-by=Helm --overwrite 2>&1
                kubectl annotate crd "$crd_name" \
                  meta.helm.sh/release-name="${RELEASE_NAME}" \
                  meta.helm.sh/release-namespace="${RELEASE_NAMESPACE}" --overwrite 2>&1
              }

              # ── Adopt CRDs that may exist without Helm ownership ──
              # The xks-gateway subchart ships the GatewayConfig CRD in crds/ (applied on
              # helm install only). On upgrade, the CRD template needs Helm ownership.
              adopt_crd "gatewayconfigs.services.platform.opendatahub.io"

              # ── Cleanup path: delete CertManager CR + operands before subchart is disabled ──
              if [[ "$CERT_MANAGER_ENABLED" == "false" ]]; then
                if kubectl get certmanager cluster &>/dev/null; then
                  echo "Cleaning up cert-manager before disabling subchart..."
                  kubectl patch certmanager cluster --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
                  kubectl delete certmanager cluster --timeout=30s 2>/dev/null || true
                fi
                echo "Deleting cert-manager operand deployments..."
                kubectl delete deployments -n cert-manager --all --timeout=60s 2>/dev/null || true
                echo "Removing cert-manager namespaces..."
                kubectl delete namespace cert-manager --ignore-not-found --timeout=60s 2>/dev/null || true
                kubectl delete namespace cert-manager-operator --ignore-not-found --timeout=60s 2>/dev/null || true
                echo "Cert-manager cleanup complete."
                exit 0
              fi

              # ── Migration path: adopt existing cert-manager resources into this release ──
              OLD_RELEASE="cert-manager-operator"

              # Check if an old Helm release exists (Helm stores releases as secrets with type helm.sh/release.v1)
              OLD_SECRETS=$(kubectl get secrets -A -l "owner=helm,name=${OLD_RELEASE}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

              # Check namespace ownership as fast-path: if both namespaces are already
              # owned by this release (or don't exist), there is nothing to migrate.
              NEEDS_MIGRATION=""
              if [[ -n "$OLD_SECRETS" ]]; then
                NEEDS_MIGRATION="true"
              else
                for ns in cert-manager cert-manager-operator; do
                  if kubectl get namespace "$ns" &>/dev/null; then
                    NS_OWNER=$(kubectl get namespace "$ns" -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                    if [[ "$NS_OWNER" != "${RELEASE_NAME}" ]]; then
                      NEEDS_MIGRATION="true"
                      break
                    fi
                  fi
                done
              fi

              if [[ -z "$NEEDS_MIGRATION" ]]; then
                echo "No cert-manager migration needed."
                exit 0
              fi

              echo "Migrating cert-manager resources to release '${RELEASE_NAME}'..."
              FAILURES=0

              adopt_resource() {
                local ns_args="$1"
                local resource="$2"

                if ! kubectl get $ns_args "$resource" &>/dev/null; then
                  echo "  Skipping ${resource} ${ns_args} (not found)"
                  return
                fi

                OWNER=$(kubectl get $ns_args "$resource" -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                if [[ "$OWNER" == "${RELEASE_NAME}" ]]; then
                  return
                fi

                echo "  Patching ${resource} ${ns_args}..."
                if ! kubectl annotate $ns_args "$resource" \
                  meta.helm.sh/release-name="${RELEASE_NAME}" \
                  meta.helm.sh/release-namespace="${RELEASE_NAMESPACE}" \
                  --overwrite 2>&1; then
                  echo "    FAILED to patch annotations on ${resource}"
                  FAILURES=$((FAILURES + 1))
                  return
                fi
                if ! kubectl label $ns_args "$resource" \
                  app.kubernetes.io/managed-by=Helm \
                  --overwrite 2>&1; then
                  echo "    FAILED to patch label on ${resource}"
                  FAILURES=$((FAILURES + 1))
                fi
              }

              # Adopt each resource the cert-manager-operator subchart creates.
              adopt_resource "" "namespace/cert-manager-operator"
              adopt_resource "" "namespace/cert-manager"
              adopt_resource "-n cert-manager-operator" "serviceaccount/cert-manager-operator-controller-manager"
              adopt_resource "-n cert-manager" "serviceaccount/cert-manager"
              adopt_resource "-n cert-manager" "serviceaccount/cert-manager-cainjector"
              adopt_resource "-n cert-manager" "serviceaccount/cert-manager-webhook"
              adopt_resource "" "clusterrole/cert-manager-operator-controller-manager-clusterrole"
              adopt_resource "" "clusterrole/cert-manager-operator-metrics-reader"
              adopt_resource "" "clusterrolebinding/cert-manager-operator-controller-manager-clusterrolebinding"
              adopt_resource "-n cert-manager-operator" "role/cert-manager-operator-controller-manager-role"
              adopt_resource "-n cert-manager-operator" "rolebinding/cert-manager-operator-controller-manager-rolebinding"
              adopt_resource "-n cert-manager-operator" "service/cert-manager-operator-controller-manager-metrics-service"
              adopt_resource "-n cert-manager-operator" "deployment.apps/cert-manager-operator-controller-manager"
              adopt_resource "" "certmanager/cluster"

              if [[ "$FAILURES" -gt 0 ]]; then
                echo "ERROR: ${FAILURES} resource(s) failed to patch. Will retry (backoffLimit=3)."
                exit 1
              fi

              # Delete old Helm release secrets after all patches succeeded
              if [[ -n "$OLD_SECRETS" ]]; then
                echo "  Deleting old release secrets for '${OLD_RELEASE}'..."
                kubectl delete secrets -A -l "owner=helm,name=${OLD_RELEASE}" 2>/dev/null || true
              fi

              echo "Migration complete."
{{- end }}
