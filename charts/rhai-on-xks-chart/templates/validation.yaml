{{- include "rhai-on-xks-chart.validateCloudProvider" . -}}
{{- if .Values.enabled }}
{{- if and .Values.components.kserve.enabled .Values.components.kserve.gateway.create }}
{{- $gwNs := ((.Values.components.kserve.gateway.allowedRoutes | default dict).namespaces | default dict) }}
{{- if not $gwNs.from }}
  {{- fail "components.kserve.gateway.allowedRoutes.namespaces.from is required. Choose: Selector (recommended) or Same.\nSet it in your values file or use: --set-json 'components.kserve.gateway.allowedRoutes.namespaces={\"from\":\"Selector\",\"selector\":{\"matchLabels\":{\"example-label\":\"true\"}}}'" }}
{{- end }}
{{- end }}
{{- if and .Values.components.aigateway.enabled .Values.components.aigateway.modelsAsAService.gateway.create }}
{{- $maasNs := ((.Values.components.aigateway.modelsAsAService.gateway.allowedRoutes | default dict).namespaces | default dict) }}
{{- if not $maasNs.from }}
  {{- fail "components.aigateway.modelsAsAService.gateway.allowedRoutes.namespaces.from is required. Choose: Selector (recommended) or Same.\nSet it in your values file or use: --set-json 'components.aigateway.modelsAsAService.gateway.allowedRoutes.namespaces={\"from\":\"Selector\",\"selector\":{\"matchLabels\":{\"example-label\":\"true\"}}}'" }}
{{- end }}
{{- end }}
{{- if and (include "rhai-on-xks-chart.aiGridManaged" .) (gt (len .Values.rhaiOperator.applicationsNamespace) 55) }}
{{- fail "rhaiOperator.applicationsNamespace must be 55 characters or fewer when AI Grid is Managed so the chart can create its derived *-ai-grid namespace" }}
{{- end }}
{{- end }}
