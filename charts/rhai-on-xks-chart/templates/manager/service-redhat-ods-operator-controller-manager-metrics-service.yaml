{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rhods-operator-metrics-tls
  labels:
    name: rhods-operator
  name: rhai-operator-controller-manager-metrics-service
  namespace: {{ .Values.rhaiOperator.namespace }}
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    name: rhai-operator
{{- end }}
