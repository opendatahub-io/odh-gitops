apiVersion: v2
name: rhai-on-xks-chart
description: RHAI on XKS Helm chart for non-OLM installation on non-OpenShift Kubernetes services (AWS, Azure, CoreWeave).
type: application
version: 3.5.0
appVersion: 3.5.0
dependencies:
  - name: cert-manager-operator
    version: "1.1.0"
    repository: "file://../dependencies/cert-manager-operator"
    condition: cert-manager-operator.enabled
  - name: xks-gateway
    version: "0.1.0"
    repository: "file://../dependencies/xks-gateway"
    condition: xks-gateway.enabled
