apiVersion: apps/v1
kind: Deployment
metadata:
  name: lws-controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    control-plane: controller-manager
    helm.sh/chart: lws-operator-1.1.0
    app.kubernetes.io/name: lws
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: lws
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: lws
      app.kubernetes.io/instance: lws
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: lws
        app.kubernetes.io/instance: lws
    spec:
      imagePullSecrets:
      - name: rhai-pull-secret
      serviceAccountName: lws-controller-manager
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      containers:
      - args:
        - --config=/controller_manager_config.yaml
        - --zap-log-level=2
        command:
        - /manager
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        image: registry.redhat.io/leader-worker-set/lws-rhel9@sha256:TOBEUPDATED
        imagePullPolicy: Always
        ports:
        - name: webhook-server
          containerPort: 9443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 1
            memory: 1Gi
        volumeMounts:
        - name: manager-config
          subPath: controller_manager_config.yaml
          mountPath: /controller_manager_config.yaml
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: manager-config
        configMap:
          name: lws-manager-config
      - name: cert
        secret:
          defaultMode: 420
          secretName: lws-webhook-server-cert
