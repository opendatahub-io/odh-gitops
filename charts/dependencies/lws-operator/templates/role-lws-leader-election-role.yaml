apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: leader-election-role
    helm.sh/chart: lws-operator-1.1.0
    app.kubernetes.io/name: lws
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
  name: lws-leader-election-role
  namespace: {{ .Values.namespace }}
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
