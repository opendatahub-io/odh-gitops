---
# Source: xks-gateway/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: rh-ai-gateway
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep

---
# Source: xks-gateway/templates/gatewayconfig.yaml
apiVersion: services.platform.opendatahub.io/v1alpha1
kind: GatewayConfig
metadata:
  # Name is enforced by CRD CEL validation: must be "default-gateway"
  name: default-gateway
  labels:
    helm.sh/chart: HELM_CHART_VERSION_REDACTED
    app.kubernetes.io/managed-by: Helm
spec:
  domain: "example.com"
  ingressMode: LoadBalancer
  certificate:
    type: SelfSigned
  oidc:
    issuerURL: "https://keycloak.example.com/realms/rhai"
    clientID: "rhai-client"
    clientSecretRef:
      name: "my-oidc-secret"
      key: "client-secret"
    secretNamespace: "rh-ai-gateway"
  cookie:
    expire: "24h"
    refresh: "1h"
  verifyProviderCertificate: true
  networkPolicy:
    ingress:
      enabled: false
