{{/*
Template-based CRD for upgrade support.
Helm only applies crds/ on "helm install", NOT on "helm upgrade". When xks-gateway is added
as a new subchart to an existing release, the CRD from crds/ is skipped. This template
ensures the CRD is applied on upgrade too. On fresh install both the crds/ and this template
produce the same CRD (idempotent apply).
Gated on .Values.enabled only — the CRD must exist even when gateway.domain is empty.
*/}}
