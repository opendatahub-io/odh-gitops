{{- $gatewayEnabled := .Values.enabled }}
{{- $gatewayDomain := .Values.gateway.domain }}
{{- $gatewayConfigured := and $gatewayEnabled $gatewayDomain }}
{{- if or $gatewayEnabled $gatewayDomain }}
{{- $hookEvents := ternary "pre-install,pre-upgrade,post-install,post-upgrade,pre-delete" "pre-upgrade" $gatewayEnabled }}
{{- $hookJobEvents := ternary "pre-install,pre-upgrade" "pre-upgrade" $gatewayEnabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xks-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xks-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hookEvents }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xks-gateway-config
  labels:
    {{- include "xks-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hookEvents }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - services.platform.opendatahub.io
    resources:
      - gatewayconfigs
    verbs:
      - get
      - create
      - delete
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xks-gateway-config
  labels:
    {{- include "xks-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hookEvents }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xks-gateway-config
subjects:
  - kind: ServiceAccount
    name: xks-gateway-config
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: xks-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xks-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hookJobEvents }}
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "xks-gateway.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: xks-gateway-config
      {{- with .Values.hooks.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-config
          image: {{ required "hooks.cliImage is required" .Values.hooks.cliImage | quote }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              CRD_NAME="gatewayconfigs.services.platform.opendatahub.io"
{{- if $gatewayEnabled }}
              echo "Ensuring GatewayConfig CRD exists before enabling xks-gateway..."
              kubectl apply -f - <<'GATEWAY_CONFIG_CRD'
{{ .Files.Get "crds/customresourcedefinition-gatewayconfigs.services.platform.opendatahub.io.yaml" | trim | indent 14 }}
              GATEWAY_CONFIG_CRD
              kubectl wait --for=condition=Established "crd/${CRD_NAME}" --timeout=300s
{{- if and (not $gatewayConfigured) (not .Release.IsInstall) }}
              echo "GatewayConfig is disabled; deleting default-gateway..."
              kubectl delete gatewayconfig/default-gateway --ignore-not-found --timeout=300s
{{- end }}
{{- else }}
              if kubectl get "crd/${CRD_NAME}" >/dev/null 2>&1; then
                echo "GatewayConfig is disabled; deleting default-gateway..."
                kubectl delete gatewayconfig/default-gateway --ignore-not-found --timeout=300s
              else
                echo "GatewayConfig CRD is not installed; nothing to delete."
              fi
{{- end -}}
{{- end }}
{{- if $gatewayConfigured }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: xks-gateway-config-apply
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xks-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "xks-gateway.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: xks-gateway-config
      {{- with (.Values.hooks.postImagePullSecretName | default .Values.hooks.imagePullSecretName) }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-config
          image: {{ required "hooks.cliImage is required" .Values.hooks.cliImage | quote }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Applying GatewayConfig..."
              kubectl apply -f - <<'GATEWAY_CONFIG'
{{ include "xks-gateway.gatewayConfigManifest" . | trim | indent 14 }}
              GATEWAY_CONFIG
{{- end }}
{{- if $gatewayEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: xks-gateway-config-delete
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xks-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "xks-gateway.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: xks-gateway-config
      {{- with .Values.hooks.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: delete-gateway-config
          image: {{ required "hooks.cliImage is required" .Values.hooks.cliImage | quote }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              CRD_NAME="gatewayconfigs.services.platform.opendatahub.io"
              if kubectl get "crd/${CRD_NAME}" >/dev/null 2>&1; then
                echo "Deleting default-gateway..."
                kubectl delete gatewayconfig/default-gateway --ignore-not-found --timeout=300s
              else
                echo "GatewayConfig CRD is not installed; nothing to delete."
              fi
{{- end -}}
