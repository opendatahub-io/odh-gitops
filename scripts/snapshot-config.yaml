# Snapshot configuration for all Helm charts
# Each chart defines its snapshots with optional --set flags
#
# Usage:
#   make chart-snapshots                    # Generate all snapshots
#   make chart-snapshots CHART_NAME=<name>  # Generate for specific chart
#   make chart-test                         # Test all snapshots
#   make chart-test CHART_NAME=<name>       # Test specific chart

charts:
  rhai-on-openshift-chart:
    # Optional: additional values file for testing (relative to chart path)
    testValuesFile: test/testValues.yaml
    snapshots:
      - name: default
        # No additional flags for default

      - name: skip-crd-check-odh
        setFlags:
          - skipCrdCheck=true
          - operator.type=odh

      - name: skip-crd-check-rhoai
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai

      - name: all-components-managed
        valuesFiles:
          - docs/examples/values-all-components-managed.yaml
        setFlags:
          - skipCrdCheck=true

      - name: install-with-helm-dependencies
        setFlags:
          - skipCrdCheck=true
          - tags.install-with-helm-dependencies=true

      - name: inference-only
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - profile=rhaii

      - name: profile-with-customization
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - profile=rhaii
          - components.kserve.dependencies.jobSet=true

      - name: v3-aihub-data
        setFlags:
          - skipCrdCheck=true
          - components.aiHub.dsc.managementState=Managed
          - components.data.dsc.featureStore.managementState=Managed
          - components.data.dsc.dataRegistry.managementState=Managed
          - components.dashboard.dsc.standard.managementState=Managed
          - components.dashboard.dsc.maasPortal.managementState=Managed
          - components.workbenches.dsc.workbenchesV2.managementState=Managed
          - components.mcplifecycleoperator.dsc.managementState=Managed

      # Structural components must activate dependencies through their children
      # (correct-by-test for the DSC v3 structural branch in the shared helpers)
      - name: structural-component-dependency
        setFlags:
          - skipCrdCheck=true
          - components.dashboard.dependencies.certManager=true
          - components.dashboard.dsc.standard.managementState=Managed

      - name: structural-component-dependency-removed
        setFlags:
          - skipCrdCheck=true
          - components.dashboard.dependencies.certManager=true

      # Deprecated DSC v2 keys: translated to v3 and rendered with
      # deprecation comments (and a NOTES.txt Deprecation Notices section
      # via install --dry-run)
      - name: legacy-modelregistry
        setFlags:
          - skipCrdCheck=true
          - components.modelregistry.dsc.managementState=Managed
          - components.modelregistry.dsc.registriesNamespace=my-registries

      - name: legacy-feastoperator
        setFlags:
          - skipCrdCheck=true
          - components.feastoperator.dsc.managementState=Managed

      - name: legacy-dashboard-managementstate
        setFlags:
          - skipCrdCheck=true
          - components.dashboard.dsc.managementState=Managed

      # Legacy key present but all-null: pruned silently, no translation,
      # no deprecation notice, render identical to default
      - name: legacy-null-key
        setFlags:
          - skipCrdCheck=true
        setJsonFlags:
          - 'components.modelregistry={"dsc":{"managementState":null}}'

      # Legacy operator-type defaults are translated old-wins (upgrade
      # continuity for customized defaults)
      - name: legacy-modelregistry-defaults
        setJsonFlags:
          - 'components.modelregistry={"defaults":{"odh":{"registriesNamespace":"my-default-ns"}}}'
        setFlags:
          - skipCrdCheck=true

      # Customizing defaults on BOTH old and new keys is ambiguous and must fail
      - name: legacy-defaults-conflict
        expectFail: true
        expectMessage: "components.modelregistry.defaults.odh.registriesNamespace and components.aiHub.defaults.odh.instancesNamespace are both customized"
        setJsonFlags:
          - 'components.modelregistry={"defaults":{"odh":{"registriesNamespace":"old-ns"}}}'
          - 'components.aiHub={"defaults":{"odh":{"instancesNamespace":"new-ns"}}}'
        setFlags:
          - skipCrdCheck=true

      # Old and new keys set at once is ambiguous and must fail the render
      - name: legacy-and-new-conflict
        expectFail: true
        expectMessage: "components.modelregistry and components.aiHub are mutually exclusive"
        setFlags:
          - skipCrdCheck=true
          - components.modelregistry.dsc.managementState=Managed
          - components.aiHub.dsc.managementState=Managed

      # Deprecated keys with no DSC v3 equivalent must fail the render
      - name: legacy-trainingoperator
        expectFail: true
        expectMessage: "components.trainingoperator was removed in DSC v3"
        setFlags:
          - skipCrdCheck=true
          - components.trainingoperator.dsc.managementState=Managed

      - name: legacy-kserve-wva
        expectFail: true
        expectMessage: "components.kserve.dsc.wva was removed in DSC v3"
        setFlags:
          - skipCrdCheck=true
          - components.kserve.dsc.wva.managementState=Managed

      - name: with-rhcl-config
        setFlags:
          - skipCrdCheck=true
          - components.kserve.dsc.managementState=Managed
          - dependencies.rhcl.olm.config.env[0].name=RELATED_IMAGE_WASMSHIM
          - dependencies.rhcl.olm.config.env[0].value=image-value

      - name: maas-profile
        setFlags:
          - skipCrdCheck=true
          - operator.type=odh
          - profile=maas
          - components.kserve.dsc.rawDeploymentServiceConfig=Headed
        setJsonFlags:
          - 'components.aigateway.modelsAsAService.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"maas.opendatahub.io/gateway-access":"true"}}}'
          - 'components.kserve.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"maas.opendatahub.io/gateway-access":"true"}}}'

      - name: maas-profile-with-clusterip-route
        setFlags:
          - skipCrdCheck=true
          - profile=maas
          - components.aigateway.modelsAsAService.gatewayClass.create=true
          - components.aigateway.modelsAsAService.gatewayClass.name=openshift-default
          - components.aigateway.modelsAsAService.gateway.spec.gatewayClassName=openshift-default
          - components.aigateway.modelsAsAService.gateway.openshiftRoute.enabled=true
          - components.aigateway.modelsAsAService.gateway.openshiftRoute.host=maas.apps.example.com
        setJsonFlags:
          - 'components.aigateway.modelsAsAService.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"All"}'
          - 'components.kserve.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"All"}'

      - name: monitoring-without-loki
        setFlags:
          - skipCrdCheck=true
          - services.monitoring.dsci.managementState=Managed
          - services.monitoring.dependencies.loki=false

      - name: monitoring-with-external-loki-olm-resources
        setFlags:
          - skipCrdCheck=true
          - services.monitoring.dsci.managementState=Managed
          - dependencies.loki.olm.createNamespace=false
          - dependencies.loki.olm.createOperatorGroup=false

  dependencies/cert-manager-operator:
    snapshots:
      - name: default

  dependencies/gateway-api:
    snapshots:
      - name: default

  dependencies/lws-operator:
    snapshots:
      - name: default

  dependencies/sail-operator:
    snapshots:
      - name: default

  dependencies/rhcl-operator:
    snapshots:
      - name: default

  rhai-on-xks-chart:
    snapshots:
      - name: with-custom-namespace
        setFlags:
          - azure.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - rhaiOperator.namespace=rhai-operator
          - rhaiOperator.applicationsNamespace=rhai-applications
          - azure.kubernetesEngine.spec.dependencies.lws.configuration.namespace=custom-lws
          - azure.kubernetesEngine.spec.dependencies.lws.managementPolicy=Managed
          - azure.kubernetesEngine.spec.dependencies.sailOperator.configuration.namespace=custom-istio
        setJsonFlags:
          - 'components.kserve.gateway.allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"inference-gateway-access":"true"}}}'

      - name: azure-with-cleanup-namespaces
        setFlags:
          - azure.enabled=true
          - uninstall.cleanupNamespaces=true
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-all-deps-managed
        setFlags:
          - azure.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - azure.kubernetesEngine.spec.dependencies.lws.managementPolicy=Managed
          - azure.kubernetesEngine.spec.dependencies.rhcl.managementPolicy=Managed
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-related-images
        setFlags:
          - azure.enabled=true
          - rhaiOperator.relatedImages[0].name=RELATED_IMAGE_ODH_KSERVE_LLMISVC_CONTROLLER_IMAGE
          - rhaiOperator.relatedImages[0].value=ghcr.io/opendatahub-io/kserve/odh-kserve-llmisvc-controller:release-v0.17
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-pull-secret
        setFlags:
          - azure.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-gateway-hostname
        setFlags:
          - azure.enabled=true
          - gateway.hostname=*.redhat.com
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-tls-disabled
        setFlags:
          - azure.enabled=true
          - gateway.tls.enabled=false
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-byo-issuer
        setFlags:
          - azure.enabled=true
          - gateway.hostname=*.example.com
          - gateway.tls.issuerRef.name=my-letsencrypt-issuer
          - gateway.tls.additionalSANs[0]=api.example.com
          - gateway.tls.additionalSANs[1]=a.grpc.example.com
          - gateway.tls.additionalSANs[2]=admin.example.org
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-namespaced-issuer
        setFlags:
          - azure.enabled=true
          - gateway.hostname=*.example.com
          - gateway.tls.issuerRef.kind=Issuer
          - gateway.tls.issuerRef.name=my-namespaced-issuer
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: coreweave
        setFlags:
          - coreweave.enabled=true
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: coreweave-with-pull-secret
        setFlags:
          - coreweave.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: coreweave-with-all-deps-managed
        setFlags:
          - coreweave.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - coreweave.kubernetesEngine.spec.dependencies.lws.managementPolicy=Managed
          - coreweave.kubernetesEngine.spec.dependencies.rhcl.managementPolicy=Managed
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: coreweave-with-allowed-routes-selector
        setFlags:
          - coreweave.enabled=true
          - components.kserve.gateway.allowedRoutes.namespaces.from=Selector
          - components.kserve.gateway.allowedRoutes.namespaces.selector.matchLabels.inference-gateway-access=enabled

      - name: aws
        setFlags:
          - aws.enabled=true
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: aws-with-pull-secret
        setFlags:
          - aws.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: aws-with-all-deps-managed
        setFlags:
          - aws.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - aws.kubernetesEngine.spec.dependencies.lws.managementPolicy=Managed
          - aws.kubernetesEngine.spec.dependencies.rhcl.managementPolicy=Managed
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: aws-with-allowed-routes-same
        setFlags:
          - aws.enabled=true
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-without-cert-manager
        setFlags:
          - azure.enabled=true
          - cert-manager-operator.enabled=false
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-maas
        setFlags:
          - azure.enabled=true
          - components.aigateway.enabled=true
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same
          - components.aigateway.modelsAsAService.gateway.allowedRoutes.namespaces.from=Same

      - name: azure-with-maas-and-pull-secret
        setFlags:
          - azure.enabled=true
          - components.aigateway.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - components.kserve.gateway.allowedRoutes.namespaces.from=Same
          - components.aigateway.modelsAsAService.gateway.allowedRoutes.namespaces.from=Same
