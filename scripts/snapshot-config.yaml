# Snapshot configuration for all Helm charts
# Each chart defines its snapshots with optional --set flags
#
# Usage:
#   make chart-snapshots                    # Generate all snapshots
#   make chart-snapshots CHART_NAME=<name>  # Generate for specific chart
#   make chart-test                         # Test all snapshots
#   make chart-test CHART_NAME=<name>       # Test specific chart

charts:
  rhai-on-openshift-chart:
    # Optional: additional values file for testing (relative to chart path)
    testValuesFile: test/testValues.yaml
    snapshots:
      - name: default
        # No additional flags for default

      - name: skip-crd-check-odh
        setFlags:
          - skipCrdCheck=true
          - operator.type=odh

      - name: skip-crd-check-rhoai
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai

      - name: operator-with-external-namespace
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - operator.rhoai.olm.createNamespace=false

      - name: all-components-managed
        valuesFiles:
          - docs/examples/values-all-components-managed.yaml
        setFlags:
          - skipCrdCheck=true

      - name: install-with-helm-dependencies
        setFlags:
          - skipCrdCheck=true
          - tags.install-with-helm-dependencies=true

      - name: inference-only
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - profile=rhaii

      - name: profile-with-customization
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - profile=rhaii
          - components.kserve.dependencies.jobSet=true

      - name: v3-aihub-data
        setFlags:
          - skipCrdCheck=true
          - components.aiHub.dsc.managementState=Managed
          - components.data.dsc.featureStore.managementState=Managed
          - components.data.dsc.dataRegistry.managementState=Managed
          - components.dashboard.dsc.standard.managementState=Managed
          - components.dashboard.dsc.maasPortal.managementState=Managed
          - components.workbenches.dsc.workbenchesV2.managementState=Managed
          - components.mcplifecycleoperator.dsc.managementState=Managed

      # Structural components must activate dependencies through their children
      # (correct-by-test for the DSC v3 structural branch in the shared helpers)
      - name: structural-component-dependency
        setFlags:
          - skipCrdCheck=true
          - components.dashboard.dependencies.certManager=true
          - components.dashboard.dsc.standard.managementState=Managed

      - name: structural-component-dependency-removed
        setFlags:
          - skipCrdCheck=true
          - components.dashboard.dependencies.certManager=true

      # Deprecated DSC v2 keys: translated to v3 and rendered with
      # deprecation comments (and a NOTES.txt Deprecation Notices section
      # via install --dry-run)
      - name: legacy-modelregistry
        setFlags:
          - skipCrdCheck=true
          - components.modelregistry.dsc.managementState=Managed
          - components.modelregistry.dsc.registriesNamespace=my-registries

      - name: legacy-feastoperator
        setFlags:
          - skipCrdCheck=true
          - components.feastoperator.dsc.managementState=Managed

      - name: legacy-dashboard-managementstate
        setFlags:
          - skipCrdCheck=true
          - components.dashboard.dsc.managementState=Managed

      # Legacy key present but all-null: pruned silently, no translation,
      # no deprecation notice, render identical to default
      - name: legacy-null-key
        setFlags:
          - skipCrdCheck=true
        setJsonFlags:
          - 'components.modelregistry={"dsc":{"managementState":null}}'

      # Legacy operator-type defaults are translated old-wins (upgrade
      # continuity for customized defaults)
      - name: legacy-modelregistry-defaults
        setJsonFlags:
          - 'components.modelregistry={"defaults":{"odh":{"registriesNamespace":"my-default-ns"}}}'
        setFlags:
          - skipCrdCheck=true

      # Customizing defaults on BOTH old and new keys is ambiguous and must fail
      - name: legacy-defaults-conflict
        expectFail: true
        expectMessage: "components.modelregistry.defaults.odh.registriesNamespace and components.aiHub.defaults.odh.instancesNamespace are both customized"
        setJsonFlags:
          - 'components.modelregistry={"defaults":{"odh":{"registriesNamespace":"old-ns"}}}'
          - 'components.aiHub={"defaults":{"odh":{"instancesNamespace":"new-ns"}}}'
        setFlags:
          - skipCrdCheck=true

      # Old and new keys set at once is ambiguous and must fail the render
      - name: legacy-and-new-conflict
        expectFail: true
        expectMessage: "components.modelregistry and components.aiHub are mutually exclusive"
        setFlags:
          - skipCrdCheck=true
          - components.modelregistry.dsc.managementState=Managed
          - components.aiHub.dsc.managementState=Managed

      # Deprecated keys with no DSC v3 equivalent must fail the render
      - name: legacy-trainingoperator
        expectFail: true
        expectMessage: "components.trainingoperator was removed in DSC v3"
        setFlags:
          - skipCrdCheck=true
          - components.trainingoperator.dsc.managementState=Managed

      - name: legacy-kserve-wva
        expectFail: true
        expectMessage: "components.kserve.dsc.wva was removed in DSC v3"
        setFlags:
          - skipCrdCheck=true
          - components.kserve.dsc.wva.managementState=Managed

      - name: enable-modelexpress
        setFlags:
          - skipCrdCheck=true
          - components.kserve.dsc.managementState=Managed
          - components.kserve.dsc.modelExpress.managementState=Managed

      - name: with-rhcl-config
        setFlags:
          - skipCrdCheck=true
          - components.kserve.dsc.managementState=Managed
          - dependencies.rhcl.olm.config.env[0].name=RELATED_IMAGE_WASMSHIM
          - dependencies.rhcl.olm.config.env[0].value=image-value

      - name: maas-profile
        setFlags:
          - skipCrdCheck=true
          - operator.type=odh
          - profile=maas
          - components.kserve.dsc.rawDeploymentServiceConfig=Headed
        setJsonFlags:
          - 'components.aigateway.modelsAsAService.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"maas.opendatahub.io/gateway-access":"true"}}}'
          - 'components.kserve.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"maas.opendatahub.io/gateway-access":"true"}}}'

      - name: ai-grid-profile
        setFlags:
          - skipCrdCheck=true
          - operator.type=odh
          - profile=ai-grid
        setJsonFlags:
          - 'components.aigateway.modelsAsAService.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"maas.opendatahub.io/gateway-access":"true"}}}'
          - 'components.kserve.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"Selector","selector":{"matchLabels":{"maas.opendatahub.io/gateway-access":"true"}}}'

      - name: ai-grid-removed
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - components.aigateway.dsc.aiGrid.managementState=Removed

      - name: ai-grid-parent-removed
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - components.aigateway.dsc.managementState=Removed

      - name: ai-grid-manual
        setFlags:
          - skipCrdCheck=true
          - components.aigateway.dsc.managementState=Managed
          - components.aigateway.dsc.aiGrid.managementState=Managed

      - name: ai-grid-external-runtimes
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - grid-enrollment.enabled=false
          - praxis-gateway.enabled=false

      - name: ai-grid-external-gateway
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - praxis-gateway.enabled=false

      - name: ai-grid-external-enrollment
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - grid-enrollment.enabled=false

      - name: ai-grid-invites
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - grid-enrollment.enrollment.authz=kube
          - grid-enrollment.invites.site-a.network=grid

      - name: ai-grid-reject-udp
        expectFail: true
        expectMessage: "protocol"
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - praxis-gateway.port.protocol=UDP

      - name: ai-grid-reject-plaintext-route
        expectFail: true
        expectMessage: "inline/external config requires route.externalTls"
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - praxis-gateway.route.enabled=true
          - praxis-gateway.route.host=gateway.apps.example.com

      - name: ai-grid-reject-http-telemetry
        expectFail: true
        expectMessage: "plaintext telemetry"
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - praxis-gateway.praxisConfig.source=render
          - praxis-gateway.praxisConfig.render.telemetry.otlpEndpoint=http://collector:4317

      - name: ai-grid-reject-blocked-loadbalancer
        expectFail: true
        expectMessage: "networkPolicy.from requires explicit enrollment clients"
        setFlags:
          - skipCrdCheck=true
          - profile=ai-grid
          - grid-enrollment.route.enabled=false
          - grid-enrollment.host=enrollment.example.com

      - name: ai-grid-related-images
        valuesFiles:
          - charts/rhai-on-openshift-chart/test/values-ai-grid-images.yaml
        setFlags:
          - skipCrdCheck=true

      - name: ai-grid-hub
        setFlags:
          - profile=ai-grid
          - grid-enrollment.route.enabled=false
          - skipCrdCheck=true
          - praxis-gateway.praxisConfig.byo.configMapName=grid-gateway-config
          - grid-enrollment.enrollment.authz=kube
          - grid-enrollment.enrollment.serviceAccount.create=true
          - grid-enrollment.db.type=external
          - grid-enrollment.db.external.connectionUrlSecretRef=maas-db-config

      - name: ai-grid-o11y-hub
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-hub.yaml
        setFlags:
          # The store's CRs are CRD-gated like every other dependency CR; a
          # reproducible render needs the subchart to see the flag too.
          - global.skipCrdCheck=true
          - skipCrdCheck=true

      - name: ai-grid-o11y-hub-spoke-policy
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-hub.yaml
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          # The store's CRs are CRD-gated like every other dependency CR; a
          # reproducible render needs the subchart to see the flag too.
          - global.skipCrdCheck=true
          - skipCrdCheck=true

      - name: ai-grid-o11y-hub-spoke-policy-credential-only
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-hub.yaml
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - global.skipCrdCheck=true
          - skipCrdCheck=true
          # A GitOps fleet: Argo CD renders the DSCI from the chart's own values and an
          # ApplicationSet supplies the per-cluster attributes, so the policy must not
          # patch that object too. It delivers the token alone. The endpoint is cleared
          # here to prove it is no longer read in this mode.
          - ai-grid-o11y-hub.spokePolicy.deliverConfiguration=false
          - ai-grid-o11y-hub.spokePolicy.endpoint=

      - name: ai-grid-o11y-hub-spoke-policy-reject-nothing-to-deliver
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-hub.yaml
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - global.skipCrdCheck=true
          - skipCrdCheck=true
          - ai-grid-o11y-hub.spokePolicy.deliverCredential=false
          - ai-grid-o11y-hub.spokePolicy.deliverConfiguration=false
        expectFail: true
        expectMessage: "deliverCredential and/or deliverConfiguration"

      - name: ai-grid-o11y-hub-spoke-policy-reject-missing-otlp
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - ai-grid-o11y-hub.enabled=true
          - ai-grid-o11y-hub.lokiStack.enabled=false
          - ai-grid-o11y-hub.spokePolicy.endpoint=https://hub.example.test/api/logs/v1/infrastructure/
        expectFail: true
        expectMessage: "exact ingest base path"

      - name: ai-grid-o11y-hub-spoke-policy-reject-missing-host
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - ai-grid-o11y-hub.enabled=true
          - ai-grid-o11y-hub.lokiStack.enabled=false
          - ai-grid-o11y-hub.spokePolicy.endpoint=https:///api/logs/v1/infrastructure/otlp
        expectFail: true
        expectMessage: "must include a hostname"

      - name: ai-grid-o11y-hub-spoke-policy-reject-query
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - ai-grid-o11y-hub.enabled=true
          - ai-grid-o11y-hub.lokiStack.enabled=false
          - 'ai-grid-o11y-hub.spokePolicy.endpoint=https://hub.example.test/api/logs/v1/infrastructure/otlp?extra=value'
        expectFail: true
        expectMessage: "without a query or fragment"

      - name: ai-grid-o11y-hub-spoke-policy-reject-fragment
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - ai-grid-o11y-hub.enabled=true
          - ai-grid-o11y-hub.lokiStack.enabled=false
          - 'ai-grid-o11y-hub.spokePolicy.endpoint=https://hub.example.test/api/logs/v1/infrastructure/otlp#fragment'
        expectFail: true
        expectMessage: "without a query or fragment"

      - name: ai-grid-o11y-hub-spoke-policy-reject-empty-query
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - ai-grid-o11y-hub.enabled=true
          - ai-grid-o11y-hub.lokiStack.enabled=false
          - 'ai-grid-o11y-hub.spokePolicy.endpoint=https://hub.example.test/api/logs/v1/infrastructure/otlp?'
        expectFail: true
        expectMessage: "without a query or fragment"

      - name: ai-grid-o11y-hub-spoke-policy-reject-empty-fragment
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-policy.yaml
        setFlags:
          - ai-grid-o11y-hub.enabled=true
          - ai-grid-o11y-hub.lokiStack.enabled=false
          - 'ai-grid-o11y-hub.spokePolicy.endpoint=https://hub.example.test/api/logs/v1/infrastructure/otlp#'
        expectFail: true
        expectMessage: "without a query or fragment"

      - name: ai-grid-o11y-spoke-acm
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke-acm.yaml
        setFlags:
          - skipCrdCheck=true
          - global.skipCrdCheck=true
          # The ACM path renders no Secret and no subchart objects: the hub's policy supplies
          # credentialSecret, attributes and exporters, so only storage and size appear.

      - name: ai-grid-o11y-spoke
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke.yaml
        setFlags:
          - skipCrdCheck=true
          # The token is a required value with no default; the snapshot needs a
          # placeholder, never a real credential.
          - ai-grid-o11y-spoke.credential.token=snapshot-placeholder-token
          - ai-grid-o11y-spoke.credential.enabled=true

      - name: ai-grid-o11y-spoke-credential-preserve-metrics
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke.yaml
        setFlags:
          - skipCrdCheck=true
          - ai-grid-o11y-spoke.credential.token=snapshot-placeholder-token
          # Credential delivery must preserve an independently configured metrics exporter
          # when this chart's metrics federation is disabled by the example values.
          - services.monitoring.dsci.metrics.exporters.prometheus/rhacm.endpoint=0.0.0.0:9999

      - name: ai-grid-o11y-spoke-credential-reject-namespace-mismatch
        valuesFiles:
          - docs/examples/values-ai-grid-o11y-spoke.yaml
        setFlags:
          - ai-grid-o11y-spoke.credential.token=snapshot-placeholder-token
          - ai-grid-o11y-spoke.collector.namespace=custom-monitoring
        expectFail: true
        expectMessage: "collector.namespace must match"

      - name: maas-profile-with-clusterip-route
        setFlags:
          - skipCrdCheck=true
          - profile=maas
          - components.aigateway.modelsAsAService.gatewayClass.create=true
          - components.aigateway.modelsAsAService.gatewayClass.name=openshift-default
          - components.aigateway.modelsAsAService.gateway.spec.gatewayClassName=openshift-default
          - components.aigateway.modelsAsAService.gateway.openshiftRoute.enabled=true
          - components.aigateway.modelsAsAService.gateway.openshiftRoute.host=maas.apps.example.com
        setJsonFlags:
          - 'components.aigateway.modelsAsAService.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"All"}'
          - 'components.kserve.gateway.spec.listeners[0].allowedRoutes.namespaces={"from":"All"}'

      - name: monitoring-without-loki
        setFlags:
          - skipCrdCheck=true
          - services.monitoring.dsci.managementState=Managed
          - services.monitoring.dependencies.loki=false

      - name: monitoring-with-external-loki-olm-resources
        setFlags:
          - skipCrdCheck=true
          - services.monitoring.dsci.managementState=Managed
          - dependencies.loki.olm.createNamespace=false
          - dependencies.loki.olm.createOperatorGroup=false

      - name: monitoring-with-custom-coo-operatorgroup
        setFlags:
          - skipCrdCheck=true
          - services.monitoring.dsci.managementState=Managed
          - dependencies.clusterObservability.olm.operatorGroupName=custom-coo-group

      - name: monitoring-with-external-coo
        setFlags:
          - skipCrdCheck=true
          - services.monitoring.dsci.managementState=Managed
          - dependencies.clusterObservability.enabled=false

      - name: monitoring-with-logs
        valuesFiles:
          - docs/examples/values-monitoring-with-logs.yaml
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai

      - name: monitoring-with-usage-logs
        valuesFiles:
          - docs/examples/values-monitoring-with-usage-logs.yaml
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai

      - name: o11y-spoke-rhoai
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - services.monitoring.dsci.managementState=Managed
          - ai-grid-o11y-spoke.enabled=true

      - name: o11y-spoke-odh
        setFlags:
          - skipCrdCheck=true
          - operator.type=odh
          - services.monitoring.dsci.managementState=Managed
          - ai-grid-o11y-spoke.enabled=true
          - ai-grid-o11y-spoke.collector.namespace=opendatahub

      - name: o11y-spoke-custom-collector
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - operator.rhoai.monitoringNamespace=custom-monitoring
          - services.monitoring.dsci.managementState=Managed
          - ai-grid-o11y-spoke.enabled=true
          - ai-grid-o11y-spoke.collector.namespace=custom-monitoring
          - ai-grid-o11y-spoke.collector.port=9999

      - name: o11y-spoke-preserve-exporters
        setFlags:
          - skipCrdCheck=true
          - operator.type=rhoai
          - services.monitoring.dsci.managementState=Managed
          - ai-grid-o11y-spoke.enabled=true
        setJsonFlags:
          - 'services.monitoring.dsci.metrics.exporters={"prometheus/rhacm":{"endpoint":"0.0.0.0:8890","send_timestamps":true},"prometheus/other":{"endpoint":"0.0.0.0:8891"}}'

      # Parent/spoke consistency must be checked even before CRDs are installed.
      - name: o11y-spoke-reject-namespace-mismatch
        expectFail: true
        expectMessage: "ai-grid-o11y-spoke.collector.namespace must match operator.rhoai.monitoringNamespace"
        setFlags:
          - operator.type=rhoai
          - operator.rhoai.monitoringNamespace=custom-monitoring
          - ai-grid-o11y-spoke.enabled=true

      - name: o11y-spoke-reject-endpoint-port
        expectFail: true
        expectMessage: 'endpoint must be 0.0.0.0:8890'
        setFlags:
          - operator.type=rhoai
          - ai-grid-o11y-spoke.enabled=true
        setJsonFlags:
          - 'services.monitoring.dsci.metrics.exporters={"prometheus/rhacm":{"endpoint":"0.0.0.0:9999"}}'

      - name: o11y-spoke-reject-loopback
        expectFail: true
        expectMessage: 'endpoint must be 0.0.0.0:8890'
        setFlags:
          - operator.type=rhoai
          - ai-grid-o11y-spoke.enabled=true
        setJsonFlags:
          - 'services.monitoring.dsci.metrics.exporters={"prometheus/rhacm":{"endpoint":"127.0.0.1:8890"}}'

      - name: agent-sandbox-enabled
        setFlags:
          - skipCrdCheck=true
          - dependencies.agentSandbox.enabled=true

  rhai-on-openshift-chart/charts/ai-grid-o11y-spoke:
    snapshots:
      - name: default

      - name: custom-collector
        setFlags:
          - collector.namespace=custom-monitoring
          - collector.port=9999

      - name: credential
        setFlags:
          # The usage-log half alone: a spoke outside an ACM fleet, where there is no
          # open-cluster-management-observability namespace to scrape from.
          - metrics.enabled=false
          - credential.enabled=true
          - credential.token=snapshot-placeholder-token

      - name: reject-invalid-port
        expectFail: true
        expectMessage: "port"
        setFlags:
          - collector.port=65536

      - name: reject-invalid-namespace
        expectFail: true
        expectMessage: "pattern"
        setFlags:
          - collector.namespace=Invalid_Namespace

  dependencies/cert-manager-operator:
    snapshots:
      - name: default

  dependencies/gateway-api:
    snapshots:
      - name: default

  dependencies/lws-operator:
    snapshots:
      - name: default

  dependencies/sail-operator:
    snapshots:
      - name: default

  dependencies/rhcl-operator:
    snapshots:
      - name: default

  dependencies/xks-gateway:
    snapshots:
      - name: default
        setFlags:
          - gateway.domain=example.com
          - gateway.oidc.issuerURL=https://keycloak.example.com/realms/rhai
          - gateway.oidc.clientID=rhai-client
          - gateway.oidc.clientSecretRef.name=my-oidc-secret

      - name: with-custom-settings
        valuesFiles:
          - charts/dependencies/xks-gateway/test/values-custom-domain.yaml
        setFlags:
          - gateway.subdomain=ai-platform
          - gateway.oidc.issuerURL=https://auth.example.com/realms/ai
          - gateway.oidc.clientID=ai-platform-client
          - gateway.oidc.clientSecretRef.name=ai-oidc-secret
          - gateway.oidc.clientSecretRef.key=secret
          - gateway.oidc.secretNamespace=auth-system
          - gateway.certificate.type=Provided
          - gateway.certificate.secretName=my-tls-cert
          - gateway.cookie.expire=8h
          - gateway.cookie.refresh=30m
          - gateway.providerCASecretName=keycloak-ca-cert

      - name: with-selfsigned-minimal
        setFlags:
          - gateway.domain=dev.example.com
          - gateway.oidc.issuerURL=https://keycloak.dev.example.com/realms/dev
          - gateway.oidc.clientID=dev-client
          - gateway.oidc.clientSecretRef.name=dev-oidc-secret
          - gateway.verifyProviderCertificate=false

      - name: with-network-policy-disabled
        setFlags:
          - gateway.domain=example.com
          - gateway.oidc.issuerURL=https://keycloak.example.com/realms/rhai
          - gateway.oidc.clientID=rhai-client
          - gateway.oidc.clientSecretRef.name=my-oidc-secret
          - gateway.networkPolicy.ingress.enabled=false

      - name: with-managed-oidc-secret
        setFlags:
          - gateway.domain=example.com
          - gateway.oidc.issuerURL=https://keycloak.example.com/realms/rhai
          - gateway.oidc.clientID=rhai-client
          - gateway.oidc.oidcClientSecret=test-client-secret-value
          - gateway.oidc.clientSecretRef.name=managed-oidc-secret

  rhai-on-xks-chart:
    snapshots:
      - name: with-custom-namespace
        setFlags:
          - azure.enabled=true
          - imagePullSecret.dockerConfigJson=testauth
          - rhaiOperator.namespace=rhai-operator
          - rhaiOperator.applicationsNamespace=rhai-applications
          - azure.kubernetesEngine.spec.dependencies.lws.configuration.namespace=custom-lws
          - azure.kubernetesEngine.spec.dependencies.lws.managementPolicy=Managed
          - azure.kubernetesEngine.spec.dependencies.sailOperator.configuration.namespace=custom-istio
          - azure.kubernetesEngine.spec.dependencies.rhcl.managementPolicy=Managed
          - azure.kubernetesEngine.spec.dependencies.rhcl.configuration.operatorNamespace=custom-kuadrant-operators
          - azure.kubernetesEngine.spec.dependencies.rhcl.configuration.operandNamespace=custom-kuadrant-system
        setJsonFlags:
