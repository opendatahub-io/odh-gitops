---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cluster-validation
spec:
  params:
    - name: git-url
      type: string
    - name: revision
      type: string
    - name: ocp-version
      type: string
      description: "OpenShift minor version for the ephemeral HyperShift cluster"
    - name: instance-type
      type: string
      default: "m5.xlarge"
      description: "AWS instance type for ephemeral HyperShift worker nodes"
    - name: hypershift-node-count
      type: string
      default: "3"
      description: "Number of worker nodes for the ephemeral HyperShift cluster"
    - name: hosted-management-cluster
      type: string
      default: "hosted-mgmt2"
      description: "Hosted management cluster used to provision the ephemeral cluster"
    - name: validation-type
      type: string
      default: "kustomize"
      description: "Type of validation to run: kustomize or helm"
    - name: olm-catalog-image
      type: string
      default: ""
      description: "Optional OLM catalog image to install (e.g. quay.io/rhoai/rhoai-fbc-fragment:rhoai-3.2)"
    - name: olm-channel
      type: string
      default: ""
      description: "Optional OLM channel to use for operator subscription (e.g. fast, stable)"
    - name: operator-type
      type: string
      default: "odh"
      description: "Operator type to install: odh (Open Data Hub) or rhoai (Red Hat OpenShift AI)"
  tasks:
    - name: provision-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: "9751a2028f2b3b88e4204d5c42de8eda4ebb466f"
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp-version)","architecture":"multi"}}}
        - name: env
          value: >-
            {"COMPUTE_NODE_TYPE":"$(params.instance-type)",
            "HYPERSHIFT_NODE_COUNT":"$(params.hypershift-node-count)",
            "HOSTED_MANAGEMENT_CLUSTER":"$(params.hosted-management-cluster)"}

    - name: provision-and-validate
      runAfter:
        - provision-cluster
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
          - name: ocp-version
            type: string
          - name: cluster-credentials-secret-ref
            type: string
          - name: validation-type
            type: string
          - name: olm-catalog-image
            type: string
          - name: olm-channel
            type: string
          - name: operator-type
            type: string
        results:
          - name: status
            description: Overall validation status
        volumes:
          - name: credentials
            secret:
              secretName: $(params.cluster-credentials-secret-ref)
          - name: workspace
            emptyDir: {}
        steps:
          - name: verify-cluster-and-clone
            image: quay.io/konflux-ci/appstudio-utils:latest
            workingDir: /workspace
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: OCP_VERSION
                value: $(params.ocp-version)
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: workspace
                mountPath: /workspace
            script: |
              #!/bin/bash
              set -e

              echo "=== Verifying cluster access (OCP ${OCP_VERSION}) ==="
              oc version
              oc get nodes
              echo "✅ Cluster is accessible"

              echo ""
              echo "=== Cloning repository ==="
              git clone $(params.git-url) repo
              cd repo
              git checkout $(params.git-revision)
              echo "✅ Repository cloned"

          - name: run-validation
            image: quay.io/konflux-ci/appstudio-utils:latest
            workingDir: /workspace/repo
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: OCP_VERSION
                value: $(params.ocp-version)
              - name: VALIDATION_TYPE
                value: $(params.validation-type)
              - name: OLM_CATALOG_IMAGE
                value: $(params.olm-catalog-image)
              - name: OLM_CHANNEL
                value: $(params.olm-channel)
              - name: OPERATOR_TYPE
                value: $(params.operator-type)
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: workspace
                mountPath: /workspace
            script: |
              #!/bin/bash
              set -e

              echo "=== Running ${VALIDATION_TYPE} validation on OCP ${OCP_VERSION} ==="

              # Install custom OLM catalog if specified
              if [ -n "${OLM_CATALOG_IMAGE}" ]; then
                echo ""
                echo "=== Installing custom OLM catalog ==="
                echo "Catalog image: ${OLM_CATALOG_IMAGE}"

                cat <<EOF | oc apply -f -
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: custom-catalog
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: ${OLM_CATALOG_IMAGE}
                displayName: Custom Catalog
                publisher: Custom
                updateStrategy:
                  registryPoll:
                    interval: 30m
              EOF

                echo "Waiting for catalog source to be ready..."
                # Wait for the catalog pod to be created and running
                CATALOG_READY=false
                for i in {1..30}; do
                  POD_STATUS=$(oc get pods -n openshift-marketplace -l olm.catalogSource=custom-catalog -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound")
                  if [ "${POD_STATUS}" = "Running" ]; then
                    echo "Catalog pod is running"
                    CATALOG_READY=true
                    break
                  fi
                  echo "Waiting for catalog pod... (attempt ${i}/30, status: ${POD_STATUS})"
                  # Check container waiting reasons for image pull errors
                  WAITING_REASON=$(oc get pods -n openshift-marketplace -l olm.catalogSource=custom-catalog -o jsonpath='{.items[0].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || echo "")
                  if [ "${WAITING_REASON}" = "ImagePullBackOff" ] || [ "${WAITING_REASON}" = "ErrImagePull" ]; then
                    echo "ERROR: Failed to pull catalog image. Check if the image exists and credentials are configured."
                    oc get pods -n openshift-marketplace -l olm.catalogSource=custom-catalog -o yaml
                    exit 1
                  fi
                  sleep 10
                done

                if [ "${CATALOG_READY}" != "true" ]; then
                  echo "ERROR: Catalog pod did not become ready within timeout."
                  oc get pods -n openshift-marketplace -l olm.catalogSource=custom-catalog -o yaml
                  exit 1
                fi

                echo "✅ Custom OLM catalog installed"
              fi

              # Validate operator type against allowlist
              if [ "${OPERATOR_TYPE}" != "odh" ] && [ "${OPERATOR_TYPE}" != "rhoai" ]; then
                echo "ERROR: Invalid operator type '${OPERATOR_TYPE}'. Must be 'odh' or 'rhoai'."
                exit 1
              fi

              # Build additional helm args
              HELM_EXTRA_ARGS="--set operator.type=${OPERATOR_TYPE}"
              echo "Using operator type: ${OPERATOR_TYPE}"
              if [ -n "${OLM_CATALOG_IMAGE}" ]; then
                HELM_EXTRA_ARGS="${HELM_EXTRA_ARGS} --set operator.${OPERATOR_TYPE}.olm.source=custom-catalog"
                echo "Using custom catalog for operators: custom-catalog"
              fi
              if [ -n "${OLM_CHANNEL}" ]; then
                HELM_EXTRA_ARGS="${HELM_EXTRA_ARGS} --set operator.${OPERATOR_TYPE}.olm.channel=${OLM_CHANNEL}"
                echo "Using OLM channel: ${OLM_CHANNEL}"
              fi

              if [ "${VALIDATION_TYPE}" = "helm" ]; then
                # helm-install-verify installs the helm version pinned in the Makefile (see `make helm`)

                # Install the chart (first run - operators only)
                echo ""
                echo "=== Install and verify Helm chart ==="
                make helm-install-verify HELM_EXTRA_ARGS="${HELM_EXTRA_ARGS}" OPERATOR_TYPE="${OPERATOR_TYPE}"

              else
                # Kustomize validation (default)
                echo "=== Applying and verifying dependencies ==="
                make apply-and-verify-dependencies K8S_CLI=oc
              fi

              echo ""
              echo "✅ ${VALIDATION_TYPE} validation completed successfully on OCP ${OCP_VERSION}!"

              # Set results
              echo -n "success" | tee $(results.status.path)
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.revision)
        - name: ocp-version
          value: $(params.ocp-version)
        - name: cluster-credentials-secret-ref
          value: $(tasks.provision-cluster.results.secretRef)
        - name: validation-type
          value: $(params.validation-type)
        - name: olm-catalog-image
          value: $(params.olm-catalog-image)
        - name: olm-channel
          value: $(params.olm-channel)
        - name: operator-type
          value: $(params.operator-type)
