# Requires an operator payload containing opendatahub-operator PR 4186 and
# ai-gateway-operator PR 195. Install the Grid operator/CRDs through the DSC;
# Helm owns only the gateway workload below.
profile: ai-grid-ingress
praxis-gateway:
  praxisConfig:
    byo:
      # Create this ConfigMap in the Helm release namespace with your site config.
      configMapName: grid-gateway-config
