# =============================================================================
# All Components Managed - Values Override
#
# This values file enables all components and monitoring. Use this to deploy
# the full RHOAI/ODH platform with all features enabled.
#
# Since all components default to Removed, this override explicitly sets every
# component to Managed (or Unmanaged for Kueue).
#
# Usage:
#   helm upgrade --install rhaii ./charts/rhai-on-openshift-chart \
#     -f docs/examples/values-all-components-managed.yaml \
#     -n rhai-gitops --create-namespace
# =============================================================================

# -- Enable monitoring
services:
  monitoring:
    dsci:
      managementState: Managed

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  aipipelines:
    dsc:
      managementState: Managed

  dashboard:
    dsc:
      standard:
        managementState: Managed
      maasPortal:
        managementState: Managed

  data:
    dsc:
      featureStore:
        managementState: Managed
      dataRegistry:
        managementState: Managed

  aiHub:
    dsc:
      managementState: Managed

  aigateway:
    dsc:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
    # Gateway/GatewayClass create defaults to auto (created when modelsAsAService is Managed)
    modelsAsAService:
      gateway:
        spec:
          gatewayClassName: maas-gateway-class
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchLabels:
                      maas-gateway-access: "true"

  kserve:
    dsc:
      managementState: Managed
      nim:
        managementState: Managed
    gateway:
      spec:
        gatewayClassName: openshift-ai-inference
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels:
                    inference-gateway-access: "true"

  kueue:
    dsc:
      managementState: Unmanaged

  ray:
    dsc:
      managementState: Managed

  trainer:
    dsc:
      managementState: Managed

  trustyai:
    dsc:
      managementState: Managed

  workbenches:
    dsc:
      managementState: Managed
      workbenchesV2:
        managementState: Managed

  mlflowoperator:
    dsc:
      managementState: Managed

  mcplifecycleoperator:
    dsc:
      managementState: Managed

  sparkoperator:
    dsc:
      managementState: Managed

  ogx:
    dsc:
      managementState: Managed
